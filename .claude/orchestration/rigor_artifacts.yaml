# Phase 2 rigor artifacts — single source of truth.
#
# Read by:
#   - agents/modeler.py: renders the timeline table in SYSTEM_PROMPT
#   - scripts/validate_critique_yaml.py: artifact paths for _check_* functions
#   - scripts/lib/rigor_artifacts.py: loader + render helpers
#
# To add a new artifact (e.g., for Phase N+1):
#   1. Add a new entry below.
#   2. In scripts/validate_critique_yaml.py, look up the path via
#      `from lib.rigor_artifacts import artifact_path; p = artifact_path("<id>", run_dir)`.
#   3. Run `python3 scripts/lib/rigor_artifacts.py --self-test`.
#   4. Update the CLAUDE.md phase ledger.
#
# Schema (per artifact):
#   id                 stable identifier referenced by validator code
#   path               filename relative to run_dir
#   first_draft_round  earliest round the modeler must produce a draft
#   finalize_round     round by which the artifact must be final
#   stage              data | pre_model | model | analyze | allocation | write
#   skill              skill name in .claude/skills/ that explains the contract
#   triggered_by       always | allocation | aggregation_ratio_lt_0.1
#   scope_declarable   may the modeler scope-declare instead of producing it?
#                      (false for non-scope-declarable kinds — e.g.
#                      identifiability_a_priori OVER_SATURATED)
#   produces           list of derived report paths the validator also reads
#                      (e.g. propagate_uncertainty.py reads outcome_fn.py and
#                      writes uncertainty_report.yaml)
#   description        1–2 line summary for the rendered timeline table
#   required_for_accept  (optional, Phase 21 β; read by the validator only)
#                      when the artifact's absence forbids ACCEPT at ANY round:
#                        always             — every run
#                        allocation         — when an allocation CSV /
#                                             decision_rule.md exists
#                        aggregation        — when calibration/allocation
#                                             unit ratio < 0.1
#                        fitted_parameters  — when the model fits parameters
#                                             (models/identifiability.yaml or
#                                             models/model_comparison.yaml)
#                        post_write         — only under `--post-write`
#                        never              — gate-produced / bookkeeping file
#                      Default: derived from triggered_by (always → always,
#                      allocation → allocation, aggregation_ratio_lt_0.1 →
#                      aggregation). A missing scope-declarable artifact may
#                      be declared `not_applicable` in scope_declaration.yaml
#                      (with a justification; counts against the budget).

artifacts:
  - id: data_schema
    path: data/data_schema.yaml
    first_draft_round: 1
    finalize_round: 3
    stage: data
    skill: model-validation
    triggered_by: always
    scope_declarable: false
    required_for_accept: never   # presence is round-gated by scripts/data_schema.py
    description: |
      **DATA-stage artifact** (Phase 22 δ). The data agent declares every
      processed data CSV column's kind (proportion, percent, rate, count, …),
      unit and plausible range; `scripts/data_schema.py` checks the data
      against it. Read it for units before using any data column.
      Out-of-range values and unit conflicts are HIGH, not scope-declarable.

  - id: identifiability_a_priori
    path: models/identifiability_a_priori.yaml
    first_draft_round: 1
    finalize_round: 2
    stage: pre_model
    skill: pre-model-identifiability-arithmetic
    triggered_by: always
    scope_declarable: false
    description: |
      **PRE-MODEL** (Phase 15 α). Count free fitted parameters vs independent
      calibration targets. Verdict IDENTIFIABLE if ratio < 1, MARGINAL if 1–3,
      OVER_SATURATED if > 3. **NOT scope-declarable at OVER_SATURATED — architecture
      must be fixed.** Required BEFORE the first MODEL stage spawn.

  - id: pre_mortem
    path: pre_mortem.yaml
    first_draft_round: 1
    finalize_round: 2
    stage: pre_model
    skill: pre-mortem-domain
    triggered_by: always
    scope_declarable: true
    description: |
      **PRE-MODEL** (Phase 17 α). Adversarial domain critique on a clean
      slate (only plan.md + hypotheses.md + matching expert priors).
      Concerns categorized ARCHITECTURE / DATA / FEASIBILITY / BLIND_SPOT /
      EXPERT_PRIOR with HIGH/MEDIUM/LOW severities. Modeler must address each
      HIGH in `modeling_strategy.md § Pre-mortem Responses` (or scope-declare
      with justification). Catches what gates can't — supply-chain ceilings,
      data vintage, multiplicative-independence assumptions.

  - id: outcome_fn
    path: models/outcome_fn.py
    first_draft_round: 1
    finalize_round: 3
    stage: model
    skill: uncertainty-quantification
    triggered_by: always
    scope_declarable: true
    produces:
      - uncertainty_report.yaml
    description: |
      Calibration callable returning a single deterministic outcome dict; can be
      coarse. Surrogate path requires `models/outcome_fn_calibration.md`.
      An output fixed by design is declared in `models/uq_declarations.yaml`:
      `deterministic_outputs: {output: "reason"}` (exempt only while its
      summary is constant), or, when a binding
      constraint fixes it, `pinned_by_constraint: {output_or_family:
      {constraint: <name>, value: <number>}}` (exempt only while its draws sit
      at that non-zero value; a family is the name after any `<variant>__`
      prefix). Outputs downstream of a decision rule (overrun, reserve used)
      are not constraint-pinned. An output that is zero in most draws is
      summarised by `p_nonzero` in the report (quote P(output > 0) and its SE);
      that field does not exempt a zero-width interval.

  - id: model_comparison
    path: models/model_comparison.yaml
    first_draft_round: 1
    finalize_round: 3
    stage: model
    skill: multi-structural-comparison
    triggered_by: always
    scope_declarable: true
    produces:
      - model_comparison_formal.yaml
    description: |
      At least null + simple + full candidate; AIC/BIC can be approximate.

  - id: identifiability
    path: models/identifiability.yaml
    first_draft_round: 1
    finalize_round: 3
    stage: model
    skill: identifiability-analysis
    triggered_by: always
    scope_declarable: true
    produces:
      - identifiability.yaml
    description: |
      Manifest with point estimates + bounds; loss function pointwise (see §3
      contract).

  - id: calibration_spec
    path: models/calibration_spec.yaml
    first_draft_round: 1
    finalize_round: 2
    stage: model
    skill: parameter-estimation
    triggered_by: always
    scope_declarable: false
    required_for_accept: fitted_parameters
    description: |
      **Before the first fit** (Phase 43 α, B1; schema in
      `scripts/calibration_spec.py`). Every candidate parameter gets one
      `role` (data_informed, fixed_literature, country_specific_uncertain,
      behavioural, tuning, scenario_assumption), `calibrated: true|false`
      and a `reason`, including those considered and not calibrated;
      `matches:` globs cover a group of fitted names. Every target records
      quantity, population, age, time, units, source, uncertainty and
      `provenance: observed|modelled_by_others`. HIGH if a fitted parameter
      (from `models/identifiability.yaml`) is a scenario_assumption or has
      no calibrated entry. Before widening a bound, check missing data,
      missing mechanism, structural constraint, inconsistent targets and
      mismatched target definition, and record them under `bound_changes`.

  - id: sensitivity_analysis
    path: models/sensitivity_analysis.yaml
    first_draft_round: 2
    finalize_round: 7
    stage: allocation
    skill: sensitivity-analysis-remediation
    triggered_by: allocation
    scope_declarable: true
    description: |
      After your FIRST optimizer pass; 2 load-bearing parameters, one alternative
      value each. Expand perturbations and tighten verdicts in later rounds.

  - id: effect_concordance
    path: models/effect_concordance.yaml
    first_draft_round: 1
    finalize_round: 2
    stage: allocation
    skill: mechanistic-vs-hybrid-architecture
    triggered_by: allocation
    scope_declarable: true
    description: |
      **With the first allocation** (Phase 38 β). For each intervention with a
      trial effect in the citations registry: the model's outcome ratio, plan
      vs the brief's primary comparator, in units receiving only it, against
      the trial comparison matching what the comparator already delivers.
      `scripts/effect_concordance.py` holds the modeled reduction to the
      trial's lower-CI reduction scaled to attained use (HIGH if exceeded).

  - id: headline_binding
    path: models/headline_binding.yaml
    first_draft_round: 1
    finalize_round: 2
    stage: allocation
    skill: uncertainty-quantification
    triggered_by: allocation
    scope_declarable: false   # binding comes first: no waiver
    description: |
      **With the first allocation** (S2). Map each `outcome_fn` output to the
      claims-ledger claim it reproduces (headline totals, e.g. benefit and
      cost) and, if it returns one, its per-unit package choice to the
      allocation CSV. `scripts/headline_binding.py` evaluates outcome_fn at the
      registry point estimates; any mismatch over 0.1% is HIGH, not declarable,
      and so is an uncertainty report produced by another function or older code.

  - id: mechanism_manifest
    path: models/mechanism_manifest.yaml
    first_draft_round: 1
    finalize_round: 2
    stage: model
    skill: modeling-strategy
    triggered_by: always
    scope_declarable: false
    required_for_accept: never   # required per mechanism / allocation by scripts/mechanism_manifest.py
    description: |
      **When a matched expert prior lists `requires_mechanism`** (Phase 42 γ,
      D1; `mechanism_manifest.py` prints the list). Start as simple as the
      question allows. For each listed mechanism record `modelled`
      (`code_ref: models/<file>.py::<name>`), `fixed` (`source:`), or
      `simplified` (`assumption:` + `sufficiency_test:` naming a result file
      with `varied`, `criterion`, `decision_changes: true|false`). When the
      question or signed brief itself fixes the model's form, use
      `specified_by: question|brief` with a verbatim `quote:` instead of a test,
      and state the limitation in the report. A missing
      entry, or a simplification without a result, is HIGH; a passed test
      lets the simplification stand (cite it in the report); a failed test
      means the mechanism is added next round.
      **Decision layer, whenever the run has an allocation** (Phase 47 γ, D9;
      the `decision-rule-extraction` skill): list under `decision_layer:`
      every rule, constraint, reserve, hedge, cap, threshold or contingency
      the optimisation or decision rule adds beyond the question and signed
      brief (`decision_layer: []` if none), each with `kind: decision_rule`,
      `description`, `in_recommended_plan`, `information_used`
      (`[{input, available: YYYY-MM}]`) and a `sufficiency_test` result
      solving the decision with and without it (same format, plus `feature: <id>`), or
      `specified_by: question|brief` with a verbatim `quote:`. A missing list
      or test is HIGH; so is a feature whose test shows no change and that
      stays in the plan (remove it, or keep it by a brief amendment naming
      it: `owner_amendment: AM-n`). An input available only after the
      decision date (the brief's `decision_date`, else the decision year, or
      the feature's own `decision_date`) is MEDIUM. None are declarable.

  - id: data_use
    path: models/data_use.yaml
    first_draft_round: 2
    finalize_round: 3
    stage: model
    skill: model-validation
    triggered_by: always
    scope_declarable: true
    required_for_accept: never   # optional exemption list read by scripts/data_use.py
    description: |
      **Data-use audit** (Phase 42 γ, D3). `scripts/data_use.py` reports, for
      data/processed/: a required mechanism's trigger columns (from the
      matched prior) that no code under models/ reads (MEDIUM each, unless
      the mechanism is recorded as simplified or fixed); data files no model
      code opens (one MEDIUM per run listing them); other unread columns (one
      LOW summary). List
      deliberate omissions here under `not_read_by_model: [{file, columns,
      reason}]` (`columns: ["*"]` for a whole file).

  - id: allocation_robustness
    path: models/allocation_robustness.yaml
    first_draft_round: 3
    finalize_round: 6
    stage: allocation
    skill: allocation-cross-validation
    triggered_by: allocation
    scope_declarable: true
    description: |
      Leave-one-archetype-out CV on the draft allocation; per-fold metrics may be
      coarse initially.

  - id: within_zone_heterogeneity
    path: models/within_zone_heterogeneity.yaml
    first_draft_round: 3
    finalize_round: 6
    stage: model
    skill: ecological-fallacy-quantification
    triggered_by: aggregation_ratio_lt_0.1
    scope_declarable: true
    description: |
      Required when `calibration_units / allocation_units < 0.1` (Phase 12 γ).
      Bound the impact loss with a perturbation re-run.

  - id: sanity_schema
    path: models/sanity_schema.yaml
    first_draft_round: 2
    finalize_round: 6
    stage: model
    skill: sanity-schema
    triggered_by: always
    scope_declarable: true
    description: |
      Disease-agnostic structural sanity manifest (Phase 13 α). Eight generic
      checks via `scripts/sanity_checks.py`. Each failed check emits MEDIUM
      advisory; explicit exemptions in `scope_declaration.yaml`.

  - id: optimization_quality
    path: models/optimization_quality.yaml
    first_draft_round: 3
    finalize_round: 6
    stage: allocation
    skill: optimizer-method-selection
    triggered_by: allocation
    scope_declarable: true
    description: |
      Document how primary optimizer compares to ≥1 alternative method; gap_pct
      ≤ 10% required.

  - id: universal_coverage
    path: models/universal_coverage.yaml
    first_draft_round: 3
    finalize_round: 6
    stage: allocation
    skill: mechanistic-vs-hybrid-architecture
    triggered_by: allocation
    scope_declarable: true
    description: |
      Budget required to fund all spatial units at the dominant package; surfaces
      the GC7 efficiency vs universal-coverage gap.

  - id: decision_rule
    path: decision_rule.md
    first_draft_round: 6
    finalize_round: 7
    stage: allocation
    skill: decision-rule-extraction
    triggered_by: allocation
    scope_declarable: true
    description: |
      Derived from finalized allocation; this one is genuinely late by
      construction.

  - id: coherence_audit
    path: coherence_audit.yaml
    first_draft_round: 7
    finalize_round: 8
    stage: write
    skill: evidence-sufficiency
    triggered_by: always
    scope_declarable: true
    required_for_accept: never   # Phase 21 β: the gate recomputes it
    description: |
      **POST-WRITE** (Phase 17 β). Auto-generated by
      `scripts/coherence_audit.py` after report.md is written. Three
      duties: label_coherence (prose verdict labels vs YAML source),
      cross_file_counts (prose counts/$ vs allocation CSV),
      self_contradicting (prose notes vs structured fields in same
      YAML). Validator-output artifact (script-produced, not modeler-
      produced); registered in the manifest so path resolution stays
      uniform with other rigor artifacts (Phase 16 α single-source-of-
      truth principle).

  - id: claims_ledger
    path: models/claims_ledger.yaml
    first_draft_round: 1
    finalize_round: 3
    stage: analyze
    skill: evidence-sufficiency  # Phase 21 β: no dedicated claims-ledger skill yet
    triggered_by: always
    scope_declarable: false
    description: |
      **ANALYZE-stage artifact** (Phase 18 α). Single source of truth
      for every quantitative or categorical claim that may appear in
      report.md. Since Phase 22 γ it is BUILT, not written: the analyst
      writes `models/claims_spec.yaml` (claims[].{id, claim_kind, units,
      source_artifact, source_field, causal_label, confidence}; values only
      for external claims) and `scripts/build_claims_ledger.py` reads each
      value and CI from its source artifact.
      Writer references each claim via `[CLAIM:claim_id]` syntax;
      `scripts/render_claims.py` substitutes at write-time. Coherence
      auditor's `ledger_binding` duty (Phase 18 β) verifies every
      number/label in report.md is ledger-bound. **NOT scope-
      declarable** — once ANALYZE produces results, the writer needs
      a complete ledger or it cannot produce a clean report.

  - id: benchmark_targets
    path: models/benchmark_targets.yaml
    first_draft_round: 1
    finalize_round: 4
    stage: model
    skill: benchmark-locked-acceptance
    triggered_by: always
    scope_declarable: true
    produces:
      - benchmark_match.yaml
    description: |
      **Phase 19 γ.** Literature-anchored acceptance gate. Planner
      extracts the published-benchmarks table from plan.md into
      structured YAML: each target carries `target_value`,
      `tolerance_factor` (or `tolerance_abs`), `source`. The gate locks
      it on first sight; after every model run the modeler writes the
      current values (`computed_value` or `computed_field`) to
      `models/benchmark_computed.yaml`, which wins over any copy in the
      targets file (Phase 45 γ). `scripts/benchmark_match.py` writes `benchmark_match.yaml`
      with PASS/DRIFT/MALFORMED. Drift on > 1 of N benchmarks blocks
      ACCEPT unless scope-declared with literature-grounded
      justification. Scope-declarable because some questions imply
      novel populations where direct benchmarks don't exist.
      Phase 42 γ (D5): a benchmark matched by adjusting parameters lists
      them in `tuned_parameters:` and carries `transfer: {target_covariates,
      effect_at_target, difference_stated}`, the same effect re-computed
      under the target setting's covariates (`scripts/benchmark_transfer.py`,
      MEDIUM if absent).

  # ---- Phase 21 β additions -------------------------------------------------

  - id: calibration_result
    path: models/calibration_result.yaml
    first_draft_round: 2
    finalize_round: 4
    stage: model
    skill: parameter-estimation
    triggered_by: always
    scope_declarable: false
    required_for_accept: fitted_parameters
    description: |
      **Phase 21 β.** Calibration effort record whenever parameters are
      fitted: `n_restarts`, `n_iterations`, `held_out_fold.indices` +
      held-out error, best loss per restart. Read by
      `scripts/effort_floors.py` (restart / iteration / held-out floors,
      NOT scope-declarable). Before Phase 21 no prompt asked for it, so
      those floors silently never fired.

  - id: eligibility_manifest
    path: models/eligibility_manifest.yaml
    first_draft_round: 2
    finalize_round: 4
    stage: model
    skill: eligible-population-consistency
    triggered_by: allocation
    scope_declarable: false
    required_for_accept: allocation
    description: |
      **Phase 21 β/δ.** For each intervention: the outcome-function input
      field holding its eligible population and the total-population field.
      `scripts/eligibility_probe.py` checks behaviorally that benefit is
      zero when the eligible population is zero and does not scale with the
      ineligible population. Catches the benefit-on-everyone /
      cost-on-the-eligible error class for any targeted intervention.

  - id: critique_sufficiency
    path: critique_sufficiency.yaml
    first_draft_round: 7
    finalize_round: 8
    stage: write
    skill: evidence-sufficiency
    triggered_by: always
    scope_declarable: true
    required_for_accept: post_write
    description: |
      **POST-WRITE** (Phase 19 δ). Sufficiency critic's per-claim
      OVERCLAIMED / ADEQUATE / UNDERCLAIMED verdicts. Critic-produced.

  - id: benchmark_match
    path: benchmark_match.yaml
    first_draft_round: 1
    finalize_round: 4
    stage: model
    skill: benchmark-locked-acceptance
    triggered_by: always
    scope_declarable: true
    required_for_accept: never
    description: |
      Gate-produced (`scripts/benchmark_match.py`) comparison of computed
      outputs against `models/benchmark_targets.yaml`. Do not hand-edit.

  - id: effort_floors_report
    path: effort_floors_report.yaml
    first_draft_round: 1
    finalize_round: 8
    stage: model
    skill: model-validation
    triggered_by: always
    scope_declarable: true
    required_for_accept: never
    description: |
      Gate-produced (`scripts/effort_floors.py`) effort-floor evaluation.
      Recomputed on every gate run; do not hand-edit.

  - id: writer_qa_report
    path: writer_qa_report.yaml
    first_draft_round: 7
    finalize_round: 8
    stage: write
    skill: evidence-sufficiency
    triggered_by: always
    scope_declarable: true
    required_for_accept: never
    description: |
      Gate-produced (`scripts/writer_qa.py`) post-write QA. Recomputed by
      the gate from report.md; do not hand-edit.

  - id: scope_declaration
    path: scope_declaration.yaml
    first_draft_round: 1
    finalize_round: 8
    stage: write
    skill: critique-blockers-schema
    triggered_by: always
    scope_declarable: true
    required_for_accept: never
    description: |
      Declarations for blockers the run cannot resolve. Budget-capped
      (Phase 19 β): each distinct blocker id referenced counts once,
      across every list in the file (Phase 21 β). `not_applicable:
      <artifact_id>` entries (with justification) exempt a scope-declarable
      artifact from the ACCEPT requirement and also count.

  # ---- Phase 44 α -------------------------------------------------------------

  - id: model_domain
    path: models/model_domain.yaml
    first_draft_round: 2
    finalize_round: 8
    stage: model
    skill: uncertainty-quantification
    triggered_by: always
    scope_declarable: true
    required_for_accept: never   # advisory: read by scripts/model_card.py and scripts/ask.py
    description: |
      **Advisory** (Phase 44 α). The range each outcome_fn input was simulated,
      calibrated or fitted over (`parameters: {name: {min, max, basis}}`), the
      per-unit covariate ranges (`covariates:`), an optional
      `whatif_interface.arguments` mapping a budget or objective to an
      outcome_fn params key, and `validation:` files (e.g. an emulator check).
      The harness's model card uses it as the valid domain for later what-if
      queries (`scripts/ask.py`); without it only the registry prior intervals
      count. Declare only ranges the run actually covered.

  # ---- Phase 47 ε -------------------------------------------------------------

  - id: stall_diagnoses
    path: models/stall_diagnoses.yaml
    first_draft_round: 3
    finalize_round: 8
    stage: model
    skill: modeling-strategy
    triggered_by: always
    scope_declarable: false
    required_for_accept: never   # required per stalled finding by scripts/stall_rule.py
    description: |
      **When the gate lists a stalled finding** (Phase 47 ε, A17): one present at
      `stall_rounds` consecutive gates (effort_floors.yaml). Do not patch it
      again; diagnose it. Append under `diagnoses:` an entry with `finding:`
      (the `kind:key` the gate printed), `round:`, `checks:` (each
      `cause_class` once, in this order: missing_data, missing_mechanism,
      structural_constraint, inconsistent_targets,
      mismatched_target_definition, bounds; `test:` a file in the run the check
      ran or wrote; `result:`), and `decision: fix` (with `change:`) or
      `declare`. An entry lasts `stall_rounds` rounds. A missing test file
      is HIGH, not declarable. A scope declaration of the finding also clears it.
      A `declare` entry also needs a `decision_test:` (entry `decision_tests`).

  # ---- Phase 49 α -------------------------------------------------------------

  - id: decision_tests
    path: models/decision_tests/
    first_draft_round: 2
    finalize_round: 8
    stage: model
    skill: model-fitness
    triggered_by: always
    scope_declarable: false
    required_for_accept: never   # required per declared HIGH finding by scripts/declaration_tests.py
    description: |
      **When a HIGH gate finding is to be scope-declared** (Phase 49 α, A20).
      Re-run the decision with the finding's quantity set to its target (the
      benchmark's value, a held-out fold's own parameters, the trial effect)
      and write one result file per finding, e.g.
      `models/decision_tests/<kind>_<key>.yaml`: `finding:` (`kind:key`, or
      the key; one file per benchmark id), `varied:`, `criterion:` (the
      package for a stated share of units, or the headline beyond its
      interval), `decision_changes: true|false`, and `recommendation: {with:
      <as delivered>, without: <with the quantity at its target>}`
      (optional `share_units_changed` / `share_threshold`, `produced_by:
      agent|harness`; the D1/D9 format).
      The scope_declaration.yaml entry cites it: `decision_test: <path>`. No
      change: the declaration stands; cite the test in the report. A change:
      HIGH `declared_finding_changes_decision`, fix the finding. No test:
      HIGH `scope_declaration_untested`. Exempt: `specified_by:
      question|brief` + verbatim `quote:`, `owner_amendment: AM-n` naming the
      finding, or a class in `scope_declaration_policy.yaml` (no quantity to
      vary). None are declarable.
