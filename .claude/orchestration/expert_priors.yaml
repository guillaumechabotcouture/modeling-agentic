      - source_type: paper
        citation: "Sinka ME, Bangs MJ, Manguin S, et al. The dominant Anopheles vectors of human malaria in Africa, Europe and the Middle East: occurrence data, distribution maps and bionomic précis. Parasit Vectors 2010;3:117."
        doi_or_pmid: "10.1186/1756-3305-3-117"
        year: 2010
        relevance: supporting
        found_via: manual
        excerpt: |
          (Abstract, PMID 21129198.) Predictive distribution maps for
