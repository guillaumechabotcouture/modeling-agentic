  - id: malaria_vector_bionomics_by_species
    kind: methodological_standard
    severity_if_unaddressed: HIGH
    claim: |
      Anopheles vector bionomics differ by species, so the effect of
      ITNs and IRS depends on the local species mix. The
      malariasimulation presets (R/vector_parameters.R) are, for
      anthropophagy Q0, proportion of bites taken in bed φ_B
      (phi_bednets), proportion taken indoors φ_I (phi_indoors) and
      daily adult mortality μ (mum): An. gambiae s.s. 0.92 / 0.85 /
      0.90 / 0.132; An. arabiensis 0.71 / 0.80 / 0.86 / 0.132;
      An. funestus 0.94 / 0.78 / 0.87 / 0.112. A model that applies
      one species' values everywhere overstates ITN and IRS impact
      where the more zoophagic An. arabiensis dominates (Q0 0.71 vs
      0.92). When the processed data carry species abundance by
      unit, the single-vector simplification needs a sufficiency
      test against species-weighted bionomics.
    canonical_value:
      gambiae:    {Q0: 0.92, phi_bednets: 0.85, phi_indoors: 0.90, mum: 0.132}
      arabiensis: {Q0: 0.71, phi_bednets: 0.80, phi_indoors: 0.86, mum: 0.132}
      funestus:   {Q0: 0.94, phi_bednets: 0.78, phi_indoors: 0.87, mum: 0.112}
    units: "Q0, phi_* proportions; mum per day"
    applies_when:
      domain_any: ["malaria"]
      keywords_any: ["itn", "llin", "bednet", "bed net", "nets",
                     "insecticide-treated net", "pbo", "dual-ai",
                     "dual ai", "chlorfenapyr", "irs",
                     "indoor residual spraying", "vector control"]
    requires_mechanism:
      - id: vector_bionomics_by_species
        description: |
          Vector bionomics (Q0, φ_B, φ_I, μ) are set per allocation
          unit from the unit's Anopheles species mix (separate
          species, or abundance-weighted bionomics), not one
          species' values applied to every unit. The ITN and IRS
          effect is computed with those bionomics.
        sufficiency_test: |
          Run the model with the single-vector default and again with
          species-weighted bionomics (the per-species values in
          canonical_value, weighted by each unit's abundance), across
          the units' observed abundance range. Recalibrate
          transmission (e.g. baseline EIR or larval capacity) in the
          species-weighted run so each unit reproduces the same
          baseline prevalence. The simplification fails if the
          recommended intervention package changes for more than the
          share of units stated in advance in the manifest (default
          10% of units or of population at risk), or if the headline
          outcome moves outside its uncertainty interval.
        when_data_columns_any: ["arabiensis", "gambiae", "funestus",
                                "coluzzii", "species_abundance",
                                "species_composition",
                                "species_proportion", "vector_species"]
    acknowledgment_hints:
      ["species mix", "species composition", "species-weighted",
       "An. arabiensis", "arabiensis", "vector bionomics",
       "anthropophagy", "Sherrard-Smith 2019"]
    rationale: |
      In the 2026-10 attempt-8 run (Nigeria allocation), the processed
      data held species abundance for every allocation unit, but no
      model code read it; one set of bionomics was used everywhere.
      North of 11°N (the highest-prevalence, core seasonal-
      chemoprevention area) the population-weighted mix was about 67%
      An. arabiensis, an effective Q0 of about 0.78 rather than 0.92.
      Trial benchmarks still passed because vector-control strength
      was tuned to trial sites with a different species mix. The
      pre-mortem rated the concern LOW and it was closed without a
      test (docs/design/improvement-plan.md, workstream D).
    last_literature_check: 2026-10-29
    literature_corroboration:
      - source_type: tool
        citation: "mrc-ide/malariasimulation, R/vector_parameters.R (gamb_params, arab_params, fun_params), commit 5bc90284bf893c2677762ab9a65abd5914d72e1e (2025-01-29). https://github.com/mrc-ide/malariasimulation/blob/5bc90284bf893c2677762ab9a65abd5914d72e1e/R/vector_parameters.R"
        doi_or_pmid: null
        year: 2025
        relevance: primary
        found_via: manual
        excerpt: |
          gamb_params: Q0 = .92, phi_bednets = .85, phi_indoors = .90,
          mum = .132. arab_params: Q0 = .71, phi_bednets = .8,
          phi_indoors = .86, mum = .132. fun_params: Q0 = .94,
          phi_bednets = .78, phi_indoors = .87, mum = .112. Source
          comments: phi values from Sherrard-Smith et al. 2019 PNAS;
          Q0 estimated in Griffin et al. 2010 PLoS Med.
      - source_type: paper
        citation: "Sherrard-Smith E, Skarp JE, Beale AD, et al. Mosquito feeding behavior and how it influences residual malaria transmission across Africa. Proc Natl Acad Sci USA 2019;116(30):15086-15095."
        doi_or_pmid: "10.1073/pnas.1820646116"
        year: 2019
        relevance: primary
        found_via: manual
        excerpt: |
          (Abstract, PMID 31285346.) On average 79% of bites by the
          major malaria vectors occur during the time when people are
          in bed. ... Substantial spatial heterogeneity in mosquito
          biting behavior between communities could contribute to
          differences in effectiveness of malaria control across
          Africa.
      - source_type: paper
        citation: "Griffin JT, Hollingsworth TD, Okell LC, et al. Reducing Plasmodium falciparum malaria transmission in Africa: a model-based evaluation of intervention strategies. PLoS Med 2010;7(8):e1000324."
        doi_or_pmid: "10.1371/journal.pmed.1000324"
        year: 2010
        relevance: corroborating
        found_via: manual
        excerpt: |
          (Abstract, PMID 20711482.) Model incorporating the three
          major vector species (An. gambiae s.s., An. arabiensis, and
          An. funestus). In the third moderate-transmission setting
          (EIR = 46) with An. arabiensis prevailing, these
