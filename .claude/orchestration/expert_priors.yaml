  # ------------------------------------------------------------------- #
  # Phase 42 δ: mechanism priors. Each carries `requires_mechanism`
  # (schema above). The run records each listed mechanism in
  # models/mechanism_manifest.yaml under the same `id`, as modelled,
  # fixed, or simplified; a simplified mechanism carries the result
  # of its sufficiency test. The severity makes the test required,
  # not the feature: if the test shows no decision change, the
  # simplification stands and the report cites the test.
