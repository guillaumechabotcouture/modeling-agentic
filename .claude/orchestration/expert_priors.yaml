  - id: malaria_resistance_to_net_efficacy_published_curve
    kind: methodological_standard
    severity_if_unaddressed: HIGH
    claim: |
      The effect of pyrethroid resistance on ITN efficacy (mosquito
      mortality, deterrence, feeding inhibition), and how that differs
      between pyrethroid-only and pyrethroid-PBO nets, should follow a
      published relationship fitted to experimental hut trials and
      discriminating-dose bioassays (Churcher et al. 2016 eLife; Nash
      et al. 2021; Sherrard-Smith et al. 2022 Lancet Planet Health),
      not an ad hoc scaling of a pooled effect size. Nash et al. 2021
      describe the hut-outcome-to-bioassay relationship as highly
      uncertain, so its credible range must be carried through to the
      net-type choice.
    applies_when:
      domain_any: ["malaria"]
      keywords_any: ["itn", "llin", "bednet", "bed net", "nets",
                     "insecticide-treated net", "pbo", "dual-ai",
                     "dual ai", "chlorfenapyr", "pyrethroid",
                     "net type", "insecticide resistance"]
    requires_mechanism:
      - id: resistance_to_net_efficacy
        description: |
          Per-unit net efficacy parameters (killing, deterrence or
          repellence, feeding inhibition, and their decay) are derived
          from the unit's insecticide resistance through a published
          hut-trial relationship, separately for each net type
          compared.
        sufficiency_test: |
          Replace the model's resistance-to-efficacy mapping with the
          published curve (Churcher 2016 / Nash 2021 /
          Sherrard-Smith 2022 parameterisation) for each net type,
          evaluated at the units' observed resistance values, and
          again at the lower and upper ends of the curve's credible
          interval. Recalibrate to the same baseline prevalence. The
          model's mapping fails if the chosen net type changes for
          more than the share of units stated in advance in the
          manifest (default 10% of units or of population at risk),
          or if the headline outcome moves outside its uncertainty
          interval.
        when_data_columns_any: ["pyrethroid", "insecticide",
                                "bioassay", "kdr",
                                "vector_resistance",
                                "resistance_intensity",
                                "phenotypic_resistance"]
    acknowledgment_hints:
      ["Churcher 2016", "Nash 2021", "Sherrard-Smith 2022",
       "hut trial", "experimental hut", "bioassay mortality",
       "resistance-efficacy", "resistance to efficacy"]
    rationale: |
      Net-type choice (pyrethroid-only vs PBO vs dual-AI) is a common
      allocation decision, and its ranking turns on how efficacy falls
      with resistance. A model that scales a pre-resistance pooled
      odds ratio by an assumed factor can rank net types differently
      from the published hut-trial fit, and calibration to prevalence
      alone does not detect it. Complements
      standard_llin_or_pre_resistance (data vintage of the pooled OR)
      and the malaria-modeling skill, Pitfall 4.
    last_literature_check: 2026-10-29
    literature_corroboration:
      - source_type: meta_analysis
        citation: "Churcher TS, Lissenden N, Griffin JT, Worrall E, Ranson H. The impact of pyrethroid resistance on the efficacy and effectiveness of bednets for malaria control in Africa. eLife 2016;5:e16090."
        doi_or_pmid: "10.7554/eLife.16090"
        year: 2016
        relevance: primary
        found_via: manual
        excerpt: |
          (Abstract, PMID 27547988.) Meta-analyses of bioassay studies
          and experimental hut trials are used to characterise how
          pyrethroid resistance changes the efficacy of standard
          bednets, and those containing the synergist piperonyl
          butoxide (PBO) ... even low levels of resistance would
          increase the incidence of malaria.
      - source_type: meta_analysis
        citation: "Nash RK, Lambert B, N'Guessan R, et al. Systematic review of the entomological impact of insecticide-treated nets evaluated using experimental hut trials in Africa. Curr Res Parasitol Vector Borne Dis 2021;1:100047."
        doi_or_pmid: "10.1016/j.crpvbd.2021.100047"
        year: 2021
        relevance: corroborating
        found_via: manual
        excerpt: |
          (Abstract, PMID 35284856.) As resistance rises, the
          entomological efficacy of ITNs declines. ... The
          relationship between EHT outcomes and the level of
          resistance (as measured by discriminating dose bioassays) is
          highly uncertain.
      - source_type: paper
        citation: "Sherrard-Smith E, Winskill P, Hamlet A, et al. Optimising the deployment of vector control tools against malaria: a data-informed modelling study. Lancet Planet Health 2022;6(2):e100-e109 (erratum e191)."
        doi_or_pmid: "10.1016/S2542-5196(21)00296-5"
        year: 2022
        relevance: corroborating
        found_via: manual
        excerpt: |
          (Abstract, PMID 35065707.) Published experimental hut trial
          data used to characterise pyrethroid-only versus
          pyrethroid-PBO ITNs and parameterise a transmission model
          validated against RCTs in Tanzania and Uganda; the
          additional benefit of PBO nets is highly variable and
          depends on the setting.
    found_in_runs: []

  - id: measles_age_structured_mixing_and_maternal_immunity
    kind: methodological_standard
    severity_if_unaddressed: HIGH
    claim: |
      The effect of measles routine-schedule and campaign choices
      (MCV1 age, campaign target age band, timing) depends on
      age-structured contact patterns and on how long maternal
      antibody protects infants. Contacts are strongly assortative by
      age (Mossong et al. 2008; Prem et al. 2017 project matrices to
      152 countries), and contact-adjusted immunity predicts outbreaks
      better than a single herd-immunity threshold (Funk et al. 2019).
      Maternal antibody can wane within months, earlier in infants of
      vaccinated mothers (Leuridan et al. 2010: median 0.97 months vs
      3.78 months for naturally immune mothers). A model with
      homogeneous mixing or a fixed maternal-immunity period can
      misplace the immunity gap the programme is choosing to close.
    applies_when:
      domain_any: ["measles", "mcv1", "mcv2"]
      keywords_any: ["campaign", "sia", "supplementary immunization",
                     "supplementary immunisation", "routine",
                     "mcv1", "mcv2", "schedule", "target age",
                     "age band", "age at vaccination", "catch-up",
                     "catch up", "follow-up", "outbreak response",
                     "immunity gap", "vaccine", "vaccination",
                     "immunization", "immunisation", "dose"]
    requires_mechanism:
      - id: age_structured_contacts
        description: |
          Transmission uses an age-structured contact matrix for the
          setting (a local survey, or a country-projected matrix such
          as Prem et al.), not homogeneous mixing, so the force of
          infection by age reflects who mixes with whom.
        sufficiency_test: |
          Run the model with homogeneous mixing and again with the
          setting's projected age-structured matrix. Recalibrate each
          to the same observed data (age distribution of cases, or
          age-specific seroprevalence, and incidence). The
          simplification fails if the recommended campaign target age
          band or timing, or the routine-vs-campaign ranking, changes
          for more than the share of units stated in advance in the
          manifest (default 10% of units or of the target population),
          or if the headline outcome moves outside its uncertainty
          interval.
      - id: maternal_antibody_waning
        description: |
          Infants are protected by maternal antibody for an
          age-dependent period, after which they become susceptible
          before MCV1. The duration is a parameter (by maternal
          immunity source where known), not a fixed assumption
          hidden in the age at which susceptibility starts.
        sufficiency_test: |
          Vary the mean duration of maternal protection over the
          published range, from about 1 month (infants of vaccinated
          mothers; Leuridan et al. 2010 median 0.97 months) to about
          4 months (naturally immune mothers; median 3.78 months),
          with the upper end extended to 6 months, by which over 95%
          of infants in that study had lost maternal antibody.
          Recalibrate to the same observed data. The fixed assumption
          fails if the recommended MCV1 age, campaign lower age bound
          or campaign timing changes for more than the share of units
          stated in advance in the manifest (default 10%), or if the
          headline outcome moves outside its uncertainty interval.
    acknowledgment_hints:
      ["contact matrix", "age-structured mixing", "POLYMOD",
       "Prem 2017", "maternal antibod", "maternal immunity",
       "Leuridan", "contact-adjusted immunity", "Funk 2019"]
    rationale: |
      Workstream D (docs/design/improvement-plan.md) names this as the
      measles instance of the general pattern: the setting varies in a
      way the data can capture (age-specific contacts and immunity)
      and the model collapses it. Campaign target ages and MCV1 timing
      are decisions about where the age-specific immunity gap lies; a
      model without age-structured mixing and maternal waning cannot
      place that gap, yet it can still match aggregate incidence.
      Added for D8 so the mechanism rules have a non-malaria source.
    last_literature_check: 2026-10-29
    literature_corroboration:
      - source_type: paper
        citation: "Mossong J, Hens N, Jit M, et al. Social contacts and mixing patterns relevant to the spread of infectious diseases. PLoS Med 2008;5(3):e74."
        doi_or_pmid: "10.1371/journal.pmed.0050074"
        year: 2008
        relevance: primary
        found_via: manual
        excerpt: |
          (Abstract, PMID 18366252.) Although mixing patterns are
          known to be crucial determinants for model outcome,
          researchers often rely on a priori contact assumptions with
          little or no empirical basis. ... Contact patterns were
          highly assortative with age.
      - source_type: paper
        citation: "Funk S, Knapp JK, Lebo E, et al. Combining serological and contact data to derive target immunity levels for achieving and maintaining measles elimination. BMC Med 2019;17:180."
        doi_or_pmid: "10.1186/s12916-019-1413-7"
        year: 2019
        relevance: primary
        found_via: manual
        excerpt: |
          (Abstract, PMID 31551070.) Contact-adjusted immunity levels
          predicted whether countries would experience outbreaks in
          the following decade in about 70% of countries; 95% immunity
          would have to be achieved by the age of five and maintained
          across older age groups.
      - source_type: paper
        citation: "Prem K, Cook AR, Jit M. Projecting social contact matrices in 152 countries using contact surveys and demographic data. PLoS Comput Biol 2017;13(9):e1005697."
        doi_or_pmid: "10.1371/journal.pcbi.1005697"
        year: 2017
        relevance: corroborating
        found_via: manual
        excerpt: |
          (Abstract, PMID 28898249.) POLYMOD contact data projected to
          144 other countries. Contacts are highly assortative with
          age across all countries considered, but pronounced regional
          differences in the age-specific contacts at home.
      - source_type: paper
        citation: "Leuridan E, Hens N, Hutse V, Ieven M, Aerts M, Van Damme P. Early waning of maternal measles antibodies in era of measles elimination: longitudinal study. BMJ 2010;340:c1626."
        doi_or_pmid: "10.1136/bmj.c1626"
        year: 2010
        relevance: corroborating
        found_via: manual
        excerpt: |
          (Abstract, PMID 20483946.) Presence of maternal antibodies
          endured for a median of 2.61 months: 3.78 months for infants
          of naturally infected women and 0.97 months for infants of
          vaccinated women. At 6 months of age, more than 99% of
          infants of vaccinated women and 95% of infants of naturally
          immune women had lost maternal antibodies.
      - source_type: meta_analysis
        citation: "Guerra FM, Crowcroft NS, Friedman L, et al. Waning of measles maternal antibody in infants in measles elimination settings: a systematic literature review. Vaccine 2018;36(10):1248-1255."
        doi_or_pmid: "10.1016/j.vaccine.2018.01.002"
        year: 2018
        relevance: supporting
        found_via: manual
        excerpt: |
          (Abstract, PMID 29398276.) In elimination settings, where
          most immunity is from immunization, maternal antibody levels
          are lower, infant immunity wanes earlier, and the
          susceptibility gap before infant immunization is wider. Note:
          elimination settings only; durations in high-transmission
          settings may be longer.
      - source_type: report
        citation: "WHO. Measles vaccines: WHO position paper, April 2017. Wkly Epidemiol Rec 2017;92(17):205-227."
        doi_or_pmid: "PMID:28459148"
        year: 2017
        relevance: contextual
        found_via: manual
        excerpt: |
          (Paraphrase; the full text was not re-read for this entry.)
          The recommended age for MCV1 differs by transmission
          setting (9 months where transmission continues, 12 months
          where it is low), a choice driven by maternal-antibody
          interference and infant risk.
    found_in_runs: []
