# Coverage pack (design note v2d §5): simulation-based calibration of the HARNESS calibration plus
# uncertainty chain on the compartmental engine. Its generators (oracles.py: generate_*) are the reference
# ODE, an independent latent-coverage generator and the final-size fixed point, never the engine or the
# observation code under test. Each case runs 200 replicates with fixed seeds.
#
# The calibrator is the harness `posterior` method (toolkit/analysis/calibration.py, v2d §3.1-§3.4, workstream β):
# declared priors, observation sources with a sampling frame and a measurement model (toolkit/analysis/observation.py),
# targets, and the quantities whose 95% intervals are checked. The priors match the generators' distributions
# (simulation-based calibration draws the truth from the prior). Every data-quality assumption is a declared
# source mechanism; nothing is a fitted correction factor.
#   python3 -m toolkit.engines.benchmark toolkit/engines/compartmental/benchmarks/coverage.yaml run --out <path>
engine: toolkit.engines.compartmental.engine:CompartmentalEngine
oracles: toolkit.engines.compartmental.benchmarks.oracles
default_config: renewal
seeds: [1]
horizon: {start: 0, stop: 210, window: [0, 210], windows: {all: [0, 210]}}
configs:
  # Daily steps, reported weekly (targets aggregate 7 steps): the generators' SIR generation interval (exponential,
  # mean 7 days) on the daily grid with the triangular discretisation, as RN4's win_refit. A weekly step cannot carry
  # generations shorter than a week (measured: R0 2.43 grows x2.1 a week against the ODE's x4.2).
  renewal: {groups: [all], structure: single_group, mode: windowed, initialiser: given, dt: day,
            generation_interval: [0.19222968801614, 0.107555584944665, 0.093237559583233, 0.080825579829346, 0.070065908888554, 0.060738587941397, 0.05265293954843, 0.045643669651416, 0.039567488484311, 0.034300181315669, 0.029734069139977, 0.02577580740709, 0.022344477789424, 0.01936993397711, 0.016791367684377, 0.014556065552166, 0.012618331534487, 0.010938552738968, 0.009482389624663, 0.008220074002441, 0.007125800487027, 0.006177198960233, 0.005354877260986, 0.004642024753423, 0.004024068668836, 0.003488376196091, 0.003023996230406, 0.002621435501067, 0.002272464501495, 0.001969949254313, 0.001707705472193, 0.001480372133127, 0.001283301885614, 0.001112466043346, 0.000964372227199, 0.000835992970892, 0.000724703830813, 0.000628229734796, 0.00054459847306, 0.000472100380534, 0.000409253386348, 0.000354772716023, 0.000307544626955, 0.000266603640294, 0.000231112803764, 0.000200346581932, 0.000173676024168, 0.000150555907067, 0.000130513588514, 0.000113139345499, 9.8077998206e-05, 8.5021649096e-05, 7.3703388602e-05, 6.3891838716e-05, 5.5386422957e-05, 4.8013266008e-05, 4.1621639197e-05, 3.6080879171e-05, 3.1277716757e-05, 2.7113961411e-05],
            forcing: cosine, forcing_period: 365.0, rt_trajectory: false}
  cohorts: {groups: [b2021, b2022, b2023, b2024, b2025], structure: birth_cohorts, mode: to_extinction,
            initialiser: cohort_history, doses: [d1], dt: day, generation_interval: [0.5, 0.5]}
  # SB5's q range starts at 0.45 (R0 = q rho(C) = 1.12), not 0.40: rho(C) = 2.49, so q = 0.4015 is critical, and the
  # engine fails closed at its step cap on a near-critical epidemic (measured: 22,681 steps at q = 0.4016, and no
  # convergence within 400,000 steps at criticality). The generator and the prior use the same range.
  groups3: {groups: [a, b, c], structure: age_groups_contact_matrix, mode: to_extinction, initialiser: given,
            dt: day, transmission: q, generation_interval: [0.5, 0.3, 0.2],
            components: {plan: {kind: campaign, targets: [b], reach: 0.5}}, outcomes: [hospitalisations]}
settings: {}
arms: {}

# ---------------------------------------------------------------- shared declarations (YAML anchors)
x-notifications: &notifications
  id: notifications
  measures: case_notifications
  latent: {quantity: incidence}
  frame: {design: facility_based, population: "everyone whose infection could be notified by a reporting facility",
          excluded: []}
  bias: [{mechanism: under_ascertainment, param: reporting, prior: {dist: loguniform, range: [0.0333, 0.333]},
          source: "the generator's reporting range (synthetic)"}]
  noise: {model: negbin, dispersion: 20, source: "the generator's declared reporting noise (synthetic)"}
x-renewal: &renewal
  config: renewal
  priors: {r0: {dist: uniform, range: [1.3, 2.5], source: "the generator's R0 range (synthetic)"}}
  engine_params: {r0: "param:r0", forcing_amplitude: 0.0, forcing_phase: 0.0}
  unit: {N: ["data:population"], s0: ["data:known.s0"], seed: "data:known.seed"}
  horizon: {weeks: "data:weeks"}
  sources: [*notifications]
  targets: [{source: notifications, observed: "data:weekly_cases", latent: incidence, aggregate: 7}]
  quantities: {r0: "window:r0", attack_rate: "window:attack_rate", reff_end: "window:reff_end"}
x-gap: &gap {who: "populations outside the survey and facility frames", share: "data:out_of_frame_share",
             param: rel_out, relative_value_prior: {dist: uniform, range: [0.5, 1.0]},
             source: "frame documentation (synthetic)"}
x-admin: &admin
  id: admin
  measures: dose_coverage
  latent: {quantity: coverage}
  frame: {design: administrative, population: "the target population as projected", excluded: [*gap]}
  bias:
    - {mechanism: numerator_inflation, param: omega, prior: {dist: uniform, range: [0.0, 0.25]},
       source: "the generator's over-reporting range (synthetic)"}
    - {mechanism: denominator_error, param: delta, prior: {dist: uniform, range: [-0.10, 0.25]},
       source: "the generator's denominator-error range (synthetic)"}
  noise: {model: lognormal, sd: 0.03, source: "the generator's reporting noise (synthetic)"}
x-sero: &sero
  id: sero
  measures: seropositivity
  latent: {quantity: immunity}
  frame: {design: cluster_survey, design_effect: "data:design_effect", excluded: [*gap]}
  bias:
    - {mechanism: assay_sensitivity, param: se, prior: {dist: uniform, range: [0.92, 0.98]},
       source: "the generator's assay validation range (synthetic)"}
    - {mechanism: assay_specificity, param: sp, prior: {dist: uniform, range: [0.95, 0.995]},
       source: "the generator's assay validation range (synthetic)"}
    - {mechanism: antibody_waning, param: wane_rate, prior: {dist: uniform, range: [0.0, 0.05]},
       source: "the generator's waning range (synthetic)"}
  noise: {model: betabinomial}
x-cohorts: &cohorts
  config: cohorts
  latent: {coverage: {n: "data:birth_year", prior: {dist: beta, a: 8, b: 2,
                                                     source: "the generator's coverage distribution (synthetic)"}}}
  engine_params: {"seroconversion:d1": "data:seroconversion"}
  unit: {N: "data:cohort_size", birth_year: "data:birth_year", decision_year: "data:decision_year",
         "coverage:d1": "param:coverage"}
  quantities: {susceptible_share: unit_susceptible_share}
x-admin-target: &admin_target {source: admin, observed: "data:admin_coverage", latent: "coverage:d1"}
x-sero-target: &sero_target {source: sero, observed: "data:sero_positive", n: "data:sero_n", latent: immunity,
                             years: {survey_year: "data:survey_year", birth_year: "data:birth_year",
                                     age_at_vaccination: 1}}

benchmarks:
  - id: SB1
    metric: "identified renewal fit: known initial susceptibility and seeding, unforced, complete epidemic"
    estimand:
      type: coverage
      generator: {fn: renewal_series, args: {weeks: 30}}
      calibrator: {fn: "toolkit.analysis.calibration:posterior", args: *renewal}
      replicates: 200
      seed: 101
      quantities: [r0, attack_rate, reff_end]
      band: [0.90, 0.99]
      classes: {reporting: [identified]}
      class_share_min: 0.90
  - id: SB2a
    metric: "confounded: series truncated before depletion, seeding unknown; prior range of reporting carried"
    estimand:
      type: coverage
      generator: {fn: renewal_series, args: {weeks: 30, truncate_weeks: 6, seed_share_range: [1.0e-6, 1.0e-4]}}
      calibrator: {fn: "toolkit.analysis.calibration:posterior", args: {<<: *renewal,
        priors: {r0: {dist: uniform, range: [1.3, 2.5], source: "the generator's R0 range (synthetic)"},
                 seed_share: {dist: loguniform, range: [1.0e-6, 1.0e-4], source: "the generator's seeding range"}},
        unit: {N: ["data:population"], s0: ["data:known.s0"], seed: "param:seed_share"}}}
      replicates: 200
      seed: 102
      quantities: [attack_rate]
      band: [0.90, 0.99]
      classes: {reporting: [prior_dominated, on_ridge]}
      class_share_min: 0.90
  - id: SB2a_neg
    metric: "negative control for SB2a: reporting fixed at its prior median (reproduces the v1 failure)"
    estimand:
      type: coverage
      generator: {fn: renewal_series, args: {weeks: 30, truncate_weeks: 6, seed_share_range: [1.0e-6, 1.0e-4]}}
      calibrator: {fn: "toolkit.analysis.calibration:posterior", args: {<<: *renewal,
        priors: {r0: {dist: uniform, range: [1.3, 2.5], source: "the generator's R0 range (synthetic)"},
                 seed_share: {dist: loguniform, range: [1.0e-6, 1.0e-4], source: "the generator's seeding range"}},
        unit: {N: ["data:population"], s0: ["data:known.s0"], seed: "param:seed_share"},
        fixed: {reporting: 0.1053}}}
      replicates: 200
      seed: 102
      quantities: [attack_rate]
      band: [0.0, 0.80]
  - id: SB2b
    metric: "confounded: unknown initial susceptible share (declared prior) and unknown forcing amplitude, complete series"
    estimand:
      type: coverage
      # Seeding is unknown here too (as in SB2a): with a known seed the early level identifies reporting even when
      # the susceptible share is unknown (measured in the first local replicates), so the case would not be confounded.
      generator: {fn: renewal_series, args: {weeks: 30, s0_range: [0.4, 1.0], forcing_amplitude_range: [0.0, 0.3],
                                             seed_share_range: [1.0e-6, 1.0e-4]}}
      calibrator: {fn: "toolkit.analysis.calibration:posterior", args: {<<: *renewal,
        priors: {r0: {dist: uniform, range: [1.3, 2.5], source: "the generator's R0 range (synthetic)"},
                 s0: {dist: uniform, range: [0.4, 1.0], source: "the generator's susceptible-share range"},
                 forcing_amplitude: {dist: uniform, range: [0.0, 0.3], source: "the generator's forcing range"},
                 seed_share: {dist: loguniform, range: [1.0e-6, 1.0e-4], source: "the generator's seeding range"}},
        engine_params: {r0: "param:r0", forcing_amplitude: "param:forcing_amplitude", forcing_phase: 0.0},
        unit: {N: ["data:population"], s0: ["param:s0"], seed: "param:seed_share"}}}
      replicates: 200
      seed: 103
      quantities: [attack_rate]
      band: [0.90, 0.99]
      classes: {reporting: [prior_dominated, on_ridge]}
      class_share_min: 0.90
      ridge_names: [reporting, s0]
  - id: SB2c
    metric: "identified despite known forcing: known susceptibility and depletion"
    estimand:
      type: coverage
      generator: {fn: renewal_series, args: {weeks: 30, forcing_amplitude_range: [0.2, 0.2]}}
      calibrator: {fn: "toolkit.analysis.calibration:posterior", args: {<<: *renewal,
        engine_params: {r0: "param:r0", forcing_amplitude: 0.2, forcing_phase: 0.0}}}
      replicates: 200
      seed: 104
      quantities: [r0, attack_rate, reff_end]
      band: [0.90, 0.99]
      classes: {reporting: [identified]}
      class_share_min: 0.90
  - id: SB3a
    metric: "cohort immunity from two overlapping sources (admin coverage with numerator inflation and denominator error; serosurvey with assay error, waning, frame gap)"
    estimand:
      type: coverage
      generator: {fn: cohort_sources, args: {}}
      calibrator: {fn: "toolkit.analysis.calibration:posterior", args: {<<: *cohorts, sources: [*admin, *sero],
                                                                        targets: [*admin_target, *sero_target]}}
      replicates: 200
      seed: 105
      quantities: [susceptible_share]
      band: [0.90, 0.99]
      classes: {omega: [prior_dominated, on_ridge], delta: [prior_dominated, on_ridge], "net_bias:admin": [identified]}
      class_share_min: 0.90
  - id: SB3b_admin_truth
    metric: "negative control: administrative coverage taken as the truth"
    estimand:
      type: coverage
      generator: {fn: cohort_sources, args: {}}
      calibrator: {fn: "toolkit.analysis.calibration:posterior", args: {<<: *cohorts, sources: [*admin],
                                                                        targets: [*admin_target], treat_as_truth: admin}}
      replicates: 200
      seed: 105
      quantities: [susceptible_share]
      band: [0.0, 0.80]
  - id: SB3b_sero_truth
    metric: "negative control: the serosurvey taken as the truth"
    estimand:
      type: coverage
      generator: {fn: cohort_sources, args: {}}
      calibrator: {fn: "toolkit.analysis.calibration:posterior", args: {<<: *cohorts, sources: [*sero],
                                                                        targets: [*sero_target], treat_as_truth: sero}}
      replicates: 200
      seed: 105
      quantities: [susceptible_share]
      band: [0.0, 0.80]
  - id: SB3c
    metric: "administrative coverage only: every bias parameter prior-dominated, prior ranges carried"
    estimand:
      type: coverage
      generator: {fn: cohort_sources, args: {admin_only: true}}
      calibrator: {fn: "toolkit.analysis.calibration:posterior", args: {<<: *cohorts, sources: [*admin],
                                                                        targets: [*admin_target]}}
      replicates: 200
      seed: 106
      quantities: [susceptible_share]
      band: [0.90, 0.99]
      classes: {omega: [prior_dominated], delta: [prior_dominated], rel_out: [prior_dominated]}
      class_share_min: 0.90
  - id: SB5
    metric: "group-attack-rate calibration of q: coverage of hospitalisations averted by a fixed plan"
    estimand:
      type: coverage
      generator: {fn: group_attack, args: {q_range: [0.45, 1.0]}}
      calibrator: {fn: "toolkit.analysis.calibration:posterior", args: {
        config: groups3,
        priors: {q: {dist: uniform, range: [0.45, 1.0], source: "the generator's q range (synthetic)"}},
        engine_params: {q: "param:q", "efficacy:plan": "data:efficacy"},
        unit: {N: "data:N", contact: "data:contact", s0: [1.0, 1.0, 1.0], seed: "data:seed_unit_share", intro: a,
               "ratio:hospitalisations": "data:hosp_ratio"},
        sources: [{id: attack_survey, measures: seropositivity, latent: {quantity: attack_rate},
                   frame: {design: cluster_survey, design_effect: 1.0, excluded: []},
                   bias: {none: "a synthetic survey with a perfect assay and no frame gap, by the generator's construction"},
                   noise: {model: binomial}}],
        targets: [{source: attack_survey, observed: "data:positive", n: "data:survey_n", latent: attack_rate}],
        quantities: {hospitalisations_averted: {scenario: after_calibrated_epidemic, package: {plan: 1},
                                                comparator: {plan: 0}, outcome: hospitalisations}}}}
      replicates: 200
      seed: 107
      quantities: [hospitalisations_averted]
      band: [0.90, 0.99]
