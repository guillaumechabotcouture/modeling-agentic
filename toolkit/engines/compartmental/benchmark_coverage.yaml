# Which package components each benchmark of the compartmental-starsim pack covers (owner decision 2026-11-12;
# toolkit/engines/benchmark_coverage.py). Every benchmark here verifies the engine's mathematics; none judges
# a package component's effect against a trial, so none gates the engine choice.
engine: compartmental-starsim
absent_values: {none: [0]}
components_without_benchmark:
  '*': >-
    components are configured by the spec (doses, campaigns, interventions over a period); their effect sizes are spec inputs with their sources (engine_parameters), so no engine benchmark against a trial applies
reasons:
  fs: &fs "final-size verification against the closed form and the reference ODE; no package component"
  br: &br "branching-process verification against closed forms; no package component"
  rn: &rn "renewal-form verification (growth rate, attack rate, reproduction number); no package component"
  ci: &ci "cohort-immunity arithmetic checked by hand; the dose effects it combines are spec inputs with a source"
  ob: &ob "observation-model arithmetic checked by hand (coverage, assay, frame, waning); no package component"
  as: &as "age-structured verification (closed forms, next-generation threshold); dose effects are spec inputs"
  pubfs: &pubfs "published age-specific final sizes (not transcribed): the transmission structure, no component"
  pub: &pub "published reproduction-number estimates (not transcribed): the estimator, no component"
benchmarks:
  FS1a: {covers: {}, covers_none_because: *fs}
  FS1b: {covers: {}, covers_none_because: *fs}
  FS1c: {covers: {}, covers_none_because: *fs}
