# Pathogen-specific literature values for the compartmental engine's generic parameters (engine v0.2). Card metadata:
# not engine code (no code fingerprint, no benchmark stamp), and not read by any run. A planner copies a value it uses
# into the signed spec (calibration.priors, engine_parameters or uncertainty.priors), with the source, and may
# replace it with a better one. Each value is a PRIOR with its spread across settings, not a truth: the range is
# where published estimates fall, and a run calibrates or propagates it.
#
# verified: every entry is `unverified` (the evidence service was not reachable when this file was written,
# 2026-11-05); a critic checks each against its source before a report relies on it.
#
#   engine parameter / config field   what the entry sets
#   r0                                transmission: r0 (all groups fully susceptible)
#   generation_interval.seir          {latent_days, infectious_days}: the SEIR generation interval (final sizes do not
#                                     depend on it; growth rates, timing and mid-epidemic interventions do)
#   seroconversion:<dose>             cohort_history: share of the still-susceptible a dose protects
#   efficacy:<component>              all-or-nothing protection of the susceptibles a component reaches
# Contact matrices are unit attributes (contact), never defaults here: take them from the question's data, or
# transcribe a published matrix with its source (POLYMOD, Mossong et al. 2008 PLoS Med 5:e74, 8 European countries;
# Prem, Cook & Jit 2017 PLoS Comput Biol 13:e1005697, 152 countries; Prem et al. 2021 PLoS Comput Biol 17:e1009098,
# 177 regions) and say which.
version: 1
pathogens:
  measles:
    r0:
      value: 15.0
      range: [12.0, 18.0]
      units: secondary infections per case in a fully susceptible population
      dist: uniform
      source: "Anderson RM, May RM (1991) Infectious Diseases of Humans, Oxford University Press (the 12-18 range)"
      note: >-
        A systematic review (Guerra FM et al. 2017 Lancet Infect Dis 17:e420-e428) found published estimates far
        outside 12-18 across settings and methods; widen the range when the question does not fix it.
      verified: unverified
    serial_interval_days:
      value: 11.7
      range: [10.0, 14.0]
      units: days
      source: "Vink MA, Bootsma MCJ, Wallinga J (2014) Am J Epidemiol 180:865-875 (serial intervals, systematic review)"
      note: "choose latent_days + infectious_days near it for an SEIR generation interval"
      verified: unverified
    incubation_days:
      value: 12.5
      range: [11.8, 13.3]
      units: days (infection to prodrome)
      source: "Lessler J et al. (2009) Lancet Infect Dis 9:291-300 (incubation periods, systematic review)"
      verified: unverified
    seroconversion:mcv1:
      value: 0.84
      range: [0.72, 0.95]
      units: share of the still-susceptible protected (one dose at 9-11 months; 0.925 at 12 months or older)
      dist: uniform
      source: "Uzicanin A, Zimmerman L (2011) J Infect Dis 204 Suppl 1:S133-S148 (field effectiveness, median and IQR)"
      verified: unverified
    seroconversion:mcv2:
      value: 0.94
      range: [0.88, 0.98]
      units: share protected after two doses (two-dose effectiveness, median and IQR)
      dist: uniform
      source: "Uzicanin A, Zimmerman L (2011) J Infect Dis 204 Suppl 1:S133-S148"
      note: >-
        the engine's seroconversion:<dose> is per dose among those still susceptible; convert a two-dose
        effectiveness to the second dose's conditional share before using it
      verified: unverified
  influenza_seasonal:
    r0:
      value: 1.28
      range: [1.19, 1.37]
      units: reproduction number (seasonal epidemics; median and IQR of published estimates)
      dist: uniform
      source: "Biggerstaff M et al. (2014) BMC Infect Dis 14:480 (systematic review of R for influenza)"
      note: "pandemic 2009: median 1.46 (IQR 1.30-1.70), same review"
      verified: unverified
    incubation_days:
      value: 1.4
      range: [1.3, 1.5]
      units: days (influenza A, median and 95% CI)
      source: "Lessler J et al. (2009) Lancet Infect Dis 9:291-300"
      verified: unverified
    serial_interval_days:
      value: 3.6
      range: [2.9, 4.3]
      units: days (mean and 95% CI)
      source: "Cowling BJ et al. (2009) Epidemiology 20:344-347 (serial interval of influenza, household study)"
      note: "an SEIR interval with latent_days about 1.4 and infectious_days about 2.2 has this mean"
      verified: unverified
    ve_against_infection:
      value: 0.5
      range: [0.3, 0.7]
      units: share of the susceptibles reached who are protected (all-or-nothing reading of test-negative VE)
      dist: uniform
      source: "Belongia EA et al. (2016) Lancet Infect Dis 16:942-951 (test-negative VE meta-analysis: H1N1pdm 0.61, B 0.54, H3N2 0.33)"
      note: "test-negative studies estimate VE against medically attended illness; the infection reading is an assumption"
      verified: unverified
