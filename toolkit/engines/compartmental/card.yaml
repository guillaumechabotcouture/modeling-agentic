name: compartmental-starsim
version: '0.1'
mechanisms:
- closed population of groups (age bands with a contact matrix, or birth cohorts with homogeneous mixing C_ij =
  c N_j / N); no births, deaths, waning or migration within the horizon
- discrete-time transmission with susceptible depletion in the exponential-survival form, a declared generation
  interval on the dt grid, optional cosine seasonal forcing
- R0 = q rho(C) from the next-generation matrix; Reff = q f rho(diag(s) C)
- 'susceptibility initialisers: given (calibrated latent share) or cohort_history (latent true dose coverage by
  birth year, seroconversion, declared dose dependence)'
- 'interventions before the epidemic: all-or-nothing protection of the susceptibles reached; doses given to immune
  people are wasted unless targets_susceptible is declared'
- 'p_major: multitype branching-process extinction equations (derived from an equation, not from the sim)'
- run mode to_extinction
components:
  none:
  - 0
unit_attributes:
  N: group sizes, one per group (> 0)
  seed: initial infections as a share of the unit's population (default 1e-9)
  intro: 'introduction group, or {group: share} (default: the first group)'
  contact_rate: mean daily contacts per person (homogeneous mixing, C_ij = c N_j / N; default 1)
  s0: initial susceptible share per group [0, 1] (a latent quantity, calibrated)
  always_immune: groups declared immune (from the spec, with a source)
  always_susceptible: groups declared susceptible (from the spec, with a source)
outputs:
  per_capita:
  - infections
  windows:
  - attack_rate
  - s_start
  - s_end
  - r0
  - reff_start
  - reff_end
  - reff_ref
  - growth_rate
  - growth_defined
  - p_major
  - attack_rate:all
  - converged
  - steps
  cost_drivers: []
age_groups:
- all
valid_ranges:
  s0:
  - 0.0
  - 1.0
  r0:
  - 0.05
  - 40.0
  seed:
  - 0.0
  - 0.01
