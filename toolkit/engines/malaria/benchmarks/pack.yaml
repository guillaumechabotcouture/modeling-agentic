# v0.2: one joint fit of the parameters no published source sets. Pyrethroid and PBO nets use the Churcher 2016
# hut-trial coefficients, so B7, B8, B9, B9b, B9c and (F6 option A, until the net-effect fit uses them) B9d-B9g are
# held out. Every benchmark not in `targets` is held out.
fit_joint:
  rule: joint-v1
  params: {cfp_kill: [0.0, 0.8], irs_kill: [0.0, 0.95]}
  targets: [B10, B11, B12, B12b, B12m]
  design: {n: 24, seed: 7}
