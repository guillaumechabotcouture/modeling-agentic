# Engine-card priors of the malaria engine (toolkit/spec/priors.py). Card metadata only: this file is not
# engine code (the code fingerprint covers *.py), so editing it alone needs no benchmark re-stamp. (v0.17 added three
# engine parameters in engine code; their entries below came with that change.) Every `fixed` engine parameter is listed below as
# a prior, as fixed with the reason, or as a setting. Sources: the engine's parameter table, ENGINE_NOTES.md
# and the attempt 8 parameter registry (citations.md C25, C48, C49, C50; registry_build.py).
# Triangular priors take the engine's point value as their mode.
engine: malaria-starsim
priors:
  net_retention_half:
    dist: triangular
    range: [485.45, 865.05]            # 1.33-2.37 years, in days
    source: "Bertozzi-Villa et al. 2021 Nat Commun 10.1038/s41467-021-23707-7 (PMC8196080): LLIN median retention
      1.64 y, IQR 1.33-2.37 across 40 countries (main text, Net retention time; Supplementary Table 1.7)"
    verified: matched
    note: "an interquartile range across countries, used as the range for one country's value: it covers the central
      half of countries, so it is narrower than a 95% range would be. v0.9: the median of the smooth-compact survival
      curve (shape net_survival_k), no longer an exponential half-life"
  use_rate:
    dist: triangular
    range: [0.833, 0.901]
    source: "Bertozzi-Villa et al. 2021 Nat Commun 10.1038/s41467-021-23707-7 (PMC8196080): ITN use among those with
      access, all countries, 87.1% (83.3-90.1)"
    verified: matched
  # v0.11 (ENGINE_NOTES.md, v0.11): smc_pe and smc_hi_frac are gone; ACCESS-SMC's 88.2% is a check, not an input
  smc_cov:
    dist: triangular
    range: [0.521, 0.957]
    source: "Malaria Consortium 2020 coverage report (Quantitative report on SMC supported by Malaria Consortium in
      2020), Table 21: Nigeria cycles received 6.0 / 5.2 / 13.3 / 15.3 / 60.2% for 0-4 cycles, mean per round 0.796.
      Range: ACCESS-SMC Partnership 2020 Lancet (PMC7718580) Table 1, Nigeria 2016 mean coverage per month 52.1%; the
      Malaria Consortium 2022 report, Table 0, Nigeria cycle 2 day-1 coverage 95.7% (end-of-cycle)"
    verified: matched
    note: "the range spans survey years, survey types (end-of-round recall vs end-of-cycle) and programmes, not a
      sampling interval; a state's own survey value can be set through a run spec's engine_parameters"
  smc_adh:
    dist: triangular
    range: [0.842, 0.986]
    source: "Malaria Consortium 2020 coverage report, Table 16: full three-day course among day-1 recipients, Nigeria
      94.4% (93.2-95.1). Range: ACCESS-SMC Nigeria 2015 key indicators 84.2%; Malaria Consortium 2021 report Table 18,
      98.6%"
    verified: matched
  # owner guidance 2026-11-05: every SMC parameter but the shape smc_k is carried as a sourced range; the engine's
  # point value is the central reference, and which values inside the ranges agree with data is for a joint calibration.
  # The card's lo/hi for smc_rho, smc_e0 and smc_partial stay empty (engine code unchanged after the benchmark run);
  # their ranges are here.
  smc_rho:
    dist: triangular
    range: [0.417, 0.600]
    source: "beta-binomial fits (maximum likelihood, mean and intra-child correlation) to the Nigeria distributions of
      cycles received: Malaria Consortium 2020 report Table 21 (rho 0.417, mean 0.796), 2022 report Table 30 4-cycle
      areas (0.600, 0.943), 2023 report Table 33 4-cycle areas (0.446, 0.933); ACCESS-SMC Nigeria 2015 key
      indicators, binned (0.555, 0.648)"
    verified: matched
    note: "derived by this engine from the published distributions (ENGINE_NOTES.md, v0.11); the point value is the
      2020 survey, the one covering Jigawa, Kano and Katsina"
  smc_e0:
    dist: triangular
    range: [0.90, 1.00]
    source: "Burgert et al. 2022 Table 1 (initial efficacy 100%); Cairns et al. 2022 BMC Med 20:352, Abstract:
      protection 'exceeded 90% in the first 2-3 weeks ... but was not 100%, even immediately post-administration'"
    verified: matched
  smc_partial:
    dist: triangular
    range: [0.384, 1.00]
    source: "Cairns et al. 2022 BMC Med 20:352, Results: 30-day PE 79.8% (95% CI 33.7-93.8) with the day-1 dose only vs
      87.7% with all three; range 33.7 / 87.7 to 93.8 / 87.7 capped at 1"
    verified: unverified
    note: "the mapping of a clinical-PE ratio onto initial infection-blocking efficacy is an assumption
      (ENGINE_NOTES.md, v0.11)"
  smc_half:
    dist: triangular
    range: [24.0, 32.0]
    source: "Burgert et al. 2022 PLOS Glob Public Health 2:e0000211 (PMC10021282), Table 1: SMC-SP+AQ protection
      half-life 32 days (Weibull, k 5.4); Braunack-Mayer et al. 2024 Lancet Glob Health 12:e478 (PMC10882206),
      Results: a liver-stage protection half-life of 24-30 days behaves like SP+AQ"
    verified: matched
    note: "two model fits to the same trial (Zongo 2015, clinical malaria); the point value is the upper end"
  # v0.17 (ENGINE_NOTES.md, v0.17): the kill shift's range is Churcher 2016's posterior for alpha1, re-centred on the
  # engine's Table 6 value 0.63 (0.012 - 0.63 = -0.618; 1.29 - 0.63 = 0.66). It replaces nothing: until v0.17 the
  # coefficient was a module constant and never drawn. The trial fit (ENGINE_NOTES.md, v0.17) is to replace this
  # hut-trial range with the range the randomised trials allow.
  net_kill_shift:
    dist: triangular
    range: [-0.618, 0.66]
    source: "Churcher et al. 2016 eLife 10.7554/eLife.16090 (PMC5025277), Results (standard LLIN hut mortality vs
      discriminating-dose bioassay mortality, Equation 2): alpha1 = 0.634 (95% CrI 0.012-1.29), alpha2 = 3.99
      (3.171-5.12); Table 6 gives alpha1 0.63"
    verified: matched
    note: "a 95% credible interval of the hut-trial meta-analysis fit, for the intercept only; alpha2 (the resistance
      slope) stays at 4.00. It shifts every net type alike, so it moves pyrethroid nets against no nets far more than
      one net type against another"
  # v0.17 round 2 (owner, 13 Nov): the PBO parameters' ranges from trials that are not in the benchmark pack. Each
  # range is derived by a rule coded and checked in vector.py (V36, V37); ENGINE_NOTES.md, v0.17, gives the steps.
  pbo_gain_scale:
    dist: uniform
    range: [0.316, 1.0]
    source: "Gleave et al. 2021 Cochrane Database Syst Rev CD012776.pub3, abstract (read on cochrane.org; the full text
      returned HTTP 403): unwashed pyrethroid-PBO vs standard nets, mosquito mortality where resistance is high (< 30%
      mortality in discriminating-dose assays), RR 1.84 (95% CI 1.60-2.11), 14,620 mosquitoes, 5 trials, 9
      comparisons, high certainty; moderate resistance (31-60%) RR 1.68 (1.33-2.11). Rule (vector.hut_mortality_ratio,
      pbo_gain_scale_for_hut_rr): the scale at which the hut-mortality ratio of Churcher 2016 Equation 2 (at Equation
      4's f_s vs at x), averaged over x uniform on 0-0.30, equals each CI bound: A. gambiae complex 0.511-0.912, A.
      funestus 0.316-0.513; union 0.316-0.912. The moderate category bounds the scale only from below (0.341, 0.400)"
    verified: unverified
    note: "the pooled Gleave estimate implies a scale of at most 0.912; the upper end is raised to 1.0, the engine's
      point value, because a card prior must contain it and v0.17 keeps the v0.16 outputs at the defaults (owner, 13
      Nov). The default therefore sits at the range's upper edge, outside what the evidence supports. At scale 1 the rule gives 2.21 (A. gambiae) and
      2.81 (A. funestus) against the pooled 1.84 (1.60-2.11): the hut trials say Equation 4 overstates PBO's killing
      gain at high resistance (a principle-4 finding; moving the point value is a later engine version). Uniform
      because the rule gives an interval, not a mode. Estimand: hut mortality ratio of unwashed nets, as Churcher's
      Equation 2 describes new nets; the category-mean (x uniform within the category) is an assumption"
  pbo_adv_decay:
    dist: uniform
    range: [0.0, 1.594]
    source: "Staedke et al. 2020 Lancet 395:1292-1303 (LLINEUP, Uganda; 10.1016/S0140-6736(20)30214-2), Table 2 (p.
      1299), as-treated analysis, children 2-10 years, PBO vs non-PBO LLIN: prevalence ratio 0.74 (95% CI 0.62-0.87) at
      6 months, 0.73 (0.63-0.85) at 12 months, 0.84 (0.72-0.98) at 18 months. Rule (vector.adv_decay_from_prs): log PR
      fades as exp(-decay t) from 6 to 18 months, decay = ln(ln 0.74 / ln 0.84) = 0.546 per year; 95% range by the
      delta method with the two estimates taken as independent, lower end clipped at 0: 0-1.594 per year"
    verified: unverified
    note: "the mapping of the fading of a prevalence ratio onto the fading of the per-attempt PBO advantage is an
      assumption (transmission is nonlinear, and the arms' attrition is taken as equal). Mechanism: LLINEUP p. 1298,
      PBO in nets withdrawn at 12 months was below the manufacturers' minimum target in 80% of PermaNet 3.0 and 90%
      of Olyset Plus. The intention-to-treat ratios (0.78, 0.80, 0.94; Table 2) give 1.39 per year, inside the range.
      Uniform: 0 is the engine's point value and a triangular mode there would contradict the point estimate"
  dw_moderate:
    dist: triangular
    range: [0.032, 0.074]
    source: "GBD 2019 disability weight, acute infectious episode, moderate: 0.051 (0.032-0.074) (Salomon et al. 2015
      Lancet Glob Health 10.1016/S2214-109X(15)00069-8; quoted in GBD 2019 Hepatitis B and C Collaborators 2023 Lancet
      Public Health, PMC11138131; attempt 8 C50)"
    verified: matched
  dw_severe:
    dist: triangular
    range: [0.088, 0.190]
    source: "GBD 2019 disability weight, acute infectious episode, severe: 0.133 (0.088-0.190) (as dw_moderate;
      attempt 8 C50)"
    verified: matched
  cfr_severe_treated:
    dist: uniform
    range: [0.085, 0.109]
    source: "Dondorp et al. 2010 Lancet 376:1647 (AQUAMAT), 10.1016/S0140-6736(10)61924-1 (PMC3033534): in-hospital
      mortality 8.5% with artesunate, 10.9% with quinine, African children with severe malaria (attempt 8 C48)"
    verified: matched
    note: "the two trial arms; attempt 8's upper bound of 0.15 (referral delay outside trial hospitals) was a modeller
      judgment and is not used"
fixed:
  net_survival_k: "Bertozzi-Villa 2021 Supplementary Note 1.4 fixes the smooth-compact shape at k = 20 to aid
    identifiability and fits only the curve's end point (tau ~ Unif(5.5, 20.7) y); the paper gives no range for k.
    Briet et al. 2012 Malar J 11:20 (PMC3273435) used k = 18 for the same function. The median retention, which the
    paper estimates, carries the uncertainty (net_retention_half)"
  cfp_half: "attempt 8's range (1.5-3.5 y, registry cfp_half_life_years) is a modeller reading of Mosha 2022/2024
    durability, not a published half-life estimate"
  irs_rep: "no published range on the card or in the attempt 8 registry"
  irs_half: "no published range (attempt 8 value; used only by the generic short-lived product)"
  irs_divert: "the card's range [0, 1] is an assumption with no source"
  hh_size: "no published range on the card (assumption)"
  hh_net_corr: "the card's range [0, 0.9] is an assumption with no source (varied in the ENGINE_NOTES sensitivity scan)"
  cov_corr: "the card's range [0, 0.9] is an assumption with no source (varied in the ENGINE_NOTES sensitivity scan)"
  exp_corr: "the card's range [0, 0.6] is an assumption with no source (varied in the ENGINE_NOTES sensitivity scan)"
  use_persist: "the card's range [0, 1] is an assumption with no source"
  smc_k: "Burgert 2022 Table 1 (5.4) and Braunack-Mayer 2024 Table 1 (5.34) agree; no range is published"
  cfr_severe_untreated: "attempt 8's range 0.15-0.50 (C49) is a modeller assumption; no published estimate was located"
  severe_access_add: "no published range (attempt 8 value)"
  dur_moderate_d: "no published range (attempt 8 value)"
  dur_severe_d: "no published range (attempt 8 value)"
  le_u5: "GBD reference life table: a normative standard, which GBD carries without uncertainty"
  le_5_14: "GBD reference life table: a normative standard, which GBD carries without uncertainty"
  le_15p: "GBD reference life table: a normative standard, which GBD carries without uncertainty"
  import_eir: "no published range (attempt 8 value)"
  # v0.12 (ENGINE_NOTES.md, v0.12): the case-management package's options; a run sets them through engine_parameters
  cm_target: "a model switch (1 = the v0.12 case-management package, 0 = the v0.11 add-on), not an uncertain quantity"
  cm_age_lo_m: "programme design: the iCCM age band starts at 2 months (Oresanya 2019, Isiguzo 2019)"
  cm_age_hi_m: "programme design: the iCCM age band ends at 59 months (Oresanya 2019, Isiguzo 2019)"
  cm_ramp_years: "the card's range [2, 3] years is an assumption from the RAcE programme timing (endline about three
    years after the start), not a published estimate"
  cm_catchment_share: "the card's range [0.2, 0.5] is an assumption (no unit-level data on the iCCM catchment); a run
    sets its value and range through engine_parameters, and it scales the effect and the child-years charged alike"
  cm_severe_link: "no published estimate of the share of an iCCM gain that reaches severe-care access; default 0. A run
    whose plan depends on the add-on gives it a range through engine_parameters, so the draws vary it"
settings: [n_agents, net_holes, burnin_years, init_eir_per_m0]   # v0.5: numerical settings of the start
  # (burn-in length and its starting guess; benchmarks/equilibration.yaml shows the results do not depend on them)
not_exposed:
  hut_trial_coefficients: "Churcher et al. 2016 Table 6 coefficients are module constants (vector.CHURCHER). v0.17
    exposes three summaries of them as engine parameters (net_kill_shift, pbo_gain_scale, pbo_adv_decay) instead of
    drawing the 20 coefficients one by one, which would ignore their correlation in the paper's joint fit"
  smc_clearance: "v0.11: every child reached is cleared of blood-stage infection at dosing (model.SMCDelivery), as in
    Burgert 2022's model; no source in hand gives a lower probability, so it is not a parameter"
  species_bionomics: "Q0, phi_I, phi_B, mu0 per species are module constants (vector.SPECIES), not engine parameters"
  natural_history: "the Griffin-lite natural-history constants (model.py) are fixed by design (GRIFFIN)"
# v0.9: country-specific values a run spec can cite (not read by toolkit/spec/priors.py). A spec sets one through
# engine_parameters.net_retention_half {value, range, dist, source, reason, basis: literature}; the Nigeria upper bound (2.47 y = 901.6 d)
# is above the card's range (865.05 d), so such a spec needs outside_card_range: true.
country_values:
  net_retention_half:
    Nigeria:
      value: 810.3                       # 2.22 y, in days
      ci95: [730.0, 901.55]              # 2.00-2.47 y
      units: days
      surveys: 9
      source: "Bertozzi-Villa et al. 2021 Nat Commun 10.1038/s41467-021-23707-7 (PMC8196080), Supplementary Table 1.7
        (LLIN median retention times from the stock-and-flow model): Nigeria (NGA) 2.22 y (95% CI 2.00-2.47), 9 surveys"
      note: "the median of the same smooth-compact curve (k = 20) the engine uses; a national value, not a state value"
