notes:
- endophily per species is an unverified assumption (not in the D6 prior)
- net effects use Churcher 2016 Table 6 coefficients (matched from the paper); the An. funestus PBO row is read
  as a linear form (unverified reading)
- household size and the three correlation parameters are unverified assumptions, fixed (not fitted) and varied
  in the ENGINE_NOTES sensitivity scan
- 'IRS product decay: pm_cs from Protopopoff 2018 cone bioassays (matched); short from attempt 8 (unverified)'
