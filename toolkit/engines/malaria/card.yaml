name: malaria-starsim
version: 0.1-spike
mechanisms:
- 'Griffin-lite human natural history and immunity (fixed: Griffin et al. 2010 PLoS Med 10.1371/journal.pmed.1000324;
  2014 Nat Commun; 2015 Lancet Infect Dis)'
- species-specific vectors (Q0, phi_I, phi_B, mu0 from the D6 prior; endophily assumed)
- 'ITN: deflection (repellence + blocking), killing, feeding; pyrethroid resistance; PBO; dual-AI; decay'
- 'IRS: deterrence on entry and killing of indoor-resting fed mosquitoes; decay'
- ITN x IRS redundancy from shared indoor target (no interaction factor)
- SMC (28-day protection, clearance); case management (effective treatment)
- expected severe episodes and deaths; DALYs from GBD 2019 weights and reference life table
components:
  net:
  - none
  - pyr
  - pbo
  - dual
  smc:
  - 0
  - 1
  irs:
  - 0
  - 1
  cm:
  - 0
  - 1
unit_attributes:
  m0: emergence density per person, [0.2, 400]
  season: 12 monthly values, mean 1
  resistance: bioassay mortality [0, 1]
  species: species shares
  cm_ft: effective treatment [0, 0.95]
  itn_use: net use after a campaign [0, 1]
  itn_hist_years: past campaign years
  campaign_year: decimal year of the package's campaign
  smc_months: optional SMC months
  irs_month: optional IRS month
outputs:
  per_capita:
  - cases
  - severe
  - deaths
  - treated
  - dalys
  windows:
  - pfpr_u5
  - pfpr_6m14y
  - pfpr_2_10
  - inc_u5
  - inc_all
  - inc_u5_smc
  - eir_annual
  cost_drivers:
  - nets_given
  - smc_doses
  - irs_sprayed
  - treated_all
age_groups:
- u5
- '5_14'
- 15p
valid_ranges:
  m0:
  - 0.2
  - 400
  resistance:
  - 0.1
  - 1.0
  cm_ft:
  - 0.0
  - 0.95
  eir_annual:
