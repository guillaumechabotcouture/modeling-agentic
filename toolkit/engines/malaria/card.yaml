  verified: unverified
- name: cfp_half
  value: 912.5
  kind: fixed
  units: days
  lo: null
  hi: null
  source: E7 attempt 8 value (models/malaria_abm.py VC), kept
  verified: unverified
- name: net_kill_shift
  value: 0.0
  kind: fixed
  units: logit
  lo: null
  hi: null
  source: 'shift on the hut-mortality intercept alpha1 of Churcher et al. 2016 eLife 10.7554/eLife.16090, Table
    6 (PMC5025277), Equation 2, for every net type; Results: alpha1 = 0.634 (95% CrI 0.012-1.29); the engine uses
    Table 6''s 0.63'
  verified: matched
- name: pbo_gain_scale
  value: 1.0
  kind: fixed
  units: multiplier
  lo: null
  hi: null
  source: scale on PBO's gain in bioassay-mortality logit, logit f_s = logit x + s (logit f - logit x), f from Churcher
