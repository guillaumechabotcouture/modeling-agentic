name: malaria-starsim
version: '0.17'
mechanisms:
- 'Griffin-lite human natural history and immunity (fixed: Griffin et al. 2010 PLoS Med 10.1371/journal.pmed.1000324;
  2014 Nat Commun; 2015 Lancet Infect Dis)'
- species-specific vectors (Q0, phi_I, phi_B, mu0 from the D6 prior; endophily assumed); feeding cycle under vector
  control with biting rates f Q0 pi y / W-bar on people and f Q0 sum(pi w c) / W-bar on mosquitoes (Griffin 2010
  Protocol S2; v0.15)
- 'ITN: repeating, killing and feeding per attempt from published hut-trial relationships by bioassay mortality
  and species complex, pyrethroid and PBO, with resistance-dependent decay (Churcher et al. 2016 eLife 10.7554/eLife.16090,
  Table 6 (PMC5025277)); dual-AI adds a fitted chlorfenapyr kill'
- 'IRS: deterrence on entry (a share diverted to outdoor biting) and killing of indoor-resting fed mosquitoes, product-specific
  decay (pirimiphos-methyl CS from the trial''s wall cone bioassays)'
- 'field use of nets: attrition by net age on the smooth-compact survival curve (median retention and shape k =
  20, Bertozzi-Villa 2021; v0.9), use below access with nightly variation (use rate, same source), holes growing
  with net age (Briet 2020); survey use mapped to access'
- 'households: correlated net use within households, correlated net use and spraying, biting heterogeneity correlated
  with net non-use'
- ITN x IRS redundancy from shared indoor target, diversion and correlated coverage (no interaction factor)
- 'SMC (v0.11: beta-propensity reach, adherence, clearance at dosing, Weibull protection against infection); case
  management (effective treatment); v0.12 with cm_target 1: the add-on in declared ages (default 2-59 months) with
  a linear ramp, severe-care access raised only through cm_severe_link (default 0)'
- 'delivery period distinct from the outcome window: components act and cost drivers count only in delivery years;
  routine net campaigns after the package''s campaign in every arm (v0.6)'
- routine SMC in every arm after the delivery period, uncharged (v0.7)
- past SMC before the delivery period and a net type per past net campaign, in every arm, uncharged (v0.10); past
  SMC at its own per-round coverage, apart from the package's (v0.13)
- expected severe episodes and deaths; DALYs from GBD 2019 weights and reference life table
- microscopy prevalence by age band, including the ITN trials' own bands (under 5 from birth, under 10, 15 and under,
  all ages; Pryce 2018 characteristics of included studies)
components:
  net:
  - none
  - pyr
  - pbo
  - dual
  smc:
  - 0
  - 1
  irs:
  - 0
  - 1
  cm:
  - 0
  - 1
unit_attributes:
  m0: emergence density per person, [0.2, 400]
  season: 12 monthly values, mean 1
  resistance: bioassay mortality [0, 1]
  species: species shares
  cm_ft: effective treatment [0, 0.95]
  itn_use: net use after a campaign [0, 1]
  itn_hist_years: past campaign years
  campaign_year: decimal year of the package's campaign
  smc_months: optional SMC months
  irs_month: optional IRS month
  irs_years: optional IRS round years
  irs_product: pm_cs | short
  itn_use_at: years after distribution at which itn_use was measured (default 0)
  hist_net: net type of past campaigns (default pyr)
  itn_routine_interval: 'years between routine net campaigns after campaign_year: every arm, net type hist_net,
    never charged (default: none)'
  smc_routine: '0 | 1: routine SMC every season from the delivery period''s end to the window''s end in the unit''s
    SMC months: every arm, never charged; needs objective.delivery (default 0)'
  smc_hist_years: 'whole calendar years of past SMC before the delivery period, rounds in the unit''s SMC months:
    every arm, never charged (default [])'
  smc_hist_rounds: 'optional rounds per past SMC year: one number, or one per smc_hist_years entry; the first n
    SMC months (default: every SMC month)'
  smc_hist_cov: 'optional mean per-round reach of past SMC, a share in (0, 1]: one number, or one per smc_hist_years
    entry; the package''s and routine SMC keep smc_cov (default: smc_cov; v0.13)'
  hist_net_by_year: 'optional net type per past campaign, {year: pyr | pbo | dual} or ''year:type ...''; years from
    itn_hist_years; others hist_net (default none)'
outputs:
  per_capita:
  - cases
  - severe
  - deaths
  - treated
  - dalys
  windows:
  - pfpr_u5
  - pfpr_6m14y
  - pfpr_2_10
  - pfpr_lt5
  - pfpr_lt10
  - pfpr_le15
  - pfpr_all
  - inc_u5
  - inc_all
  - inc_u5_smc
  - eir_annual
  - net_use
  - net_access
  - severe_u5
  - severe_5_14
  - severe_15p
  - severe_all
  - deaths_u5
  - deaths_5_14
  - deaths_15p
  - deaths_all
  cost_drivers:
  - nets_given
  - smc_doses
  - irs_sprayed
  - treated_all
  cost_drivers_when:
    cm_child_years:
      cm_target: 1.0
    treated_cm_ages:
      cm_target: 1.0
  series:
    pfpr_u5:
      label: microscopy prevalence, children 6-59 months (the calibration metric)
      units: share
      aggregate: mean
      denominator: person aged 6-59 months
    pfpr_2_10:
      label: microscopy prevalence, ages 2-10
      units: share
      aggregate: mean
      denominator: person aged 2-10
    pfpr_all:
      label: microscopy prevalence, all ages
      units: share
      aggregate: mean
      denominator: person
    inc_all:
      label: clinical incidence, all ages
      units: episodes per person-year
      aggregate: rate
      denominator: person-year
    inc_u5:
      label: clinical incidence, under 5
      units: episodes per child-year (under 5)
      aggregate: rate
      denominator: person-year under 5
age_groups:
- u5
- '5_14'
- 15p
