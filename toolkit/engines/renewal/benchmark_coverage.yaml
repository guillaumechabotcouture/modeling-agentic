# Which package components each benchmark of the renewal pack covers (owner decision 2026-11-12;
# toolkit/engines/benchmark_coverage.py). Every benchmark here verifies the engine's mathematics; none judges
# a package component's effect against a trial, so none gates the engine choice.
engine: renewal
absent_values: {none: [0]}
effects_from_spec:
  '*': >-
    components are configured by the spec (doses, campaigns, interventions over a period); their effect sizes are spec inputs with their sources (engine_parameters), so no engine benchmark against a trial applies
reasons:
  rw: &rw "verification against closed forms, a second implementation and the Cori estimator; no package component"
  pub: &pub "published reproduction-number estimates (not transcribed): the estimator, no component"
benchmarks:
