notes:
- the observation model (reporting fraction, delay, overdispersion) belongs to each data source and is the harness's
  (toolkit/analysis/observation.py), never an engine parameter
- 'out of range: births, deaths, waning, migration, vector dynamics (absorbed into R0 and c(t)), stochastic fade-out,
  spatial structure'
- validated against analytic identities (final size, Wallinga-Lipsitch, reproduction-number identities, scale invariance)
  and known-R_t recovery; published benchmark RW9 (Cori et al. 2013 worked examples) not yet assessed
- 'configuration: {"components": {}, "dt": "week", "generation_interval": {"dt": "week", "w": [0.2, 0.4, 0.25, 0.15]},
  "transmissibility": "constant"}'
configured_as: week4
configuration_vocabulary:
  dt:
  - week
  - day
  transmissibility:
  - constant
  - '{knots: [...]}'
  components: '{name: {start, stop}}'
capabilities:
  base:
    dynamics:
    - closed_epidemic_renewal
    structure:
    - single_group
    outcome_role:
      infections: prevented
    intervention_action:
    - reduce_rate
    estimands:
    - r0
    - reff_start
    - reff_end
    - reff_ref
    - attack_rate
    - growth_rate
    - incidence_series
    calibration_data:
    - incidence_series
parameters:
- name: r0
  value: 2.0
  kind: calibrated
  units: secondary infections per infection in a fully susceptible population, reference transmissibility
  lo: 0.05
  hi: 40.0
  source: calibrated per run; its prior is declared in the signed spec (calibration.priors), published ranges in
    toolkit/engines/renewal/ranges.yaml
  verified: unverified
published_ranges:
  generic:
    seed:
      what: infections in the step before the series starts, as a share of the population
      range:
      - 1.0e-07
      - 0.001
      dist: loguniform
      spread: 'wide by design: the series'' first weeks inform it; set the lower end near one infection in the population'
      source: 'assumption: no published value; the data inform it'
      verified: unverified
    s0:
      what: susceptible share at the start of the series (1 minus prior immunity to this strain or serotype)
      range:
      - 0.0
      - 1.0
      spread: 'not identified by a case series alone (RW4 scale invariance): with a case series only, the attack
        rate scales with s0 while reff_end does not; declare it from a serosurvey or the question, or carry its
        full range'
      source: the question or a serosurvey
      verified: unverified
    dispersion:
      what: negative-binomial size k of the reported counts (variance mu + mu^2 / k)
      range:
      - 1.0
      - 1000.0
      dist: loguniform
      spread: weakly informative; the series informs it
      source: 'assumption: no published value'
      verified: unverified
  dengue:
    r0:
      what: basic reproduction number (vector dynamics absorbed), from outbreak growth rates
      range:
      - 1.3
      - 5.0
      spread: range of published estimates across settings and seasons
      source: 'to transcribe: Johansson, Hombach & Cummings (2011) Vaccine 29:5860 (review of dengue model parameters);
        Favier et al. (2006) Trop Med Int Health 11:332 (early growth-rate estimates, Brazil)'
      verified: unverified
    reporting_fraction:
      what: reported cases per infection (all infections, inapparent included)
      range:
      - 0.0333
      - 0.333
      dist: loguniform
      spread: range of published ratios across settings, stated as rough; a spec may widen it with a reason
      source: Bhatt et al. (2013) Nature 496:504 (about one in four infections apparent); Undurraga et al. (2013)
        PLoS Negl Trop Dis 7:e2056 (expansion factors from reported to symptomatic cases)
      verified: unverified
    intrinsic_incubation_days:
      what: infection to symptom onset in humans (part of the infection-to-report delay)
      range:
      - 3.0
      - 10.0
      spread: about 95% of cases; mean about 6 days
      source: Chan & Johansson (2012) PLoS One 7:e50972
      verified: unverified
    generation_interval_weeks:
      what: human-to-human generation interval (through the mosquito)
      range:
      - 2.0
      - 4.0
      spread: mean, depends on temperature
      source: Siraj et al. (2017) PLoS Negl Trop Dis 11:e0005797
      verified: unverified
validation_label: validated against analytic identities (final size, Wallinga-Lipsitch, reproduction-number identities,
  scale invariance) and known-R_t recovery; published benchmark RW9 (Cori et al. 2013 worked examples) not yet assessed
