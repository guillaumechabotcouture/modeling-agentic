name: renewal
version: '0.1'
mechanisms:
- one closed population; no births, deaths, waning immunity or migration within the horizon
- discrete renewal equation on the generation interval's grid (Fraser 2007; Cori et al. 2013) with susceptible depletion
  in the exponential-survival form (final-size relation exact at any step)
- 'generation interval declared per question: 4 lags of one week, mean 2.35 weeks'
- 'R_t = R0 c(t) S_t-1: transmissibility piecewise constant between declared knots (constant)'
- interventions as multipliers (1 - effect) on R_t over a declared period
- 'deterministic: no random numbers; the seed is recorded only'
components:
  none:
  - 0
unit_attributes:
  N: population (> 0)
  s0: susceptible share at the start, before the seed [0, 1] (default 1)
  seed: infections in the step before the start, as a share of N [0, 0.1] (default 1e-6)
outputs:
  per_capita:
  - infections
  windows:
  - attack_rate
  - s_start
  - s_end
  - reff_start
  - reff_end
  - reff_ref
  - growth_rate
  - peak_time
  - r0
  cost_drivers: []
  series:
    infections:
      label: new infections
      units: infections per person-year
      aggregate: rate
      denominator: person-year
    reff:
      label: instantaneous reproduction number R_t
      units: infections per infection
      aggregate: mean
      denominator: person
    susceptible:
      label: susceptible share
      units: share
      aggregate: mean
      denominator: person
age_groups:
- all
valid_ranges:
  s0:
  - 0.0
  - 1.0
  seed:
  - 0.0
  - 0.1
  r0:
  - 0.05
  - 40.0
fitted: {}
