# Analysis-engine thresholds (v2 workstream B). Proposals for the owner's review; code reads
# them from here and restates none.
stability:
  # Spike lesson 5: allocation stability judged by the share of the objective lost when one
  # group's data are withheld and the fold plan is judged with the full calibration. The
  # spike's worst fold lost 0.73%.
  value_loss_pct_robust: 1.0
  value_loss_pct_fragile: 5.0
decision_tests:
  # Phase 49 result files: the plan changes when more than this share of units change package
  # (the spec's analysis.share_threshold overrides it).
  share_threshold: 0.10
calibration:
  # v2d §3.1-§3.3 (proposals for the owner's review, open question 7). The `posterior` method's sampler is chosen by
  # dimension: importance sampling over the prior plus adaptive stages up to `max_importance_params`, adaptive
  # Metropolis above. Below a floor the step fails closed.
  max_importance_params: 5   # measured (β): an engine call costs ~40 ms whatever the batch, so 4-chain Metropolis on run_batch() takes ~20 min per fit
  sobol_log2: 14              # first stage: 2^14 scrambled Sobol points over the prior
  stage_log2: 13              # each adaptive stage: a Gaussian fitted to the weighted points (balance-heuristic pool)
  max_stages: 6
  ess_floor: 1000
  chains: 4
  warmup: 4000
  mcmc_draws: 4000            # per chain; doubled up to `mcmc_max_doublings` times before failing closed
  mcmc_max_doublings: 4       # measured (β): 3 left 2 of 200 SB3a fits at R-hat 1.011-1.012
  rhat_max: 1.01
  ess_bulk_min: 400
  draws_kept: 4000            # rows of the canonical posterior sample
  # identifiability classes (§3.2): Fisher information of the likelihood alone, in prior-scale units (each parameter
  # on its prior's own scale, divided by the prior sd), plus contraction 1 - var_post / var_prior on that scale.
  flat_eigenvalue: 0.111      # a direction is flat when the likelihood adds less than 1/9 of the prior's precision
  ridge_loading_min: 0.30     # a parameter loads on a flat direction (as scripts/identifiability.py RIDGE_LOADING_MIN)
  contraction_prior_dominated: 0.1
  contraction_identified: 0.5
  ridge_condition_max: 1.0e+8 # likelihood method: a larger condition number (or a null direction) is refused
  spread_ratio_alarm: 0.5     # realised draw sd below this x the sample sd: draws too few or broken (alarm only)
