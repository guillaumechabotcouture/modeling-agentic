# Analysis-engine thresholds (v2 workstream B). Proposals for the owner's review; code reads
# them from here and restates none.
stability:
  # Spike lesson 5: allocation stability judged by the share of the objective lost when one
  # group's data are withheld and the fold plan is judged with the full calibration. The
  # spike's worst fold lost 0.73%.
  value_loss_pct_robust: 1.0
  value_loss_pct_fragile: 5.0
decision_tests:
  # Phase 49 result files: the plan changes when more than this share of units change package
  # (the spec's analysis.share_threshold overrides it).
  share_threshold: 0.10
  # F6 S1-5 (proposals for the owner's review): a test also changes the plan when keeping the point plan loses more
  # than this share of the re-optimised objective (regret; the stability robust bound, 1%), or when more than this
  # share of the allocatable budget moves between components. The spec's analysis.regret_threshold and
  # analysis.dollars_threshold override them (toolkit/analysis/moves.py).
  regret_share_threshold: 0.01
  dollars_share_threshold: 0.05
calibration:
  # v2d §3.1-§3.3 (proposals for the owner's review, open question 7). The `posterior` method's sampler is chosen by
  # dimension: importance sampling over the prior plus adaptive stages up to `max_importance_params`, adaptive
  # Metropolis above. Below a floor the step fails closed.
  max_importance_params: 4
  # measured (β): one run_batch() call costs ~40 ms whatever the batch size, so 4-chain Metropolis on the engine takes
  # ~20 min per fit; problems evaluated with run_batch() use importance sampling up to 5 parameters. Problems read
  # from initial_state() (microseconds) keep 4: at 5, 2 of 200 SB3b fits fell below the ESS floor.
  max_importance_params_run_batch: 5
  sobol_log2: 14              # first stage: 2^14 scrambled Sobol points over the prior
  stage_log2: 13              # each adaptive stage: a population Monte Carlo mixture (balance-heuristic pool)
  max_stages: 12              # measured (SB2b follow-up): curved 5-parameter ridges needed up to 12 mixture stages
  ess_floor: 1000
  chains: 4
  warmup: 4000
  mcmc_draws: 4000            # per chain; doubled up to `mcmc_max_doublings` times before failing closed
  mcmc_max_doublings: 4       # measured (β): 3 left 2 of 200 SB3a fits at R-hat 1.011-1.012
  rhat_max: 1.01
  ess_bulk_min: 400
  draws_kept: 4000            # rows of the canonical posterior sample
  # identifiability classes (§3.2): Fisher information of the likelihood alone, in prior-scale units (each parameter
  # on its prior's own scale, divided by the prior sd), plus contraction 1 - var_post / var_prior on that scale.
  flat_eigenvalue: 0.111      # a direction is flat when the likelihood adds less than 1/9 of the prior's precision
  ridge_loading_min: 0.30     # a parameter loads on a flat direction (as scripts/identifiability.py RIDGE_LOADING_MIN)
  contraction_prior_dominated: 0.1
  contraction_identified: 0.5
  ridge_condition_max: 1.0e+8 # likelihood method: a larger condition number (or a null direction) is refused
  spread_ratio_alarm: 0.5     # realised draw sd below this x the sample sd: draws too few or broken (alarm only)
estimates:
  # v2d §2.3 (estimates deliverable), proposals for the owner's review.
  # An output that moves by more than this share of its median across an undetermined parameter's own posterior range
  # (marginal slope in the canonical draws x the parameter's central interval) is reported as set by that
  # parameter's declared range, not by the data.
  dependence_max: 0.1          # a diagnostic since Codex r2-1 (the class reads flat_share_max)
  # An output whose spread along the likelihood's flat directions (per prior sd) is at least this share of its
  # posterior sd is set by the declared ranges: along those directions only the priors bound it (Codex r2-1).
  flat_share_max: 0.5
  # A prior_range test end whose best fit is worse than the full posterior's by more than this log-likelihood is
  # rejected by the data (1.92: the 95% likelihood-ratio cut for one parameter), and cannot change the decision.
  end_loglik_drop_max: 1.92
  # When importance sampling at the calibration defaults stays below its ESS floor (a curved ridge, as an unknown
  # initial susceptible share gives), it is retried once with this larger budget before adaptive Metropolis (measured
  # on the estimates self-test: ESS 332 at the defaults, 2,135 with this budget, 58 s).
  importance_retry: {sobol_log2: 16, stage_log2: 14, max_stages: 20}
burden:
  # F6 S2-5 (proposals for the owner's review): absolute burden against external estimates (toolkit/analysis/burden.py).
  # A reference's ratio tolerance (model / reference value) defaults to `default_ratio_band` and may not be declared
  # wider than `widest_ratio_band`; a reference year more than `max_year_gap` years from the decision window is refused.
  default_ratio_band: [0.5, 2.0]
  widest_ratio_band: [0.2, 5.0]
  max_year_gap: 5
burden_anchor:
  # F6 S2-5d (proposals for the owner's review): an anchor row (validation.burden, role anchor) scales a group's
  # outcomes by external value / model value over the model window. A factor, or an end of its interval, outside
  # [factor_min, factor_max] stops the analysis: the model and the external level disagree too much to rescale.
  factor_min: 0.05
  factor_max: 20
emulator:
  # F6 S2-4b (proposals for the owner's review): ranking accuracy near package switches (toolkit/analysis/boundary.py).
  # The `boundary_units` units whose plan package and runner-up are closest in benefit per cost are run on the engine
  # at their calibrated values (3 or more runs each); when fewer than `boundary_rank_agreement_min` of them are in the engine's
  # order, a gate finding. A unit whose two engine ratios are within `boundary_tie_rel_gap` of each other (relative)
  # is an engine tie: either order loses at most that share of benefit per cost, so it counts as matched.
  # Outside `calibration` and `estimates`, so changing these restamps no engine evidence.
  boundary_units: 20
  boundary_rank_agreement_min: 0.8
  boundary_tie_rel_gap: 0.01
value_of_information:
  # F6 (proposals for the owner's review; toolkit/analysis/value_of_information.py). Regression EVPPI (Strong, Oakley &
  # Brennan 2014) fits each candidate plan's net benefit on an input; with few draws the max over noisy fitted values
  # biases it upward. Below min_draws the step does not run: a spline chosen by GCV needs several draws per degree of
  # freedom, and the bootstrap enough distinct draws. Below informative_draws every value is labelled indicative (the
  # paper's examples use thousands of draws); at every count each value is reported beside its permutation noise floor.
  min_draws: 30
  informative_draws: 500
  max_df_share: 0.2         # the smoother's degrees of freedom at most this share of the draws
  max_knots: 6              # natural cubic spline knots per input (2: linear)
  bins: 4                   # quantile bins of an input: feasibility after learning, and conditional candidate plans
  min_bin_draws: 8          # fewer bins when the draws would leave fewer than this many per bin
  max_conditional_solves: 120   # solves for the plans decided within each bin (the rest recorded as truncated)
  permutations: 100         # shuffles of an input against the net benefits (GCV repeated) for its noise floor
  noise_quantile: 0.95      # the noise floor: this quantile of the shuffled EVPPI
  exceeds_evpi_tol: 0.02    # an EVPPI above EVPI by more than this share of EVPI is flagged (exceeds_evpi)
