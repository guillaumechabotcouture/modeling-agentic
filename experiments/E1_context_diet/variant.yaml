# E1 variant: context diet — trimmed prompt + active contract packet + on-demand skill index,
# no preloaded skills. modeler_contract.rendered.md is the frozen render; the renderer and
# agents/contract_packet.py were removed in Phase 46 α (both are in the history before it).
id: contract-packet
model: claude-opus-5-5
prompt_file: modeler_contract.rendered.md
skills: []
# Skill tool added so the modeler can load skills on demand. NOTE: scripts/replay.py's
# variant schema does not yet support a `tools` override (as of 44d7c98) — needs adding.
tools: [Bash, Write, Edit, Read, Glob, Grep, Skill]
max_turns: 60
budget_usd: 20
wall_timeout_s: 5400
