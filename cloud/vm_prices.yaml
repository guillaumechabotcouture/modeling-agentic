# Upper-bound USD per instance-hour for live Coiled instances (cloud/budget.py). A running instance counts
# hours x max(the scope's measured median rate, this bound). A VM type not listed here refuses every launch
# (fail closed): add it before using it. budget.py's self-test (BR18) checks that every VM type named in cloud/,
# cloud/configs/ and scripts/compute.py, and every type seen on our clusters (budget.OBSERVED_VM_TYPES), is here.
#   bound = usd_per_hour x margin + vcpu x credits_per_vcpu_hour x 0.061 (USD per Coiled credit)
# usd_per_hour: Azure pay-as-you-go Linux list prices (US regions, approximate, 2026), per vCPU-hour: Dv5 and Dsv5
# $0.048, Dasv5 $0.043, Esv5 $0.063, Easv5 $0.0565, Edsv5 $0.072, Fsv2 $0.0423 (compute-optimised; Coiled picks it
# for a --cpu request without --memory, e.g. Standard_F8s_v2 on cluster 2376181, 2026-11-13). coiled 1.135.6 states no per-instance credit
# charge in its source. Evidence from our own records (read-only, 2026-11-11): the P6 cluster, 25 x Standard_E8s_v5
# workers + 1 x Standard_D2_v5 scheduler for about 2.6 h, billed 510.3 credits (about 1.0 credit per vCPU-hour)
# and cloud_total_cost $32.11 (about list price x hours). So credits_per_vcpu_hour 1.5 and margin 1.25 sit about
# 50% and 25% above what was billed.
# memory_gib: Azure's published memory per VM size (Dv5, Dsv5, Dasv5: 4 GiB per vCPU; Esv5, Easv5, Edsv5: 8; Fsv2: 2).
# vm_job and run_cluster pin their clusters' VM types from this table (budget.vm_types_for): a type not listed here is
# never requested, and a request that no listed type matches is refused before any cluster is created.
margin: 1.25
credits_per_vcpu_hour: 1.5
types:
  Standard_D2_v5:       {vcpu: 2, memory_gib: 8, usd_per_hour: 0.096}
