    or CXR) and cases_detected; and the uncertainty analysis must report the total as an output named total_cases_detected.'
  engine: toolkit.engines.empirical.engine:PackageRateEngine
  engine_mode: trial_priors
  template: data/world_model_trials/tb_acf
  inputs: 'derived from data/evals/tb_acf public inputs: target population from districts.csv; undiagnosed prevalence
    = mean CXR yield per person screened / an assumed CXR algorithm sensitivity of 0.83; costs per person screened
    from algorithm_costs.csv at 70% reach; outcome = prevalent cases left undetected'
  rerun_of: tb_acf
  rerun_reason: the tb_acf smoke (2026-11-13) let the seed read the spec's effect priors, so its band tests confirmed
    the engine's own inputs; rerun with the spec's values, the engine's effect values and priors and the input data
    values withheld from the seed task, and circular tests classified
