# Self-tests + planted-defect regression eval on every pull request.
# No secrets: nothing here calls a model API or cloud service.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # structure metrics compare with main and read merged-PR history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # A project venv, as in local use: main.py's self-test checks that
      # agents get the venv interpreter first on PATH.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Self-tests (every script with --self-test)
        run: |
          fail=0
          # v2's harness modules under agents/ are listed by name (other agents/ files only mention
          # --self-test in text, or run a live preflight).
          for f in main.py $(git ls-files 'scripts/*.py' 'scripts/lib/*.py' 'toolkit/**/*.py' 'cloud/*.py') \
              agents/stage_machine.py agents/findings_ledger.py agents/fix_loop.py \
              agents/analysis_backend.py agents/v2_sdk_tasks.py; do
            case "$f" in */__init__.py) continue;; esac
            grep -q -- '--self-test' "$f" || continue
            echo "::group::$f"
            if ! .venv/bin/python "$f" --self-test; then echo "::error file=$f::self-test failed"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

      # HEAD is the PR's merge commit; its first parent is the base branch. --upstream:
      # a PR into a long-lived branch (v2) that merges main brings main's checked rows.
      - name: Ledger and plan Status change only through changes/ fragments
        if: github.event_name == 'pull_request'
        run: .venv/bin/python scripts/assemble_changes.py --check-pr HEAD^1 --upstream origin/main

      - name: Skill attachments and expert priors
        run: |
          .venv/bin/python scripts/validate_skill_attachments.py
          .venv/bin/python scripts/lib/expert_priors.py --validate

      - name: Planted-defect regression eval (deterministic gates)
        run: .venv/bin/python scripts/regression_eval.py

      # Every gate_findings(run_dir) check against every bad-input class; known
      # failures are listed in tests/gate_fuzz_expected.yaml.
      - name: Gate fuzz (bad input never crashes a check or makes it pass)
        timeout-minutes: 3
        run: .venv/bin/python scripts/gate_fuzz.py

      - name: Structure metrics against main (information only)
        if: always()
        continue-on-error: true
        run: |
          # HEAD is the PR's merge commit (or the pushed main commit): its first
          # parent is the base it was built on, which a later merge to main does not move.
          python3 scripts/structure_metrics.py --ref HEAD^1 --against HEAD | tee -a "$GITHUB_STEP_SUMMARY"
