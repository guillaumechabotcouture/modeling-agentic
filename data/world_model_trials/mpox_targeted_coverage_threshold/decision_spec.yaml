# World-model trial template (mpox_targeted_coverage_threshold, batch 4): synthetic units from generate_units.py. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. Mpox (clade IIb) is
  spreading in a high-contact sexual network in 24 cities in 2026. Each city can offer targeted vaccination to the
  high-contact group (1-4% of residents) from day 0: VAX (a two-dose campaign in the group, US$0.80 per resident
  of the city), or none. Coverage achieved in the group is uncertain (20-90%). Transmission is concentrated in the
  group (its members have many more contacts, mostly with each other); the rest of the population mixes little and
  is largely protected by past vaccination or low contact. The budget is US$15 million. Input file: units.csv (population,
  high-contact share, share of the group still susceptible, infections at the start). Choose where to vaccinate
  to maximise mpox infections averted within the budget, report the total with a 95% uncertainty interval, and state
  the rule (what coverage in the group stops transmission, and where is a campaign wasted?).'
decision_maker: city sexual-health and outbreak service (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.compartmental.engine:CompartmentalEngine
  config:
    structure: age_groups_contact_matrix
    mode: to_extinction
    final_size: true
    initialiser: given
    dt: week
    time_unit: day
    transmission: q
    tol: 1.0e-10
    generation_interval:
      seir:
        latent_days: 7.0
        infectious_days: 14.0
    groups: &id001
    - high
    - rest
    components:
      vax:
        kind: campaign
        targets:
        - high
        reach: 0.5
        day: 0
horizon:
  start: 0
  stop: 730
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups: *id001
  engine_attributes:
    N:
      column: n_groups
      split: ' '
    s0:
      column: s0_groups
      split: ' '
    contact:
      value:
      - - 15.0
        - 1.0
      - - 0.02
        - 1.5
      source: 'assumption: daily contacts relevant to transmission; the group mixes assortatively (15 within, 1
        outside) and the rest of the population rarely (1.5 among themselves, 0.02 with the group); fixed across
        cities, so reciprocity holds only approximately where the group''s share differs (declared limitation)'
    seed:
      column: seed_share
    intro:
      value: high
      source: infection circulates in the high-contact network
  defaults_accepted:
    always_immune: 'none declared: immunity is in s0'
    always_susceptible: none declared
options:
  populations:
    total: pop
  components:
    vax: {}
  packages:
    none: []
    vax:
    - vax
  engine_map:
    vax:
      vax: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: vax_cost
    component: vax
    value: 0.8
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - vax
objective:
  outcome: infections
  sense: avert
  horizon:
  - 0
  - 730
  discounting: none
constraints:
  envelope_usd: 15000000
comparator:
  package: none
  text: no added measure
outcomes_reported:
- infections
engine_parameters:
  efficacy:vax:
    value: 0.8
    range:
    - 0.7
    - 0.9
    dist: triangular
    basis: literature
    source: Deputy NP et al. Vaccine effectiveness of JYNNEOS against mpox disease in the United States. N Engl
      J Med 2023;388:2434-43 (adjusted effectiveness about 0.75 after one dose and 0.86 after two)
    reason: protection of the susceptibles reached
calibration:
  method: emulator_inversion
  attribute: reach:vax
  scale: linear
  range:
  - 0.2
  - 0.9
  target_column: r0_target
  window:
  - 0
  - 730
  metric: r0
  target_uncertainty:
    region_sd_logit: 0.05
  note: the swept attribute is the coverage the campaign achieves in the high-contact group (a scenario axis, not
    fitted); q stays at the engine default 0.2, so R0 = 0.2 x the spectral radius of the contact matrix, about 3
    in the group
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features: &id002
    - high_share
    - s0_high
    - seed_share
    independent_features:
      features: *id002
      generator: generate_units.py
      basis: generate_units.py draws each of these columns from its own seeded random stream, independently of every
        other column, and keeps the first seed (here 4204) whose realized table has pairwise |Spearman| <= 0.2 among
        them (realized maximum 0.192)
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: infections_averted
  headline:
    name: total_infections_averted
    outcome: infections
