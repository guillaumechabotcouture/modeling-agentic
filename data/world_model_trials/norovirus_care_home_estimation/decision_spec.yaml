# World-model trial template (norovirus_care_home_estimation, batch 3): synthetic units from generate_units.py; see the questions file
# for its inputs. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. Norovirus outbreaks
  have begun in 24 care homes (40-200 residents and staff). Using a renewal-equation model of one closed population
  per home, estimate (1) the share of the home infected over the outbreak and (2) the week of the peak, each with
  a 95% uncertainty interval, and say how both depend on the home''s size, on the number infected when the outbreak
  is detected and on the uncertain share still susceptible. Also say whether an outbreak-control bundle started
  on day 3 after detection (US$20 per resident) changes the attack rate materially. Input file: units.csv (residents
  and staff, infections at detection as a share of the home).'
decision_maker: programme manager (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: day
    generation_interval:
      dt: day
      w:
      - 0.1
      - 0.25
      - 0.3
      - 0.2
      - 0.1
      - 0.05
    transmissibility: constant
    components:
      control:
        start: 2026.008214
        stop: 2026.25
horizon:
  start: 2026.0
  stop: 2026.25
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
    seed:
      column: seed_share
options:
  populations:
    total: pop
  components:
    control: {}
  packages:
    none: []
    control:
    - control
  engine_map:
    control:
      control: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: control_cost
    component: control
    value: 20.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - control
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2026.25
  discounting: none
constraints:
  envelope_usd: 100000
comparator:
  package: none
  text: no measure
outcomes_reported:
- infections
engine_parameters:
  effect:control:
    value: 0.25
    range:
    - 0.1
    - 0.4
    dist: uniform
    basis: literature
    source: 'outbreak-control bundles (isolation, exclusion of ill staff, enhanced cleaning) in semi-enclosed settings:
      reductions of transmission are uncertain, assumed 0.1-0.4 (Harris JP, Lopman BA, O''Brien SJ. Infection control
      measures for norovirus: a systematic review of outbreaks in semi-enclosed settings. J Hosp Infect 2010;74:1-9)'
    reason: the assumed range
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.4
  - 1.0
  target_column: s0
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.2
  note: 'R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch): the swept susceptible share
    spans R_eff = 2 s0 from 0.8 to 2, across the epidemic threshold. Daily generation interval with mean about 3
    days (assumed).'
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features: &id001
    - seed_share
    - pop
    independent_features:
      features: *id001
      generator: generate_units.py
      basis: generate_units.py draws each of these columns from its own seeded random stream, independently of every
        other column (synthetic units table)
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: infections_averted
  headline:
    name: total_infections_averted
    outcome: infections
