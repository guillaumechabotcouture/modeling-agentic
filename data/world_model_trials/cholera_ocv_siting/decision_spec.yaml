# World-model trial template (cholera_ocv_siting): generated deterministically; see the questions file for its
# inputs and derivation. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every district and number is synthetic. A national cholera
  programme has US$2.5 million for preventive oral cholera vaccine (OCV) campaigns in 2026 across 12 districts.
  For each district choose one option: none; OCV1 (a single-dose campaign); OCV2 (a two-dose campaign). A campaign
  reaches 70% of the population. Cost: US$3.00 per dose delivered (vaccine and delivery). Input file: units.csv
  (population, suspected cholera incidence per person-year over the last five years with no vaccination, share with
  improved sanitation). Choose the options that maximise suspected cholera cases averted over 2026-2027 within the
  budget, report the total with a 95% uncertainty interval, and state the decision rule for siting the campaigns.'
decision_maker: programme manager (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.empirical.engine:PackageRateEngine
  config:
    components:
    - ocv1
    - ocv2
    outcome: cases
    mode: trial_priors
    outcomes:
      cases:
        baseline_source: synthetic suspected-case surveillance, 2021-2025, no vaccination
    baseline:
      measured_under: no_components
      source: no OCV campaign in the last five years (synthetic)
    effects:
      ocv1:
        cases:
          rr: 0.73
          range:
          - 0.58
          - 0.92
          dist: triangular
          measure: rate_ratio
          source: 'derived: 1 - reach 0.7 x single-dose efficacy 0.39 (0.11-0.60) over two years (Qadri et al. 2018,
            Lancet Glob Health 6:e680; Qadri et al. 2016, Lancet 387:1362)'
          verified: false
      ocv2:
        cases:
          rr: 0.59
          range:
          - 0.52
          - 0.71
          dist: triangular
          measure: rate_ratio
          source: 'derived: 1 - reach 0.7 x two-dose efficacy 0.58 (0.42-0.69) (Bi et al. 2017, Lancet Infect Dis
            17:1080, meta-analysis of killed whole-cell OCV)'
          verified: false
    combination:
      rule: multiplicative
      source: 'alternatives: one campaign type per district; direct protection only (no herd effect)'
horizon:
  start: 2026.0
  stop: 2028.0
decision_units:
  csv: units.csv
  id: id
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    baseline_rate:
      columns:
        cases: inc
  region: region
options:
  populations:
    total: pop
  components:
    ocv1:
      group: ocv
    ocv2:
      group: ocv
  packages:
    none: []
    ocv1:
    - ocv1
    ocv2:
    - ocv2
  engine_map:
    ocv1:
      ocv1: 1
    ocv2:
      ocv2: 1
  prices:
    base_year: '2025'
    index:
      '2025': 1.0
  cost_items:
  - id: ocv1_doses
    component: ocv1
    value: 3.0
    price_year: '2025'
    price_rule: as_published
    basis: per_person
    includes:
    - ocv1_doses
    share: 0.7
  - id: ocv2_doses
    component: ocv2
    value: 6.0
    price_year: '2025'
    price_rule: as_published
    basis: per_person
    includes:
    - ocv2_doses
    share: 0.7
objective:
  outcome: cases
  sense: avert
  horizon:
  - 2026.0
  - 2028.0
  discounting: none
constraints:
  envelope_usd: 2500000
comparator:
  package: none
  text: no package in the decision window
outcomes_reported:
- cases
calibration:
  method: none
  attribute: inert_design_axis
  scale: linear
  range:
  - 0.0
  - 1.0
  window:
  - 0.0
  - 0.0
  note: trial_priors mode calibrates nothing; batch.design needs a calibrated attribute, so the design's first axis
    is an attribute the engine does not read (inert by construction)
uncertainty:
  draws: 16
  seed: 3
  sources:
  - kind: priors
  excluded:
  - kind: calibration
    reason: 'no calibration: external baselines'
  - kind: engine_parameters
    reason: no fitted engine parameters
  - kind: costs
    reason: unit costs taken as given in this trial
  - kind: emulator
    reason: 'world-model trial: the sweep is read directly'
analysis:
  evaluation: emulator
  emulator:
    points: 16
    holdout_share: 0.0
    seed: 7
    features:
    - inc
    - wash
    - pop
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
  decision_tests: []
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: cases_averted
  headline:
    name: total_cases_averted
    outcome: cases
