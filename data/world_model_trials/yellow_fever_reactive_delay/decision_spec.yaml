# World-model trial template (yellow_fever_reactive_delay, batch 3): synthetic units from generate_units.py; see the questions file
# for its inputs. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. Yellow fever transmission
  has been confirmed in 24 towns in early 2026. Each town can run a reactive mass vaccination campaign starting
  in week 3 (FAST, with emergency stockpile vaccine, US$3.50 per resident) or in week 8 (STANDARD, US$2.00 per resident),
  or no campaign. Population immunity from past campaigns is uncertain. The budget is US$8 million. Input file:
  units.csv (population, infections at the start of 2026 as a share of the population). Choose for each town whether
  and how fast to vaccinate, to maximise yellow fever infections averted in 2026, report the total with a 95% uncertainty
  interval, and say how much the delay of the cheaper campaign costs and where.'
decision_maker: programme manager (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.1
    - 0.3
    - 0.35
    - 0.2
    - 0.05
    transmissibility: constant
    components:
      fast:
        start: 2026.057495
        stop: 2027.0
      standard:
        start: 2026.15332
        stop: 2027.0
horizon:
  start: 2026.0
  stop: 2027.0
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
    seed:
      column: seed_share
options:
  populations:
    total: pop
  components:
    fast:
      group: campaign
    standard:
      group: campaign
  packages:
    none: []
    fast:
    - fast
    standard:
    - standard
  engine_map:
    fast:
      fast: 1
    standard:
      standard: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: fast_cost
    component: fast
    value: 3.5
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - fast
  - id: standard_cost
    component: standard
    value: 2.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - standard
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2027.0
  discounting: none
constraints:
  envelope_usd: 8000000
comparator:
  package: none
  text: no measure
outcomes_reported:
- infections
engine_parameters:
  effect:fast:
    value: 0.7
    range:
    - 0.5
    - 0.85
    dist: uniform
    basis: literature
    source: 'yellow fever vaccine: seroconversion in 99% of recipients within 30 days (Gotuzzo E, Yactayo S, Cordova
      E. Efficacy and duration of immunity after yellow fever vaccination: systematic review on the need for a booster
      every 10 years. Am J Trop Med Hyg 2013;89:434-444); with 50-85% campaign coverage the reduction in transmission
      is about 0.5-0.85'
    reason: the derived range
  effect:standard:
    value: 0.7
    range:
    - 0.5
    - 0.85
    dist: uniform
    basis: literature
    source: 'yellow fever vaccine: seroconversion in 99% of recipients within 30 days (Gotuzzo E, Yactayo S, Cordova
      E. Efficacy and duration of immunity after yellow fever vaccination: systematic review on the need for a booster
      every 10 years. Am J Trop Med Hyg 2013;89:434-444); with 50-85% campaign coverage the reduction in transmission
      is about 0.5-0.85'
    reason: the derived range
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.45
  - 1.0
  target_column: s0
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.2
  note: 'R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch): the swept susceptible share
    spans R_eff = 2 s0 from 0.9 to 2, across the epidemic threshold. Weekly generation interval about 2.8 weeks
    (intrinsic plus extrinsic incubation, assumed).'
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features: &id001
    - seed_share
    - pop
    independent_features:
      features: *id001
      generator: generate_units.py
      basis: generate_units.py draws each of these columns from its own seeded random stream, independently of every
        other column (synthetic units table)
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: infections_averted
  headline:
    name: total_infections_averted
    outcome: infections
