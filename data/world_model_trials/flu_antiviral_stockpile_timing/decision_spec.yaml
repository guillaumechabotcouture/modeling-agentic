# World-model trial template (flu_antiviral_stockpile_timing, batch 4): synthetic units from generate_units.py; see the questions file
# for its inputs. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. An influenza epidemic
  is starting in 24 cities. Each city can release its antiviral stockpile for early treatment and household prophylaxis
  for eight weeks, starting in week 2 (EARLY, before most cases, US$3.00 per resident because of the outreach needed)
  or in week 6 (LATE, through clinics, US$1.80 per resident), or not at all. Pre-season immunity is uncertain. The
  budget is US$10 million. Input file: units.csv (population, infections at the start of 2026 as a share of the
  population). Choose the option per city that maximises influenza infections averted in the first half of 2026
  within the budget, report the total with a 95% uncertainty interval, and say when the earlier, costlier release
  is worth it.'
decision_maker: programme manager (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.6
    - 0.35
    - 0.05
    transmissibility: constant
    components:
      early:
        start: 2026.03833
        stop: 2026.19165
      late:
        start: 2026.11499
        stop: 2026.268309
horizon:
  start: 2026.0
  stop: 2026.5
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
    seed:
      column: seed_share
options:
  populations:
    total: pop
  components:
    early:
      group: release
    late:
      group: release
  packages:
    none: []
    early:
    - early
    late:
    - late
  engine_map:
    early:
      early: 1
    late:
      late: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: early_cost
    component: early
    value: 3.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - early
  - id: late_cost
    component: late
    value: 1.8
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - late
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2026.5
  discounting: none
constraints:
  envelope_usd: 10000000
comparator:
  package: none
  text: no measure
outcomes_reported:
- infections
engine_parameters:
  effect:early:
    value: 0.2
    range:
    - 0.1
    - 0.3
    dist: uniform
    basis: literature
    source: 'oseltamivir post-exposure prophylaxis of household contacts: protective efficacy 89% against clinical
      influenza (Welliver R, Monto AS, Carewicz O et al. Effectiveness of oseltamivir in preventing influenza in
      household contacts: a randomized controlled trial. JAMA 2001;285:748-754); with early treatment and household
      prophylaxis reaching 20-40% of transmission chains the reduction in transmission is about 0.1-0.3 (assumed)'
    reason: the derived range
  effect:late:
    value: 0.2
    range:
    - 0.1
    - 0.3
    dist: uniform
    basis: literature
    source: 'oseltamivir post-exposure prophylaxis of household contacts: protective efficacy 89% against clinical
      influenza (Welliver R, Monto AS, Carewicz O et al. Effectiveness of oseltamivir in preventing influenza in
      household contacts: a randomized controlled trial. JAMA 2001;285:748-754); with early treatment and household
      prophylaxis reaching 20-40% of transmission chains the reduction in transmission is about 0.1-0.3 (assumed)'
    reason: the derived range
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.5
  - 0.95
  target_column: s0
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.2
  note: 'R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch): the swept susceptible share
    spans R_eff = 2 s0 from 1 to 1.9, across the epidemic threshold. Weekly generation interval of influenza, mean
    about 1.5 weeks (about 3 days, assumed). The measure is temporary: eight weeks of reduced transmission.'
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features: &id001
    - seed_share
    - pop
    independent_features:
      features: *id001
      generator: generate_units.py
      basis: 'generate_units.py draws each of these columns from its own seeded random stream, independently of
        every other column, and searches seeds until the realized table''s maximum pairwise |Spearman| among them
        is at most 0.2 (seed 4220 (searched from 4220): max |Spearman| among [''pop'', ''seed_share''] = 0.180)
        (synthetic units table)'
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: infections_averted
  headline:
    name: total_infections_averted
    outcome: infections
