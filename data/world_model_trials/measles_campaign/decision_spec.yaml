schema_version: 1
question: 'SYNTHETIC TEST QUESTION (evaluation suite): every district, number and file below is synthetic, generated
  for this test; none describes a real place. A measles programme has US$850,000 for a catch-up vaccination campaign
  in early 2026 across 12 districts. For each district choose one option: none; A_1to4 (all children aged 1-4 years);
  B_1to9 (all children aged 1-9 years). A campaign reaches 85% of targeted children and seroconverts 93% of the
  susceptible children it reaches. Cost: US$1.20 per targeted child plus US$22,000 per district campaign; each single-year
  birth cohort is 3.0% of a district''s population. Routine MCV1 seroconverts about 85% of the children it reaches
  and MCV2 about 90% of those still susceptible. Assume everyone aged 15 years or older is immune and children under
  1 year are susceptible, and that in each district one measles importation in the coming period starts an outbreak
  whose size follows the final-size relation of a homogeneous-mixing SIR model, with R0 between 12 and 18 (uniform).
  Input files: data/evals/measles_campaign/districts.csv (2026 population), data/evals/measles_campaign/routine_coverage_admin.csv
  (administrative MCV1 and MCV2 coverage by birth cohort), data/evals/measles_campaign/serosurvey_2025.csv (a 2025
  serosurvey by age band; ages are as in 2025). Choose the options that maximise expected measles cases averted,
  report the total with a 95% uncertainty interval, and state the decision rule. Deliverables: allocation_optimized.csv
  in the run directory with columns district, package (none, A_1to4 or B_1to9) and cases_averted; and the uncertainty
  analysis must report the total as an output named total_cases_averted.'
decision_maker: measles programme manager (synthetic evaluation question)
decision_date: 2026
engine:
  ref: toolkit.engines.compartmental.engine:CompartmentalEngine
  config:
    groups:
    - u1
    - a1_4
    - a5_9
    - a10_14
    - a15p
    structure: birth_cohorts
    mode: to_extinction
    final_size: true
    initialiser: given
    dt: week
    generation_interval:
    - 0.1
    - 0.55
    - 0.3
    - 0.05
    transmission: q
    components:
      A_1to4:
        kind: campaign
        targets:
        - a1_4
        reach: 0.85
      B_1to9:
        kind: campaign
        targets:
        - a1_4
        - a5_9
        reach: 0.85
    tol: 1.0e-09
horizon:
  start: 0
  stop: 3650
decision_units:
  csv: districts.csv
  id: district
  populations:
    all:
      column: pop
      age_groups:
      - u1
      - a1_4
      - a5_9
      - a10_14
      - a15p
  engine_attributes:
    N:
      column: n_groups
      split: ' '
    s0:
      column: s0_groups
      split: ' '
    seed:
      value: 1.0e-06
      source: one importation in a district of ~1e6 people (question text)
    intro:
      value: a1_4
      source: importation into the youngest susceptible-rich band (assumption)
  defaults_accepted:
    always_immune: 15+ are immune through s0 = 0 (question text)
    always_susceptible: u1 susceptible through s0 = 1 (question text)
    reach:A_1to4: the configured 85% reach (question text)
    reach:B_1to9: the configured 85% reach (question text)
options:
  populations:
    total: pop
    children_1_4: pop_1_4
    children_1_9: pop_1_9
  components:
    A_1to4:
      group: campaign
      eligible: children_1_4
    B_1to9:
      group: campaign
      eligible: children_1_9
  packages:
    generate: true
  engine_map:
    A_1to4:
      A_1to4: 1
    B_1to9:
      B_1to9: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: A_child
    component: A_1to4
    value: 1.2
    price_year: '2026'
    price_rule: as_published
    basis: per_eligible
    includes:
    - vaccine
    - delivery
  - id: A_district
    component: A_1to4
    value: 22000
    price_year: '2026'
    price_rule: as_published
    basis: per_unit
    includes:
    - campaign_fixed
  - id: B_child
    component: B_1to9
    value: 1.2
    price_year: '2026'
    price_rule: as_published
    basis: per_eligible
    includes:
    - vaccine
    - delivery
  - id: B_district
    component: B_1to9
    value: 22000
    price_year: '2026'
    price_rule: as_published
    basis: per_unit
    includes:
    - campaign_fixed
objective:
  outcome: infections
  sense: avert
  horizon:
  - 0
  - 3650
  discounting: none
constraints:
  envelope_usd: 850000
comparator:
  package: none
  text: no catch-up campaign; routine immunisation only
outcomes_reported:
- infections
calibration:
  method: emulator_inversion
  attribute: contact_rate
  scale: linear
  range:
  - 60.0
  - 90.0
  target_column: r0_target
  window:
  - 0
  - 3650
  metric: r0
  target_uncertainty:
    region_sd_logit: 0.05
  note: transmission q stays at the engine default 0.2 (kind calibrated, not varied by the batch); with homogeneous
    mixing R0 = q x contact_rate, so contact_rate over [60, 90] spans the question's R0 range 12-18
engine_parameters:
  efficacy:A_1to4:
    value: 0.93
    range:
    - 0.88
    - 0.97
    dist: triangular
    basis: setting_data
    source: 'question text: a campaign seroconverts 93% of the susceptible children it reaches'
    reason: the stated seroconversion; the range (assumed) lets the sweep test how much it matters
  efficacy:B_1to9:
    value: 0.93
    range:
    - 0.88
    - 0.97
    dist: triangular
    basis: setting_data
    source: 'question text: a campaign seroconverts 93% of the susceptible children it reaches'
    reason: the stated seroconversion; the range (assumed) lets the sweep test how much it matters
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 16
    holdout_share: 0.0
    seed: 5
    features:
    - mean_susceptible
    - susc_1_4
    - susc_5_9
  stability:
    holdout_group: district
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: district
    package: package
    value: cases_averted
  headline:
    name: total_cases_averted
    outcome: infections
