# World-model trial template (covid_isolation_threshold, batch 4): synthetic units from generate_units.py; see the questions file
# for its inputs. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. A new respiratory virus
  with COVID-like transmission is spreading in 24 cities in 2026. Each city can fund case isolation with contact
  quarantine from week 1 at one of two coverage levels: ISO40 (about 40% of cases isolated, US$4.00 per resident)
  or ISO80 (about 80%, US$9.00 per resident), or not at all. Population immunity from earlier waves is uncertain.
  The budget is US$60 million. Input file: units.csv (population, infections at the start of 2026 as a share of
  the population). Choose the option per city that maximises infections averted in 2026 within the budget, report
  the total with a 95% uncertainty interval, and state the coverage threshold that brings the effective reproduction
  number below one.'
decision_maker: programme manager (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.45
    - 0.4
    - 0.15
    transmissibility: constant
    components:
      iso40:
        start: 2026.019165
        stop: 2027.0
      iso80:
        start: 2026.019165
        stop: 2027.0
horizon:
  start: 2026.0
  stop: 2027.0
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
    seed:
      column: seed_share
options:
  populations:
    total: pop
  components:
    iso40:
      group: coverage
    iso80:
      group: coverage
  packages:
    none: []
    iso40:
    - iso40
    iso80:
    - iso80
  engine_map:
    iso40:
      iso40: 1
    iso80:
      iso80: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: iso40_cost
    component: iso40
    value: 4.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - iso40
  - id: iso80_cost
    component: iso80
    value: 9.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - iso80
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2027.0
  discounting: none
constraints:
  envelope_usd: 60000000
comparator:
  package: none
  text: no measure
outcomes_reported:
- infections
engine_parameters:
  effect:iso40:
    value: 0.2
    range:
    - 0.1
    - 0.3
    dist: uniform
    basis: literature
    source: 'isolation of cases and quarantine of contacts: the reproduction number falls with the share of transmission
      isolated before onset (Hellewell J, Abbott S, Gimma A et al. Feasibility of controlling COVID-19 outbreaks
      by isolation of cases and contacts. Lancet Glob Health 2020;8:e488-e496; a modelling study); assumed reductions
      0.1-0.3 at 40% coverage and 0.25-0.55 at 80% coverage'
    reason: the assumed range
  effect:iso80:
    value: 0.4
    range:
    - 0.25
    - 0.55
    dist: uniform
    basis: literature
    source: 'isolation of cases and quarantine of contacts: the reproduction number falls with the share of transmission
      isolated before onset (Hellewell J, Abbott S, Gimma A et al. Feasibility of controlling COVID-19 outbreaks
      by isolation of cases and contacts. Lancet Glob Health 2020;8:e488-e496; a modelling study); assumed reductions
      0.1-0.3 at 40% coverage and 0.25-0.55 at 80% coverage'
    reason: the assumed range
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.5
  - 1.0
  target_column: s0
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.2
  note: 'R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch): the swept susceptible share
    spans R_eff = 2 s0 from 1 to 2, across the epidemic threshold. Weekly generation interval, mean about 1.7 weeks
    (about 5 days, assumed).'
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features: &id001
    - seed_share
    - pop
    independent_features:
      features: *id001
      generator: generate_units.py
      basis: 'generate_units.py draws each of these columns from its own seeded random stream, independently of
        every other column, and searches seeds until the realized table''s maximum pairwise |Spearman| among them
        is at most 0.2 (seed 4660 (searched from 4660): max |Spearman| among [''pop'', ''seed_share''] = 0.114)
        (synthetic units table)'
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: infections_averted
  headline:
    name: total_infections_averted
    outcome: infections
