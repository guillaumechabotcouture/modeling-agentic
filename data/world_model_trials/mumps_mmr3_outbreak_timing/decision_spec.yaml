# World-model trial template (mumps_mmr3_outbreak_timing, batch 3): synthetic units from generate_units.py; see the questions file
# for its inputs. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. Mumps outbreaks have
  started in 24 university campuses (2,000-30,000 students) among students who had two MMR doses in childhood; their
  remaining susceptibility is uncertain. Each campus can offer a third MMR dose, starting either in week 2 (EARLY,
  emergency clinics) or in week 6 (LATE, through student health services) of 2026, or not at all. Either costs about
  US$12 per student. The budget is US$2 million. Input file: units.csv (students, infections at the start of 2026
  as a share of students). Choose for each campus whether and when to offer the third dose, to maximise mumps infections
  averted in the first half of 2026, report the total with a 95% uncertainty interval, and say when an early campaign
  is worth it and when the outbreak would end anyway.'
decision_maker: programme manager (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.1
    - 0.3
    - 0.35
    - 0.2
    - 0.05
    transmissibility: constant
    components:
      early:
        start: 2026.03833
        stop: 2026.5
      late:
        start: 2026.11499
        stop: 2026.5
horizon:
  start: 2026.0
  stop: 2026.5
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
    seed:
      column: seed_share
options:
  populations:
    total: pop
  components:
    early:
      group: mmr3
    late:
      group: mmr3
  packages:
    none: []
    early:
    - early
    late:
    - late
  engine_map:
    early:
      early: 1
    late:
      late: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: early_cost
    component: early
    value: 12.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - early
  - id: late_cost
    component: late
    value: 12.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - late
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2026.5
  discounting: none
constraints:
  envelope_usd: 2000000
comparator:
  package: none
  text: no measure
outcomes_reported:
- infections
engine_parameters:
  effect:early:
    value: 0.35
    range:
    - 0.2
    - 0.5
    dist: uniform
    basis: literature
    source: 'third MMR dose in a university outbreak: mumps attack rate 78% lower 28 days or more after the dose
      (Cardemil CV, Dahl RM, James L et al. Effectiveness of a third dose of MMR vaccine for mumps outbreak control.
      N Engl J Med 2017;377:947-956); with 30-60% uptake the reduction in transmission is about 0.2-0.5'
    reason: the derived range
  effect:late:
    value: 0.35
    range:
    - 0.2
    - 0.5
    dist: uniform
    basis: literature
    source: 'third MMR dose in a university outbreak: mumps attack rate 78% lower 28 days or more after the dose
      (Cardemil CV, Dahl RM, James L et al. Effectiveness of a third dose of MMR vaccine for mumps outbreak control.
      N Engl J Med 2017;377:947-956); with 30-60% uptake the reduction in transmission is about 0.2-0.5'
    reason: the derived range
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.35
  - 0.8
  target_column: s0
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.2
  note: 'R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch): the swept susceptible share
    spans R_eff = 2 s0 from 0.7 to 1.6, across the epidemic threshold. Students had two doses: s0 is the waning-adjusted
    susceptible share.'
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features: &id001
    - seed_share
    - pop
    independent_features:
      features: *id001
      generator: generate_units.py
      basis: generate_units.py draws each of these columns from its own seeded random stream, independently of every
        other column (synthetic units table)
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: infections_averted
  headline:
    name: total_infections_averted
    outcome: infections
