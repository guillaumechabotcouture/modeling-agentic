# World-model trial template (mening_reactive_vs_preventive, batch 3): synthetic units from generate_units.py. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. A meningococcal serogroup
  C epidemic season is expected in 24 districts in 2026. For each district choose one strategy: none; PREVENTIVE
  (a mass campaign before the season, day 0, reaching 85% of residents, US$1.60 per resident); REACTIVE (the same
  campaign run only after weekly incidence crosses the epidemic threshold, which in practice completes about 8 weeks
  into the season, US$1.10 per resident because only districts in epidemic are vaccinated and stock is pooled).
  The budget is US$12 million. The basic reproduction number of the epidemic strain is uncertain (1.3-2.2). Input
  file: units.csv (population, share susceptible at the start of the season from a synthetic carriage and serology
  survey, share infected at the start). Choose the strategy per district that maximises meningococcal disease cases
  averted in the season within the budget, report the total with a 95% uncertainty interval, and state the rule
  (when does a cheaper reactive campaign arrive too late?).'
decision_maker: national meningitis programme (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.compartmental.engine:CompartmentalEngine
  config:
    groups: &id001
    - all
    structure: single_group
    mode: to_extinction
    final_size: true
    initialiser: given
    dt: week
    time_unit: day
    transmission: q
    components:
      preventive:
        kind: campaign
        targets:
        - all
        reach: 0.85
        day: 0
      reactive:
        kind: campaign
        targets:
        - all
        reach: 0.85
        day: 56
    tol: 1.0e-09
    generation_interval:
    - 0.4
    - 0.4
    - 0.2
horizon:
  start: 0
  stop: 365
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups: *id001
  engine_attributes:
    N:
      column: pop
      split: ' '
    s0:
      column: s0
      split: ' '
    seed:
      column: seed_share
  defaults_accepted:
    reach:preventive: the configured reach (question text)
    reach:reactive: the configured reach (question text)
    always_immune: 'none declared: immunity is in s0'
    always_susceptible: none declared
    intro: 'single group: the infection enters the only group'
options:
  populations:
    total: pop
  components:
    preventive:
      group: strategy
    reactive:
      group: strategy
  packages:
    none: []
    preventive:
    - preventive
    reactive:
    - reactive
  engine_map:
    preventive:
      preventive: 1
    reactive:
      reactive: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: preventive_cost
    component: preventive
    value: 1.6
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - preventive
  - id: reactive_cost
    component: reactive
    value: 1.1
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - reactive
objective:
  outcome: infections
  sense: avert
  horizon:
  - 0
  - 365
  discounting: none
constraints:
  envelope_usd: 12000000
comparator:
  package: none
  text: no added measure
outcomes_reported:
- infections
engine_parameters:
  efficacy:preventive:
    value: 0.93
    range:
    - 0.85
    - 0.97
    dist: triangular
    basis: literature
    source: 'Trotter CL et al. Impact of MenAfriVac in nine countries of the African meningitis belt, 2010-15: an
      analysis of surveillance data. Lancet Infect Dis 2017;17:867-72 (incidence of serogroup A meningitis about
      99% lower in vaccinated age groups; protection of the susceptibles reached by a campaign assumed 0.85-0.97)'
    reason: protection of the susceptibles reached
  efficacy:reactive:
    value: 0.93
    range:
    - 0.85
    - 0.97
    dist: triangular
    basis: literature
    source: 'Trotter CL et al. Impact of MenAfriVac in nine countries of the African meningitis belt, 2010-15: an
      analysis of surveillance data. Lancet Infect Dis 2017;17:867-72 (incidence of serogroup A meningitis about
      99% lower in vaccinated age groups; protection of the susceptibles reached by a campaign assumed 0.85-0.97)'
    reason: protection of the susceptibles reached
calibration:
  method: emulator_inversion
  attribute: contact_rate
  scale: linear
  range:
  - 6.5
  - 11.0
  target_column: r0_target
  window:
  - 0
  - 365
  metric: r0
  target_uncertainty:
    region_sd_logit: 0.05
  note: q stays at the engine default 0.2 (kind calibrated, not varied by the batch); with homogeneous mixing R0
    = q x contact_rate, so contact_rate over [6.5, 11.0] spans R0 1.3-2.2
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 64
    holdout_share: 0.0
    seed: 5
    features: &id002
    - s0
    - seed_share
    - pop
    independent_features:
      features: *id002
      generator: generate_units.py
      basis: generate_units.py draws each of these columns from its own seeded random stream, independently of every
        other column (synthetic units table)
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: infections_averted
  headline:
    name: total_infections_averted
    outcome: infections
