# World-model trial template (pneumo_campaign_season_timing, batch 4): synthetic units from generate_units.py. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. A season of serotype-1
  pneumococcal transmission and meningitis is expected in 24 districts in 2026 (basic reproduction number of carriage
  acquisition about 2; the share of residents still susceptible to carriage is uncertain, 50-100%). Each district
  can run one conjugate-vaccine campaign: PRE (completed by week 2, before the season builds, US$2.50 per resident)
  or LATE (completed by week 10, after the first cases, US$2.00 per resident because only districts with cases are
  covered), or none. Input file: units.csv (population, share carrying the serotype at the start). The budget is
  US$15 million. Choose the timing per district that maximises carriage acquisitions (and so meningitis cases) averted
  in 2026 within the budget, report the total with a 95% uncertainty interval, and state the rule (when does waiting
  for cases cost too much?).'
decision_maker: national immunisation programme (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.2
    - 0.4
    - 0.3
    - 0.1
    transmissibility: constant
    components:
      pre:
        start: 2026.03833
        stop: 2027.0
      late:
        start: 2026.19165
        stop: 2027.0
horizon:
  start: 2026.0
  stop: 2027.0
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
    seed:
      column: seed_share
options:
  populations:
    total: pop
  components:
    pre:
      group: timing
    late:
      group: timing
  packages:
    none: []
    pre:
    - pre
    late:
    - late
  engine_map:
    pre:
      pre: 1
    late:
      late: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: pre_cost
    component: pre
    value: 2.5
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - pre
  - id: late_cost
    component: late
    value: 2.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - late
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2027.0
  discounting: none
constraints:
  envelope_usd: 15000000
comparator:
  package: none
  text: no added measure
outcomes_reported:
- infections
engine_parameters:
  effect:pre:
    value: 0.3
    range:
    - 0.15
    - 0.5
    dist: uniform
    basis: literature
    source: Klugman KP. Efficacy of pneumococcal conjugate vaccines and their effect on carriage and antimicrobial
      resistance. Lancet Infect Dis 2001;1:85-91 (conjugate vaccines reduce acquisition of vaccine-type carriage;
      a campaign's reduction of transmission assumed 0.15-0.5 for the reach of a campaign)
    reason: share of transmission prevented
  effect:late:
    value: 0.3
    range:
    - 0.15
    - 0.5
    dist: uniform
    basis: literature
    source: Klugman KP. Efficacy of pneumococcal conjugate vaccines and their effect on carriage and antimicrobial
      resistance. Lancet Infect Dis 2001;1:85-91 (conjugate vaccines reduce acquisition of vaccine-type carriage;
      a campaign's reduction of transmission assumed 0.15-0.5 for the reach of a campaign)
    reason: share of transmission prevented
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.5
  - 1.0
  target_column: s0_survey
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.2
  note: 'R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch): the swept susceptible share
    spans R_eff = 2 s0 from 1.0 to 2.0'
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features: &id001
    - seed_share
    - pop
    independent_features:
      features: *id001
      generator: generate_units.py
      basis: generate_units.py draws each of these columns from its own seeded random stream, independently of every
        other column, and keeps the first seed (here 4202) whose realized table has pairwise |Spearman| <= 0.2 among
        them (realized maximum 0.035)
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: id
    package: package
    value: infections_averted
  headline:
    name: infections_averted
    outcome: infections
