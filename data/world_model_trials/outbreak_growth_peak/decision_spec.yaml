schema_version: 1
question: 'SYNTHETIC TRIAL QUESTION (world-model trials): the cities and numbers are synthetic. A respiratory pathogen
  with a generation interval of about 5 days (weekly grid: 0.6, 0.35, 0.05 of transmission in weeks 1-3) is spreading
  in 8 cities, each with its own number of infections seeded at the start of 2026 and its own share already immune
  from an earlier wave. A national task force must decide, city by city, whether to fund a transmission-reducing
  measure (masks, distancing and ventilation in schools and workplaces) from week 4 to week 16 of 2026, at about
  US$3 per resident. The measure''s effect on transmission is uncertain (15-45%). For each city, estimate the epidemic''s
  growth rate and peak week without the measure, the infections it averts over 2026, and which cities should get
  it under a US$15 million budget; say what decides it.'
decision_maker: national outbreak task force (synthetic trial question)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.6
    - 0.35
    - 0.05
    transmissibility: constant
    components:
      measure:
        start: 2026.0574948665299
        stop: 2026.3066392881587
horizon:
  start: 2026.0
  stop: 2027.0
decision_units:
  csv: cities.csv
  id: city
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
    seed:
      column: seed_share
options:
  populations:
    total: pop
  components:
    measure: {}
  packages:
    generate: true
  engine_map:
    measure:
      measure: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: measure
    component: measure
    value: 3.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - measure
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2027.0
  discounting: none
constraints:
  envelope_usd: 15000000
comparator:
  package: none
  text: no measure
outcomes_reported:
- infections
engine_parameters:
  effect:measure:
    value: 0.3
    range:
    - 0.15
    - 0.45
    dist: uniform
    basis: setting_data
    source: 'question text: the measure''s effect on transmission is uncertain (15-45%)'
    reason: the stated range
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.55
  - 1.0
  target_column: s0
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.2
  note: 'R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch): the swept susceptible share
    (immunity from the earlier wave is uncertain) spans R_eff = 2 s0 from 1.1 to 2.0'
analysis:
  evaluation: emulator
  emulator:
    points: 24
    holdout_share: 0.0
    seed: 5
    features:
    - seed_share
    - pop
  stability:
    holdout_group: city
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: city
    package: package
    value: infections_averted
  headline:
    name: infections_averted
    outcome: infections
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: assumed unit cost, not varied
  - kind: emulator
    reason: trial sweep only
