# World-model trial template (je_campaign_age, batch 4): synthetic units from generate_units.py; see the questions file
# for its inputs. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. Japanese encephalitis
  is endemic in 24 districts; transmission is from pigs and birds to people through mosquitoes, not between people,
  so vaccinating one age group does not protect another. A one-dose campaign in 2026 can target CHILD (ages 1-14,
  about 85% reached, US$1.00 per resident) or WIDE (ages 1-29, about 85% reached, US$1.90 per resident), or no campaign.
  Children are thought to carry 60-85% of cases in these districts, people aged 15-29 most of the rest. The budget
  is US$6 million. Input file: units.csv (population, Japanese encephalitis cases per person-year without vaccination,
  a pig-density index). Choose the option per district that maximises Japanese encephalitis cases averted in 2026-2028
  within the budget, report the total with a 95% uncertainty interval, and state the decision rule.'
decision_maker: programme manager (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.empirical.engine:PackageRateEngine
  config:
    components:
    - child
    - wide
    outcome: je_cases
    mode: trial_priors
    outcomes:
      je_cases:
        baseline_source: synthetic acute encephalitis syndrome surveillance with laboratory confirmation, 2021-2025
    baseline:
      measured_under: no_components
      source: no component delivered in the units before the decision window (synthetic)
    effects:
      child:
        je_cases:
          rr: 0.4
          range:
          - 0.3
          - 0.52
          dist: triangular
          measure: rate_ratio
          source: 'derived: 1 - reach 0.85 x efficacy 0.95-0.99 x the children''s share of cases 0.6-0.85; one dose
            of live attenuated SA 14-14-2 vaccine: efficacy 99.3% (95% CI 94.9-100) against Japanese encephalitis
            (Bista MB, Banerjee MK, Shin SH et al. Efficacy of single-dose SA 14-14-2 vaccine against Japanese encephalitis:
            a case control study. Lancet 2001;358:791-795)'
          verified: false
      wide:
        je_cases:
          rr: 0.24
          range:
          - 0.18
          - 0.33
          dist: triangular
          measure: rate_ratio
          source: 'derived: 1 - reach 0.85 x efficacy 0.95-0.99 x the 1-29 year olds'' share of cases 0.8-0.97;
            one dose of live attenuated SA 14-14-2 vaccine: efficacy 99.3% (95% CI 94.9-100) against Japanese encephalitis
            (Bista MB, Banerjee MK, Shin SH et al. Efficacy of single-dose SA 14-14-2 vaccine against Japanese encephalitis:
            a case control study. Lancet 2001;358:791-795)'
          verified: false
    combination:
      rule: multiplicative
      source: independent action of the components that can be combined (assumed; no factorial trial)
horizon:
  start: 2026.0
  stop: 2029.0
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    baseline_rate:
      columns:
        je_cases: inc
options:
  populations:
    total: pop
  components:
    child:
      group: campaign
    wide:
      group: campaign
  packages:
    none: []
    child:
    - child
    wide:
    - wide
  engine_map:
    child:
      child: 1
    wide:
      wide: 1
  prices:
    base_year: '2025'
    index:
      '2025': 1.0
  cost_items:
  - id: child_cost
    component: child
    value: 1.0
    price_year: '2025'
    price_rule: as_published
    basis: per_person
    includes:
    - child
  - id: wide_cost
    component: wide
    value: 1.9
    price_year: '2025'
    price_rule: as_published
    basis: per_person
    includes:
    - wide
objective:
  outcome: je_cases
  sense: avert
  horizon:
  - 2026.0
  - 2029.0
  discounting: none
constraints:
  envelope_usd: 6000000
comparator:
  package: none
  text: no package in the decision window
outcomes_reported:
- je_cases
calibration:
  method: none
  attribute: inert_design_axis
  scale: linear
  range:
  - 0.0
  - 1.0
  window:
  - 0.0
  - 0.0
  note: trial_priors mode calibrates nothing; batch.design needs a calibrated attribute, so the design's first axis
    is an attribute the engine does not read (inert by construction)
uncertainty:
  draws: 16
  seed: 3
  sources:
  - kind: priors
  excluded:
  - kind: calibration
    reason: 'no calibration: external baselines'
  - kind: engine_parameters
    reason: no fitted engine parameters
  - kind: costs
    reason: unit costs taken as given in this trial
  - kind: emulator
    reason: 'world-model trial: the sweep is read directly'
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 7
    features: &id001
    - inc
    - pig_density
    - pop
    independent_features:
      features: *id001
      generator: generate_units.py
      basis: 'generate_units.py draws each of these columns from its own seeded random stream, independently of
        every other column, and searches seeds until the realized table''s maximum pairwise |Spearman| among them
        is at most 0.2 (seed 4114 (searched from 4110): max |Spearman| among [''pop'', ''inc'', ''pig_density'']
        = 0.187) (synthetic units table)'
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
  decision_tests: []
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: je_cases_averted
  headline:
    name: total_je_cases_averted
    outcome: je_cases
