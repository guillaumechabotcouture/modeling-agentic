# World-model trial template (dengue_serotype_replacement_estimation, batch 4): synthetic units from generate_units.py. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. A dengue serotype that
  has not circulated for many years (DENV-3) has been introduced into 24 cities at the start of 2026. The share
  of residents still susceptible to it is uncertain (40-100%, depending on how long ago it last circulated); with
  the same transmissibility as recent seasons its basic reproduction number is about 2. Estimate, for each city
  and in total, (1) the attack rate of DENV-3 in 2026 with and without a routine vector-control intensification
  from week 8 to week 30, and (2) the threshold susceptible share below which no large epidemic occurs; report each
  with a 95% uncertainty interval and state what the data do and do not determine. Input file: units.csv (population,
  share infected at introduction).'
decision_maker: national arbovirus programme (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.1
    - 0.3
    - 0.35
    - 0.2
    - 0.05
    transmissibility: constant
    components:
      control:
        start: 2026.15332
        stop: 2026.574949
horizon:
  start: 2026.0
  stop: 2027.0
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
    seed:
      column: seed_share
options:
  populations:
    total: pop
  components:
    control: {}
  packages:
    none: []
    control:
    - control
  engine_map:
    control:
      control: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: control_cost
    component: control
    value: 1.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - control
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2027.0
  discounting: none
constraints:
  envelope_usd: 50000000
comparator:
  package: none
  text: no added measure
outcomes_reported:
- infections
engine_parameters:
  effect:control:
    value: 0.2
    range:
    - 0.1
    - 0.3
    dist: uniform
    basis: literature
    source: Esu E, Lenhart A, Smith L, Horstick O. Effectiveness of peridomestic space spraying with insecticide
      on dengue transmission; systematic review. Trop Med Int Health 2010;15:619-31 (evidence on transmission effects
      weak; reductions of transmission assumed 0.1-0.3 while control lasts)
    reason: share of transmission prevented
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.4
  - 1.0
  target_column: s0_survey
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.2
  note: 'R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch): the swept susceptible share
    spans R_eff = 2 s0 from 0.8 to 2.0'
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features: &id001
    - seed_share
    - pop
    independent_features:
      features: *id001
      generator: generate_units.py
      basis: generate_units.py draws each of these columns from its own seeded random stream, independently of every
        other column, and keeps the first seed (here 4207) whose realized table has pairwise |Spearman| <= 0.2 among
        them (realized maximum 0.145)
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: id
    package: package
    value: infections_averted
  headline:
    name: infections_averted
    outcome: infections
