# World-model trial template (typhoid_reactive_wash_timing, batch 4): synthetic units from generate_units.py; see the questions file
# for its inputs. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. Typhoid outbreaks linked
  to contaminated piped water have been detected in 24 towns in early 2026. Each town can start emergency water
  chlorination and household water treatment in week 2 (FAST, with emergency supplies, US$2.50 per resident) or
  in week 7 (STANDARD, US$1.20 per resident), or not at all. The share of residents still susceptible is uncertain.
  The budget is US$6 million. Input file: units.csv (population, typhoid cases at detection as a share of the population).
  Choose the option per town that maximises typhoid cases averted in 2026 within the budget, report the total with
  a 95% uncertainty interval, and say what the five weeks of delay cost and where.'
decision_maker: programme manager (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.1
    - 0.3
    - 0.3
    - 0.2
    - 0.1
    transmissibility: constant
    components:
      fast:
        start: 2026.03833
        stop: 2027.0
      standard:
        start: 2026.134155
        stop: 2027.0
horizon:
  start: 2026.0
  stop: 2027.0
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
    seed:
      column: seed_share
options:
  populations:
    total: pop
  components:
    fast:
      group: response
    standard:
      group: response
  packages:
    none: []
    fast:
    - fast
    standard:
    - standard
  engine_map:
    fast:
      fast: 1
    standard:
      standard: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: fast_cost
    component: fast
    value: 2.5
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - fast
  - id: standard_cost
    component: standard
    value: 1.2
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - standard
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2027.0
  discounting: none
constraints:
  envelope_usd: 6000000
comparator:
  package: none
  text: no measure
outcomes_reported:
- infections
engine_parameters:
  effect:fast:
    value: 0.4
    range:
    - 0.25
    - 0.55
    dist: uniform
    basis: literature
    source: household water treatment and safe storage reduced diarrhoea (risk ratios below one for point-of-use
      chlorination; Clasen TF, Alexander KT, Sinclair D et al. Interventions to improve water quality for preventing
      diarrhoea. Cochrane Database Syst Rev 2015;(10):CD004794); for typhoid transmitted through drinking water
      the reduction in transmission is assumed 0.25-0.55
    reason: the assumed range
  effect:standard:
    value: 0.4
    range:
    - 0.25
    - 0.55
    dist: uniform
    basis: literature
    source: household water treatment and safe storage reduced diarrhoea (risk ratios below one for point-of-use
      chlorination; Clasen TF, Alexander KT, Sinclair D et al. Interventions to improve water quality for preventing
      diarrhoea. Cochrane Database Syst Rev 2015;(10):CD004794); for typhoid transmitted through drinking water
      the reduction in transmission is assumed 0.25-0.55
    reason: the assumed range
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.45
  - 1.0
  target_column: s0
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.2
  note: 'R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch): the swept susceptible share
    spans R_eff = 2 s0 from 0.9 to 2, across the epidemic threshold. Weekly generation interval of a water-borne
    typhoid outbreak, mean about 3 weeks (incubation 1-3 weeks, assumed); the model''s infections are clinical cases
    (mild infections not modelled).'
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features: &id001
    - seed_share
    - pop
    independent_features:
      features: *id001
      generator: generate_units.py
      basis: 'generate_units.py draws each of these columns from its own seeded random stream, independently of
        every other column, and searches seeds until the realized table''s maximum pairwise |Spearman| among them
        is at most 0.2 (seed 4770 (searched from 4770): max |Spearman| among [''pop'', ''seed_share''] = 0.101)
        (synthetic units table)'
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: infections_averted
  headline:
    name: total_infections_averted
    outcome: infections
