schema_version: 1
question: 'SYNTHETIC TEST QUESTION (evaluation suite): the city, numbers and files below are synthetic, generated
  for this test; they do not describe a real place. In 2025 Synthetic City (population 1.5 million) had its first
  DENV-2 outbreak in many years. Input files: data/evals/dengue_outbreak/city.csv, data/evals/dengue_outbreak/weekly_reported_cases_2025.csv,
  data/evals/dengue_outbreak/generation_interval.csv (the distribution of the time between successive human infections,
  in weeks). No serosurvey is available, and the fraction of infections that are reported is not known (published
  ratios of reported cases to infections for dengue vary widely, roughly 1 in 3 to 1 in 30). The city must decide
  whether to fund a pre-season DENV-2 control campaign for 2026. Using a simple SIR-type model of human infection
  (vector dynamics absorbed into the transmission rate), estimate (1) the effective reproduction number of DENV-2
  at the start of the 2026 season, assuming the same transmissibility as in 2025 and no births, deaths, waning immunity
  or migration, and (2) the proportion of the city''s population infected with DENV-2 in 2025. Report each with
  a 95% uncertainty interval, say whether a large DENV-2 outbreak is expected in 2026, and state what the data do
  and do not determine. Deliverables: the uncertainty analysis must report outputs named reff_2026 and attack_rate_2025
  (attack_rate_2025 as a proportion of the whole population).'
decision_maker: city health department (synthetic evaluation question)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.2
    - 0.4
    - 0.25
    - 0.15
    transmissibility: constant
    components:
      control:
        start: 2026.0
        stop: 2026.5
horizon:
  start: 2026.0
  stop: 2027.0
decision_units:
  csv: city.csv
  id: city
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
  defaults_accepted:
    seed: the engine's 1e-6 introduction share (no information on importations)
options:
  populations:
    total: pop
  components:
    control: {}
  packages:
    generate: true
  engine_map:
    control:
      control: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: control
    component: control
    value: 1.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - vector_control
    note: assumed US$1 per resident for a pre-season campaign (not in the question)
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2027.0
  discounting: none
constraints:
  envelope_usd: 2000000
comparator:
  package: none
  text: no pre-season campaign
outcomes_reported:
- infections
engine_parameters:
  effect:control:
    value: 0.25
    range:
    - 0.05
    - 0.5
    dist: uniform
    basis: owner_judgement
    source: 'assumed: a pre-season campaign reduces R_t by 5-50% over the first half of 2026'
    reason: the question names a campaign but gives no effect; the sweep spans a wide band
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.3
  - 1.0
  target_column: s0_mid
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.3
  note: R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch), so the swept susceptible
    share at the start of 2026 spans R_eff(2026) = 2 s0 from 0.6 to 2.0; s0_mid is a placeholder target, not an
    estimate from the 2025 series
analysis:
  evaluation: emulator
  emulator:
    points: 24
    holdout_share: 0.0
    seed: 5
    features: []
  stability:
    holdout_group: city
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: city
    package: package
    value: infections_averted
  headline:
    name: infections_averted
    outcome: infections
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: assumed unit cost, not varied
  - kind: emulator
    reason: trial sweep only
