# World-model trial template (cervical_hpv_vs_via, batch 2): synthetic units from generate_units.py. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every district and number is synthetic. A national cancer
  control programme has US$4 million for one screening round in 2026 for women aged 30-49 in 20 districts. For each
  district choose one approach: none; VIA (visual inspection with acetic acid, screen and treat); HPV (HPV-DNA testing,
  screen and treat). Costs per woman in the target group: VIA US$4, HPV US$9. Input file: units.csv (women aged
  30-49, incidence of advanced cervical cancer per woman-year without screening, HIV prevalence among women). Choose
  the approaches that maximise advanced cervical cancers averted over 2026-2033 within the budget, report the total
  with a 95% uncertainty interval, and state the decision rule.'
decision_maker: national cancer control programme manager (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.empirical.engine:PackageRateEngine
  config:
    components:
    - via
    - hpv
    outcome: advanced
    mode: trial_priors
    outcomes:
      advanced:
        baseline_source: synthetic cancer registry (advanced cervical cancer incidence)
    baseline:
      measured_under: no_components
      source: no organised screening before 2026 (synthetic)
    effects:
      via:
        advanced:
          rr: 0.86
          range:
          - 0.6
          - 1.25
          dist: triangular
          measure: hazard_ratio
          source: 'Sankaranarayanan R et al. HPV screening for cervical cancer in rural India. N Engl J Med 2009;360:1385-94
            (single-round VIA: cervical cancer deaths HR 0.86, 0.60-1.25)'
          verified: false
      hpv:
        relative_to: via
        advanced:
          rr: 0.6
          range:
          - 0.4
          - 0.9
          dist: triangular
          measure: hazard_ratio
          source: 'Sankaranarayanan R et al. HPV screening for cervical cancer in rural India. N Engl J Med 2009;360:1385-94
            (single-round HPV testing: deaths HR 0.52, 0.33-0.83, and advanced cancers HR 0.47, 0.32-0.69, against
            control; the ratio to VIA is derived)'
          verified: false
    combination:
      rule: multiplicative
      source: 'alternatives: HPV''s effect is relative to VIA; one approach per district'
horizon:
  start: 2026.0
  stop: 2034.0
decision_units:
  csv: units.csv
  id: id
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    baseline_rate:
      columns:
        advanced: adv_rate
  region: region
options:
  populations:
    total: pop
  components:
    via:
      group: approach
    hpv:
      group: approach
  packages:
    none: []
    via:
    - via
    hpv:
    - hpv
  engine_map:
    via:
      via: 1
    hpv:
      hpv: 1
  prices:
    base_year: '2025'
    index:
      '2025': 1.0
  cost_items:
  - id: via_cost
    component: via
    value: 4.0
    price_year: '2025'
    price_rule: as_published
    basis: per_person
    includes:
    - via_delivery
  - id: hpv_cost
    component: hpv
    value: 9.0
    price_year: '2025'
    price_rule: as_published
    basis: per_person
    includes:
    - hpv_delivery
objective:
  outcome: advanced
  sense: avert
  horizon:
  - 2026.0
  - 2034.0
  discounting: none
constraints:
  envelope_usd: 4000000
comparator:
  package: none
  text: no package in the decision window
outcomes_reported:
- advanced
calibration:
  method: none
  attribute: inert_design_axis
  scale: linear
  range:
  - 0.0
  - 1.0
  window:
  - 0.0
  - 0.0
  note: trial_priors mode calibrates nothing; batch.design needs a calibrated attribute, so the design's first axis
    is an attribute the engine does not read (inert by construction)
uncertainty:
  draws: 16
  seed: 3
  sources:
  - kind: priors
  excluded:
  - kind: calibration
    reason: 'no calibration: external baselines'
  - kind: engine_parameters
    reason: no fitted engine parameters
  - kind: costs
    reason: unit costs taken as given in this trial
  - kind: emulator
    reason: 'world-model trial: the sweep is read directly'
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 7
    features:
    - adv_rate
    - hiv
    - pop
    independent_features:
      features:
      - adv_rate
      - hiv
      - pop
      generator: generate_units.py
      basis: 'synthetic units table: generate_units.py draws each of these columns independently of every other
        column (seeded)'
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
  decision_tests: []
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: advanced_averted
  headline:
    name: total_advanced_averted
    outcome: advanced
