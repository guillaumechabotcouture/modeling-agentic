# World-model trial template (ebola_ring_vaccination, batch 2): synthetic units from generate_units.py. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every district and number is synthetic. An Ebola virus disease
  outbreak is reported in 20 districts, each with its own number of infections when the response starts in early
  2026. Contact tracing and isolation are in place everywhere (the comparator). Ring vaccination of contacts and
  contacts of contacts can be added from week 20 of 2026 (when vaccine supply arrives) at about US$2 per resident.
  Input file: units.csv (population, infections at the start of the response as a share of the population, uncertain).
  For each district estimate the final size of the 2026 outbreak with contact tracing only and the share of it that
  ring vaccination averts, each with a 95% uncertainty interval, and say where ring vaccination should go first
  under a US$10 million budget.'
decision_maker: national Ebola response coordinator (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.1
    - 0.3
    - 0.3
    - 0.2
    - 0.1
    transmissibility: constant
    components:
      ring:
        start: 2026.383299
        stop: 2027.0
horizon:
  start: 2026.0
  stop: 2027.0
decision_units:
  csv: units.csv
  id: id
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
options:
  populations:
    total: pop
  components:
    ring: {}
  packages:
    none: []
    ring:
    - ring
  engine_map:
    ring:
      ring: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: ring_cost
    component: ring
    value: 2.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - ring
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2027.0
  discounting: none
constraints:
  envelope_usd: 10000000
comparator:
  package: none
  text: no measure
outcomes_reported:
- infections
engine_parameters:
  effect:ring:
    value: 0.4
    range:
    - 0.2
    - 0.6
    dist: uniform
    basis: literature
    source: 'Henao-Restrepo AM et al. Efficacy and effectiveness of an rVSV-vectored vaccine in preventing Ebola
      virus disease: final results from the Guinea ring vaccination, open-label, cluster-randomised trial (Ebola
      Ca Suffit!). Lancet 2017;389:505-18 (vaccine efficacy 100% in immediately vaccinated rings; the reduction
      in population transmission depends on ring coverage and is an assumption, wide)'
    reason: the cited range
calibration:
  method: emulator_inversion
  attribute: seed
  scale: log
  range:
  - -13.8
  - -9.2
  target_column: seed_share
  window:
  - 2026.0
  - 2026.1
  metric: attack_rate
  target_uncertainty:
    region_sd_logit: 0.3
  note: 'the initial infections are uncertain (under-ascertainment): the swept seed share spans 1e-6 to 1e-4; R0
    stays at the engine default 2.0 with contact tracing in place (kind calibrated, not varied)'
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features:
    - pop
    - contact_coverage
    independent_features:
      features:
      - pop
      - contact_coverage
      generator: generate_units.py
      basis: 'synthetic units table: generate_units.py draws each of these columns independently of every other
        column (seeded)'
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: id
    package: package
    value: infections_averted
  headline:
    name: infections_averted
    outcome: infections
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: assumed unit cost, not varied
  - kind: emulator
    reason: trial sweep only
