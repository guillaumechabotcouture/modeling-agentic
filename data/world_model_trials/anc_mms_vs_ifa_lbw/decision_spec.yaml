# World-model trial template (anc_mms_vs_ifa_lbw, batch 3): synthetic units from generate_units.py. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. An antenatal programme
  has US$1.2 million for supplements for pregnant women in 24 districts in 2026. For each district choose one product:
  none; IFA (iron-folic acid, US$2 per pregnancy); MMS (multiple micronutrient supplements, US$3.50 per pregnancy).
  Input file: units.csv (pregnancies expected in 2026, low birthweight share of births without supplementation,
  anaemia prevalence in pregnancy). Choose the products that maximise low birthweight births averted within the
  budget, report the total with a 95% uncertainty interval, and state the decision rule.'
decision_maker: maternal and child nutrition programme (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.empirical.engine:PackageRateEngine
  config:
    components:
    - ifa
    - mms
    outcome: lbw
    mode: trial_priors
    outcomes:
      lbw:
        baseline_source: 'synthetic facility birth records: low birthweight share of births'
    baseline:
      measured_under: no_components
      source: no antenatal supplementation programme before 2026 (synthetic)
    effects:
      ifa:
        lbw:
          rr: 0.84
          range:
          - 0.69
          - 1.03
          dist: triangular
          measure: rate_ratio
          source: Peña-Rosas JP et al. Daily oral iron supplementation during pregnancy. Cochrane Database Syst
            Rev 2015;(7):CD004736 (low birthweight RR about 0.84, 95% CI 0.69-1.03)
          verified: false
      mms:
        relative_to: ifa
        lbw:
          rr: 0.88
          range:
          - 0.85
          - 0.91
          dist: triangular
          measure: rate_ratio
          source: Keats EC, Haider BA, Tam E, Bhutta ZA. Multiple-micronutrient supplementation for women during
            pregnancy. Cochrane Database Syst Rev 2019;3:CD004905 (low birthweight RR about 0.88, 95% CI 0.85-0.91,
            against iron with or without folic acid)
          verified: false
    combination:
      rule: multiplicative
      source: 'alternatives: MMS''s effect is relative to IFA; one product per district'
horizon:
  start: 2026.0
  stop: 2027.0
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    baseline_rate:
      columns:
        lbw: lbw
options:
  populations:
    total: pop
  components:
    ifa:
      group: product
    mms:
      group: product
  packages:
    none: []
    ifa:
    - ifa
    mms:
    - mms
  engine_map:
    ifa:
      ifa: 1
    mms:
      mms: 1
  prices:
    base_year: '2025'
    index:
      '2025': 1.0
  cost_items:
  - id: ifa_cost
    component: ifa
    value: 2.0
    price_year: '2025'
    price_rule: as_published
    basis: per_person
    includes:
    - ifa_delivery
  - id: mms_cost
    component: mms
    value: 3.5
    price_year: '2025'
    price_rule: as_published
    basis: per_person
    includes:
    - mms_delivery
objective:
  outcome: lbw
  sense: avert
  horizon:
  - 2026.0
  - 2027.0
  discounting: none
constraints:
  envelope_usd: 1200000
comparator:
  package: none
  text: no supplementation programme
outcomes_reported:
- lbw
calibration:
  method: none
  attribute: inert_design_axis
  scale: linear
  range:
  - 0.0
  - 1.0
  window:
  - 0.0
  - 0.0
  note: trial_priors mode calibrates nothing; batch.design needs a calibrated attribute, so the design's first axis
    is an attribute the engine does not read (inert by construction)
uncertainty:
  draws: 16
  seed: 3
  sources:
  - kind: priors
  excluded:
  - kind: calibration
    reason: 'no calibration: external baselines'
  - kind: engine_parameters
    reason: no fitted engine parameters
  - kind: costs
    reason: unit costs taken as given in this trial
  - kind: emulator
    reason: 'world-model trial: the sweep is read directly'
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 7
    features:
    - lbw
    - anaemia
    - pop
    independent_features:
      features:
      - lbw
      - anaemia
      - pop
      generator: generate_units.py
      basis: generate_units.py draws each of these columns from its own seeded random stream, independently of every
        other column (synthetic units table)
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
  decision_tests: []
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: lbw_averted
  headline:
    name: total_lbw_averted
    outcome: lbw
