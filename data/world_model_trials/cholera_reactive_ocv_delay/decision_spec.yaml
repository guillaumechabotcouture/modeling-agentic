# World-model trial template (cholera_reactive_ocv_delay, batch 4): synthetic units from generate_units.py. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. Cholera outbreaks have
  just been detected in 24 districts at the start of 2026 (basic reproduction number about 2; the share of residents
  susceptible is uncertain, 50-100%). Each district can run a reactive oral cholera vaccine campaign that starts
  protecting FAST (week 3, from a pre-positioned stockpile, US$3.00 per resident) or STANDARD (week 8, through the
  usual request and shipment, US$2.20 per resident), or none. The budget is US$12 million. Input file: units.csv
  (population, share infected at detection). Choose the option per district that maximises infections averted in
  2026 within the budget, report the total with a 95% uncertainty interval, and state the rule (how much does each
  week of delay cost, and where is the stockpile worth it?).'
decision_maker: national cholera task force (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.5
    - 0.35
    - 0.15
    transmissibility: constant
    components:
      fast:
        start: 2026.057495
        stop: 2027.0
      standard:
        start: 2026.15332
        stop: 2027.0
horizon:
  start: 2026.0
  stop: 2027.0
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
    seed:
      column: seed_share
options:
  populations:
    total: pop
  components:
    fast:
      group: delay
    standard:
      group: delay
  packages:
    none: []
    fast:
    - fast
    standard:
    - standard
  engine_map:
    fast:
      fast: 1
    standard:
      standard: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: fast_cost
    component: fast
    value: 3.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - fast
  - id: standard_cost
    component: standard
    value: 2.2
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - standard
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2027.0
  discounting: none
constraints:
  envelope_usd: 12000000
comparator:
  package: none
  text: no added measure
outcomes_reported:
- infections
engine_parameters:
  effect:fast:
    value: 0.45
    range:
    - 0.3
    - 0.6
    dist: uniform
    basis: literature
    source: 'Azman AS, Luquero FJ, Ciglenecki I, Grais RF, Sack DA, Lessler J. The impact of a one-dose versus two-dose
      oral cholera vaccine regimen in outbreak settings: a modeling study. PLoS Med 2015;12:e1001867 (reactive campaigns
      avert most when delivered early; a campaign''s reduction of transmission assumed 0.3-0.6)'
    reason: share of transmission prevented
  effect:standard:
    value: 0.45
    range:
    - 0.3
    - 0.6
    dist: uniform
    basis: literature
    source: 'Azman AS, Luquero FJ, Ciglenecki I, Grais RF, Sack DA, Lessler J. The impact of a one-dose versus two-dose
      oral cholera vaccine regimen in outbreak settings: a modeling study. PLoS Med 2015;12:e1001867 (reactive campaigns
      avert most when delivered early; a campaign''s reduction of transmission assumed 0.3-0.6)'
    reason: share of transmission prevented
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.5
  - 1.0
  target_column: s0_survey
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.2
  note: 'R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch): the swept susceptible share
    spans R_eff = 2 s0 from 1.0 to 2.0'
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features: &id001
    - seed_share
    - pop
    independent_features:
      features: *id001
      generator: generate_units.py
      basis: generate_units.py draws each of these columns from its own seeded random stream, independently of every
        other column, and keeps the first seed (here 4203) whose realized table has pairwise |Spearman| <= 0.2 among
        them (realized maximum 0.115)
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: id
    package: package
    value: infections_averted
  headline:
    name: infections_averted
    outcome: infections
