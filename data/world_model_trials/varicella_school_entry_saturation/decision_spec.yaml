# World-model trial template (varicella_school_entry_saturation, batch 4): synthetic units from generate_units.py; see the questions file
# for its inputs. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. Varicella vaccination
  is being introduced in 24 districts, where a varicella season will begin in each in 2026. Each district can choose:
  none; ENTRY (one dose for children starting school, aged 5-9, about 90% reached, US$0.90 per resident); SCHOOL
  (one dose for all school children aged 5-14, about 90% reached, US$1.70 per resident). R0 is between 8 and 12
  with homogeneous mixing; adults are almost all immune (5% susceptible). The budget is US$4 million. Input file:
  units.csv (population; susceptible shares of children under 5, 5-9 and 10-14; the expected seed as a share of
  the population). Choose the option per district that maximises varicella infections averted in the season, report
  the total with a 95% uncertainty interval, and say where vaccinating the older school children adds little (saturation)
  and where it is needed to stop transmission.'
decision_maker: programme manager (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.compartmental.engine:CompartmentalEngine
  config:
    groups: &id001
    - u5
    - a5_9
    - a10_14
    - a15p
    structure: birth_cohorts
    mode: to_extinction
    final_size: true
    initialiser: given
    dt: week
    time_unit: day
    transmission: q
    components:
      entry:
        kind: campaign
        targets:
        - a5_9
        reach: 0.9
        day: 0
      school:
        kind: campaign
        targets:
        - a5_9
        - a10_14
        reach: 0.9
        day: 0
    tol: 1.0e-09
    generation_interval:
      seir:
        latent_days: 14.0
        infectious_days: 7.0
horizon:
  start: 0
  stop: 730
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups: *id001
  engine_attributes:
    N:
      column: n_groups
      split: ' '
    s0:
      column: s0_groups
      split: ' '
    seed:
      column: seed_share
    intro:
      value: u5
      source: importation into the susceptible-rich band (assumption)
  defaults_accepted:
    reach:entry: the configured reach (question text)
    reach:school: the configured reach (question text)
    always_immune: 'none declared: immunity is in s0'
    always_susceptible: none declared
options:
  populations:
    total: pop
  components:
    entry:
      group: option
    school:
      group: option
  packages:
    none: []
    entry:
    - entry
    school:
    - school
  engine_map:
    entry:
      entry: 1
    school:
      school: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: entry_cost
    component: entry
    value: 0.9
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - entry
  - id: school_cost
    component: school
    value: 1.7
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - school
objective:
  outcome: infections
  sense: avert
  horizon:
  - 0
  - 730
  discounting: none
constraints:
  envelope_usd: 4000000
comparator:
  package: none
  text: no added measure
outcomes_reported:
- infections
engine_parameters:
  efficacy:entry:
    value: 0.81
    range:
    - 0.7
    - 0.9
    dist: triangular
    basis: literature
    source: 'one dose of varicella vaccine: pooled effectiveness 81% against all varicella (Marin M, Marti M, Kambhampati
      A, Jeram SM, Seward JF. Global varicella vaccine effectiveness: a meta-analysis. Pediatrics 2016;137:e20153741)'
    reason: protection of the susceptibles reached
  efficacy:school:
    value: 0.81
    range:
    - 0.7
    - 0.9
    dist: triangular
    basis: literature
    source: 'one dose of varicella vaccine: pooled effectiveness 81% against all varicella (Marin M, Marti M, Kambhampati
      A, Jeram SM, Seward JF. Global varicella vaccine effectiveness: a meta-analysis. Pediatrics 2016;137:e20153741)'
    reason: protection of the susceptibles reached
calibration:
  method: emulator_inversion
  attribute: contact_rate
  scale: linear
  range:
  - 40.0
  - 60.0
  target_column: r0_target
  window:
  - 0
  - 730
  metric: r0
  target_uncertainty:
    region_sd_logit: 0.05
  note: 'birth cohorts with homogeneous mixing: R0 = q x contact_rate with q at the engine default 0.2, so contact_rate
    over [40.0, 60.0] spans R0 8-12'
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 64
    holdout_share: 0.0
    seed: 5
    features: &id002
    - s_u5
    - s_5_9
    - s_10_14
    - seed_share
    - pop
    independent_features:
      features: *id002
      generator: generate_units.py
      basis: 'generate_units.py draws each of these columns from its own seeded random stream, independently of
        every other column, and searches seeds until the realized table''s maximum pairwise |Spearman| among them
        is at most 0.2 (seed 4588 (searched from 4550): max |Spearman| among [''pop'', ''s_u5'', ''s_5_9'', ''s_10_14'',
        ''seed_share''] = 0.191) (synthetic units table)'
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: infections_averted
  headline:
    name: total_infections_averted
    outcome: infections
