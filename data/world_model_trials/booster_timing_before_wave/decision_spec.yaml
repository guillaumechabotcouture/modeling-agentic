# World-model trial template (booster_timing_before_wave, batch 3): synthetic units from generate_units.py. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every unit and number is synthetic. A respiratory virus
  wave (COVID-like: latent about 3 days, infectious about 5; R0 uncertain 1.4-2.2) is starting in 24 cities at the
  start of 2026, each with its own number of infections and its own share still susceptible after the previous season.
  A booster can be offered once: EARLY (a campaign on day 0 that reaches 50% of residents because demand is low
  before cases are visible) or LATE (a campaign on day 42 that reaches 80% once the wave is visible), or not at
  all; either costs about US$3 per resident. The budget is US$30 million. Seasonal forcing is not modelled: the
  wave''s timing comes from its own growth. Input file: units.csv (population, share susceptible, share infected
  at the start). Choose the timing per city that maximises infections averted in the wave within the budget, report
  the total with a 95% uncertainty interval, and state the rule (when does waiting for higher uptake miss the peak?).'
decision_maker: national immunisation programme (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.compartmental.engine:CompartmentalEngine
  config:
    groups: &id001
    - all
    structure: single_group
    mode: to_extinction
    final_size: true
    initialiser: given
    dt: week
    time_unit: day
    transmission: q
    components:
      early:
        kind: campaign
        targets:
        - all
        reach: 0.5
        day: 0
      late:
        kind: campaign
        targets:
        - all
        reach: 0.8
        day: 42
    tol: 1.0e-09
    generation_interval:
      seir:
        latent_days: 3.0
        infectious_days: 5.0
horizon:
  start: 0
  stop: 300
decision_units:
  csv: units.csv
  id: id
  region: region
  populations:
    all:
      column: pop
      age_groups: *id001
  engine_attributes:
    N:
      column: pop
      split: ' '
    s0:
      column: s0
      split: ' '
    seed:
      column: seed_share
  defaults_accepted:
    reach:early: the configured reach (question text)
    reach:late: the configured reach (question text)
    always_immune: 'none declared: immunity is in s0'
    always_susceptible: none declared
    intro: 'single group: the infection enters the only group'
options:
  populations:
    total: pop
  components:
    early:
      group: timing
    late:
      group: timing
  packages:
    none: []
    early:
    - early
    late:
    - late
  engine_map:
    early:
      early: 1
    late:
      late: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: early_cost
    component: early
    value: 3.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - early
  - id: late_cost
    component: late
    value: 3.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - late
objective:
  outcome: infections
  sense: avert
  horizon:
  - 0
  - 300
  discounting: none
constraints:
  envelope_usd: 30000000
comparator:
  package: none
  text: no added measure
outcomes_reported:
- infections
engine_parameters:
  efficacy:early:
    value: 0.59
    range:
    - 0.45
    - 0.7
    dist: triangular
    basis: literature
    source: 'Osterholm MT et al. Efficacy and effectiveness of influenza vaccines: a systematic review and meta-analysis.
      Lancet Infect Dis 2012;12:36-44 (pooled efficacy of inactivated vaccine 0.59, 95% CI 0.51-0.67)'
    reason: protection of the susceptibles reached
  efficacy:late:
    value: 0.59
    range:
    - 0.45
    - 0.7
    dist: triangular
    basis: literature
    source: 'Osterholm MT et al. Efficacy and effectiveness of influenza vaccines: a systematic review and meta-analysis.
      Lancet Infect Dis 2012;12:36-44 (pooled efficacy of inactivated vaccine 0.59, 95% CI 0.51-0.67)'
    reason: protection of the susceptibles reached
calibration:
  method: emulator_inversion
  attribute: contact_rate
  scale: linear
  range:
  - 7.0
  - 11.0
  target_column: r0_target
  window:
  - 0
  - 300
  metric: r0
  target_uncertainty:
    region_sd_logit: 0.05
  note: q stays at the engine default 0.2 (kind calibrated, not varied by the batch); with homogeneous mixing R0
    = q x contact_rate, so contact_rate over [7.0, 11.0] spans R0 1.4-2.2
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: costs stated by the question
  - kind: emulator
    reason: trial sweep only
analysis:
  evaluation: emulator
  emulator:
    points: 64
    holdout_share: 0.0
    seed: 5
    features: &id002
    - s0
    - seed_share
    - pop
    independent_features:
      features: *id002
      generator: generate_units.py
      basis: generate_units.py draws each of these columns from its own seeded random stream, independently of every
        other column (synthetic units table)
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: unit
    package: package
    value: infections_averted
  headline:
    name: total_infections_averted
    outcome: infections
