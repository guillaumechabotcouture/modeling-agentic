# World-model trial template (flu_school_closure_timing, batch 2): synthetic units from generate_units.py. Test input, not signed by the owner.
schema_version: 1
question: 'SYNTHETIC TEST QUESTION (world-model trial): every town and number is synthetic. An influenza epidemic
  is starting in 24 towns, each with its own number of infections at the start of 2026 and its own share still susceptible
  (uncertain, 60-100%). An education ministry can close schools for eight weeks, starting either in week 3 (EARLY)
  or in week 7 (LATE) of 2026, or not at all, town by town. Closure costs about US$4 per resident whatever its start.
  Input file: units.csv (population, infections seeded at the start of 2026 as a share of the population). Choose
  for each town whether and when to close, to maximise infections averted in 2026 under a US$40 million budget,
  report the total with a 95% uncertainty interval, and say what decides the timing.'
decision_maker: national education and health task force (world-model trial; template, not owner-signed)
decision_date: 2026
engine:
  ref: toolkit.engines.renewal.engine:RenewalEngine
  config:
    dt: week
    generation_interval:
    - 0.9
    - 0.1
    transmissibility: constant
    components:
      early:
        start: 2026.057495
        stop: 2026.210815
      late:
        start: 2026.134155
        stop: 2026.287474
horizon:
  start: 2026.0
  stop: 2027.0
decision_units:
  csv: units.csv
  id: id
  populations:
    all:
      column: pop
      age_groups:
      - all
  engine_attributes:
    N:
      column: pop
    seed:
      column: seed_share
options:
  populations:
    total: pop
  components:
    early:
      group: closure
    late:
      group: closure
  packages:
    none: []
    early:
    - early
    late:
    - late
  engine_map:
    early:
      early: 1
    late:
      late: 1
  prices:
    base_year: '2026'
    index:
      '2026': 1.0
  cost_items:
  - id: early_cost
    component: early
    value: 4.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - early
  - id: late_cost
    component: late
    value: 4.0
    price_year: '2026'
    price_rule: as_published
    basis: per_person
    includes:
    - late
objective:
  outcome: infections
  sense: avert
  horizon:
  - 2026.0
  - 2027.0
  discounting: none
constraints:
  envelope_usd: 40000000
comparator:
  package: none
  text: no measure
outcomes_reported:
- infections
engine_parameters:
  effect:early:
    value: 0.2
    range:
    - 0.1
    - 0.3
    dist: uniform
    basis: literature
    source: Cauchemez S et al. Closure of schools during an influenza pandemic. Lancet Infect Dis 2009;9:473-81
      (transmission reductions of roughly 15-25% across studies)
    reason: the cited range
  effect:late:
    value: 0.2
    range:
    - 0.1
    - 0.3
    dist: uniform
    basis: literature
    source: Cauchemez S et al. Closure of schools during an influenza pandemic. Lancet Infect Dis 2009;9:473-81
      (transmission reductions of roughly 15-25% across studies)
    reason: the cited range
calibration:
  method: emulator_inversion
  attribute: s0
  scale: linear
  range:
  - 0.6
  - 1.0
  target_column: s0
  window:
  - 2026.0
  - 2026.1
  metric: s_start
  target_uncertainty:
    region_sd_logit: 0.2
  note: 'R0 stays at the engine default 2.0 (kind calibrated, not varied by the batch): the swept susceptible share
    spans R_eff = 2 s0 from 1.2 to 2.0'
analysis:
  evaluation: emulator
  emulator:
    points: 100
    holdout_share: 0.0
    seed: 5
    features:
    - seed_share
    - pop
    independent_features:
      features:
      - seed_share
      - pop
      generator: generate_units.py
      basis: 'synthetic units table: generate_units.py draws each of these columns independently of every other
        column (seeded)'
  stability:
    holdout_group: region
  sensitivity:
    parameters: fitted
deliverable:
  kind: package_per_unit
  allocation_file: allocation_optimized.csv
  columns:
    unit: id
    package: package
    value: infections_averted
  headline:
    name: infections_averted
    outcome: infections
uncertainty:
  level: 0.95
  draws: 8
  seed: 3
  sources:
  - kind: calibration
  excluded:
  - kind: engine_parameters
    reason: the engine has no fitted parameters
  - kind: costs
    reason: assumed unit cost, not varied
  - kind: emulator
    reason: trial sweep only
