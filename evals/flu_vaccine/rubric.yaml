# Rubric for eval question flu_vaccine (Phase 50 α). Weights and tolerances are
# proposals for the owner's review.
question: flu_vaccine
title: Influenza vaccine doses by age group under a dose limit
disease_area: influenza
decision: whole dose blocks per age group (10 blocks)
tests: [age-structured transmission calibrated to serology, indirect protection, discrete optimisation, uncertainty]
config: cloud/configs/eval_flu_vaccine.py

allocation:
  kind: vector
  files: [allocation_optimized.csv, models/allocation_optimized.csv, "allocation_*.csv", "models/allocation_*.csv"]
  unit_column: [age_group, group, unit]
  quantity_column: [doses, n_doses, blocks]
  value_column: [hospitalisations_averted, hospitalizations_averted]
  aliases: {"0-4 years": "0-4", "5-17 years": "5-17", "18-49 years": "18-49", "50-64 years": "50-64",
            "65 and over": "65+", "65+ years": "65+", ">=65": "65+"}

text_files: [report.md, results.md, decision_rule.md, scope_declaration.yaml, models/mechanism_manifest.yaml]

subtasks:
  - {id: data, depends_on: []}
  - {id: effects, depends_on: [data]}
  - {id: optimize, depends_on: [effects]}
  - {id: uncertainty, depends_on: [effects]}

checks:
  - {id: inputs, type: inputs_referenced, subtask: data, weight: 0.05, pass: 0.99}
  - id: mechanism
    type: text_mentions
    subtask: effects
    weight: 0.20
    failure: mechanism_not_reported
    window: 400
    groups:
      - 'indirect (protection|effect|benefit)|herd (immunity|protection|effect)|transmission (reduction|effect|benefit)|reduc\w* transmission|interrupt\w* transmission|community protection'
      - 'child|5-17|school'
  - {id: concordance, type: allocation_concordance, subtask: optimize, weight: 0.25, pass: 0.9}
  - {id: plan_value, type: allocation_value, subtask: optimize, weight: 0.25, pass_ratio: 0.95, floor: 0.5}
  - {id: headline, type: headline_accuracy, subtask: uncertainty, weight: 0.10, headline: hospitalisations_averted,
     outputs: [hospitalisations_averted, hospitalizations_averted, '.*hospitali[sz]ations?_averted.*'], rel_tol: 0.15}
  - {id: interval, type: interval_coverage, subtask: uncertainty, weight: 0.15, headline: hospitalisations_averted,
     outputs: [hospitalisations_averted, hospitalizations_averted, '.*hospitali[sz]ations?_averted.*'],
     max_rel_width: 1.0}

penalties:
  false_confidence_accept: {below: 0.6, value: 0.3}
  confident_wrong_interval: {max_rel_width: 0.2, value: 0.1}

self_test:
  perfect_text: >-
    Inputs used: population.csv, contact_matrix.csv, serosurvey_last_season.csv, hospitalisations_last_season.csv
    and vaccine_effectiveness.csv. Vaccinating school-age children (5-17) gives indirect protection: it reduces
    transmission to older adults, which averts more hospitalisations than vaccinating the 65+ directly.
  wrong_text: >-
    Inputs used: population.csv, contact_matrix.csv, serosurvey_last_season.csv, hospitalisations_last_season.csv
    and vaccine_effectiveness.csv. Doses go to the groups with the highest hospitalisation risk per dose.
