    lookup_failed: 0
    confidence_claimed: medium
- id: B8
  mechanism: District susceptible share (serosurvey s0) is the main driver of baseline burden and therefore of the
    ranking of districts; population only scales totals, seed_share matters only in subcritical districts.
  about:
    feature: s0
  direction: increases
  source_type: data
  evidence:
  - dossier_entry: units.csv
    file: units.csv
    column: s0
  confidence: high
  decision_relevant: true
open_questions:
- id: Q1
  question: What is R0 in each district (contact_rate calibration vs the 5-8 stated range, and the r0_target column)?
    The routine-sufficient s0 threshold moves from ~0.17 to ~0.27 across it, which decides how many districts can
    take the cheaper option.
  beliefs:
  - B4
  - B7
  decision_relevant: true
- id: Q2
  question: Are the 30% and 75% reach figures of susceptibles independent of efficacy, and does the engine target
    susceptibles or waste doses on immune people? Wasted doses would lower effective reach and could push catch-up
    Reff above one in the highest-s0, highest-R0 districts.
  beliefs:
  - B1
  - B2
  decision_relevant: true
- id: Q3
  question: Toxoid protects against disease more than against carriage; if infection (not disease) protection is
    lower than the all-or-nothing engine assumes, both options are overstated and the catch-up threshold could fall
    inside the s0 range.
  beliefs:
  - B1
  decision_relevant: true
- id: Q4
  question: Is the serosurvey s0 representative (sampling frame, assay cut-off 0.1 IU/mL vs protection), and is
    there age structure that concentrates susceptibles in school-age children reached by routine boosters?
  beliefs:
  - B8
  - B2
  decision_relevant: true
- id: Q5
  question: Where does the shadow price sit? A low lambda moves the catchup/routine flip toward lower s0 and lets
    some subcritical districts take routine.
  beliefs:
  - B3
  - B4
  - B5
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: In districts with s0 >= 0.25, catchup's relative reduction in infections is between 0.9 and 1.0 at >= 80%
    of usable points; refuted if <= 20% are.
  test:
    kind: effect_band
    package: catchup
    band:
    - 0.9
    - 1.0
    min_share: 0.8
    where:
      s0:
      - 0.25
      - 0.3482
- id: H2
  belief: B2
  claim: In districts with s0 >= 0.30, routine's relative reduction is between 0.25 and 0.85 at >= 75% of usable
    points; refuted if <= 25% are.
  test:
    kind: effect_band
    package: routine
    band:
    - 0.25
    - 0.85
    min_share: 0.75
    where:
      s0:
      - 0.3
      - 0.3482
- id: H3
  belief: B3
  claim: For s0 in [0.28, 0.3482], catchup beats routine on net benefit at the shadow price at >= 80% of usable
    points; refuted if routine wins that often.
  test:
    kind: paired_sign
    a: catchup
    b: routine
    feature: s0
    range:
    - 0.28
    - 0.3482
    sign: positive
    min_share: 0.8
- id: H4
  belief: B4
  claim: The routine-to-catchup transition along s0 lies within s0 in [0.18, 0.32]; refuted if located entirely
    outside.
  test:
    kind: flip_in
    a: catchup
    b: routine
    feature: s0
    range:
    - 0.18
    - 0.32
- id: H5
  belief: B5
  claim: For s0 in [0.1145, 0.14], none beats routine on net benefit at the shadow price at >= 80% of usable points;
    refuted if routine wins that often.
  test:
    kind: paired_sign
    a: none
    b: routine
    feature: s0
    range:
    - 0.1145
    - 0.14
    sign: positive
    min_share: 0.8
- id: H6
  belief: B6
  claim: Catchup's relative reduction increases with s0 (Spearman rho interval above 0); refuted if it excludes
    0 on the negative side.
  test:
    kind: effect_direction
    package: catchup
    feature: s0
    direction: increases
- id: H7
  belief: B7
  claim: Among districts with s0 >= 0.22, routine's relative reduction decreases with contact_rate (rho interval
    below 0); refuted if it excludes 0 on the positive side.
  test:
    kind: effect_direction
    package: routine
    feature: contact_rate (calibration scale)
    direction: decreases
    where:
      s0:
      - 0.22
      - 0.3482
