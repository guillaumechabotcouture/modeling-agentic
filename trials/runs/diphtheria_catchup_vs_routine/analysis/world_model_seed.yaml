beliefs:
- id: B1
  mechanism: Catch-up reaching ~75% of susceptibles pushes Reff below one across the whole s0 range, so where the
    unvaccinated district would have a major outbreak it averts nearly all infections (only seeded chains remain).
  about:
    package: catchup
    feature: s0
  direction: reduces
  magnitude:
    band:
    - 0.9
    - 1.0
    scale: relative_reduction
  conditions:
  - feature: s0
    range:
    - 0.25
    - 0.3482
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM (1991) Infectious Diseases of Humans: Dynamics and Control. Oxford University
      Press'
    location: Table 4.1 (R0 estimates; diphtheria about 6-7)
  - citation: 'Truelove SA, Keegan LT, Moss WJ, et al. (2020) Clinical and epidemiological aspects of diphtheria:
      a systematic review and pooled analysis. Clinical Infectious Diseases 71(1):89-97'
    location: Results, vaccine effectiveness (about 87% for 3+ doses; location within paper not verified)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B2
  mechanism: Routine reaching ~30% of susceptibles cuts Reff by about a quarter; in high-s0 districts Reff stays
    above one, so the outbreak still occurs and routine averts only part of it (final-size overshoot is dampened,
    not prevented).
  about:
    package: routine
    feature: s0
  direction: reduces
  magnitude:
    band:
    - 0.25
    - 0.85
    scale: relative_reduction
  conditions:
  - feature: s0
    range:
    - 0.3
    - 0.3482
  source_type: literature
  evidence:
  - citation: Kermack WO, McKendrick AG (1927) A contribution to the mathematical theory of epidemics. Proceedings
      of the Royal Society of London A 115:700-721
    location: 'final-size relation (my worked values: Reff 1.1-2.8 baseline vs 0.73x that under routine gives 0.37-0.8
      reduction)'
  - citation: 'Anderson RM, May RM (1991) Infectious Diseases of Humans: Dynamics and Control. Oxford University
      Press'
    location: Table 4.1
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B3
  mechanism: Where routine fails to bring Reff below one (high s0), the infections catch-up averts beyond routine
    (~0.1-0.2 per resident) exceed the extra US$1.50 per resident at the budget's shadow price, so catch-up beats
    routine there.
  about:
    pair:
    - catchup
    - routine
  direction: increases
  conditions:
  - feature: s0
    range:
    - 0.28
    - 0.3482
  source_type: literature
  evidence:
  - citation: 'Fine P, Eames K, Heymann DL (2011) ''Herd immunity'': a rough guide. Clinical Infectious Diseases
      52(7):911-916'
    location: threshold 1 - 1/R0 discussion
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 0
    not_found: 0
    not_a_citation: 0
    lookup_failed: 1
    confidence_claimed: medium
- id: B4
  mechanism: The catchup/routine choice flips along s0 near the point where routine alone stops holding Reff below
    one, about s0 = 1/(0.73 R0), shifted up slightly because just above threshold routine still leaves a small outbreak;
    below it routine (half price) is enough.
  about:
    pair:
    - catchup
    - routine
  direction: flips
  conditions:
  - feature: s0
    range:
    - 0.18
    - 0.32
  source_type: literature
  evidence:
  - citation: 'Fine P, Eames K, Heymann DL (2011) ''Herd immunity'': a rough guide. Clinical Infectious Diseases
      52(7):911-916'
    location: herd immunity threshold
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B5
  mechanism: In districts whose susceptible share is below the herd threshold (s0 < 1/R0) importations cause only
    short stuttering chains (~seed/(1-Reff) infections, of order 1e-4 to 1e-3 per resident), so any vaccination
    averts too little to justify its cost at the shadow price; none beats routine there.
  about:
    pair:
    - none
    - routine
  direction: increases
  conditions:
  - feature: s0
    range:
    - 0.1145
    - 0.14
  source_type: literature
  evidence:
  - citation: 'Diekmann O, Heesterbeek JAP (2000) Mathematical Epidemiology of Infectious Diseases: Model Building,
      Analysis and Interpretation. Wiley'
    location: branching-process minor-outbreak size (chapter not verified)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 0
    not_found: 1
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B6
  mechanism: 'Catch-up''s relative reduction rises with s0: in subcritical districts it only shortens chains (reduction
    ~0.4-0.7), in supercritical ones it prevents the whole outbreak (~1).'
  about:
    package: catchup
    feature: s0
  direction: increases
  source_type: literature
  evidence:
  - citation: Kermack WO, McKendrick AG (1927) A contribution to the mathematical theory of epidemics. Proceedings
      of the Royal Society of London A 115:700-721
    location: final-size relation
  confidence: medium
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B7
  mechanism: Among supercritical districts, routine's relative reduction falls as transmission (contact_rate, hence
    R0) rises, because the 27% cut in susceptibles leaves Reff further above one.
  about:
    package: routine
    feature: contact_rate (calibration scale)
  direction: decreases
  conditions:
  - feature: s0
    range:
    - 0.22
    - 0.3482
  source_type: literature
  evidence:
  - citation: Kermack WO, McKendrick AG (1927) A contribution to the mathematical theory of epidemics. Proceedings
      of the Royal Society of London A 115:700-721
    location: final-size relation
  confidence: medium
  decision_relevant: true
  citation_check:
