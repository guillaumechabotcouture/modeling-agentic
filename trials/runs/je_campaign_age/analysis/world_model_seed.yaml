- id: B8
  mechanism: The budget binds (CHILD in all 24 districts probably costs more than US$6M), so the decision rule is
    to rank districts by inc and give CHILD to the highest-incidence districts until the money runs out; WIDE only
    where inc is near the top of the range and CHILD is already funded everywhere it pays. Effectiveness evidence
    for SA14-14-2 is case-control, not randomised; the only randomised efficacy trial is of the inactivated mouse-brain
    vaccine (about 91%)
  about:
    component: child
  direction: none
