beliefs:
- id: B1
  mechanism: 'A one-dose SA14-14-2 campaign of ages 1-14 at ~85% reach removes the child share of cases: share 0.60-0.85
    x reach 0.85 x single-dose effectiveness 0.80-0.99, over 2026-2028 with little waning'
  about:
    package: child
  direction: reduces
  magnitude:
    band:
    - 0.4
    - 0.72
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Hennessy S, et al. Effectiveness of live-attenuated Japanese encephalitis vaccine (SA14-14-2): a
      case-control study. Lancet 1996'
    location: Results (single dose about 80%, two doses about 97.5%); page not checked
  - citation: 'Bista MB, et al. Efficacy of single-dose SA 14-14-2 vaccine against Japanese encephalitis: a case
      control study. Lancet 2001'
    location: Results (about 99% shortly after campaign); page not checked
  - citation: 'Campbell GL, et al. Estimated global incidence of Japanese encephalitis: a systematic review. Bull
      World Health Organ 2011'
    location: Discussion, share of cases in children (about 75% under 15 in endemic areas); location not checked
  confidence: medium
  decision_relevant: true
  citation_check:
