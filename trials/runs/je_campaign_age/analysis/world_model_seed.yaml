open_questions:
- id: Q1
  question: Is the shadow price 0.018 cases per US$ a unit slip? 18 DALYs per case at US$1000 per DALY values a
    case at about US$18,000 (5.6e-5 cases per US$), not US$56. At 0.018 every campaign loses to none and every paired
    test favours the cheaper option, whatever the epidemiology
  beliefs:
  - B5
  - B6
  - B7
  decision_relevant: true
- id: Q2
  question: What share of cases is aged 15-29 in these districts (premise 15-40% non-child)? This sets the WIDE
    increment and whether WIDE ever beats CHILD in the highest-incidence districts
  beliefs:
  - B2
  - B5
  decision_relevant: true
- id: Q3
  question: Single-dose SA14-14-2 effectiveness ranges from about 80% (Hennessy 1996) to about 99% (Bista 2001);
    none is randomised. Which applies over 2026-2028?
  beliefs:
  - B1
  - B2
  decision_relevant: true
- id: Q4
  question: 'Total population against the US$6M budget: how many districts CHILD can cover, and so where the inc
    cut-off sits. No optimised plan is produced, so the harness cannot test this'
  beliefs:
  - B8
  decision_relevant: true
- id: Q5
  question: Does the baseline inc already include any routine JE immunisation? If so the campaign reduction applies
    only to the unvaccinated remainder
  beliefs:
  - B1
  - B2
  decision_relevant: false
