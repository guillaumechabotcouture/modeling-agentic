open_questions:
- id: Q1
  question: Does the engine represent campaign timing dynamically (vaccination at day 14 or day 42 of a running
    outbreak) or as protection given before the epidemic with timing folded into efficacy:early and efficacy:late?
    The card lists interventions as applied before the epidemic, so the timing penalty may live entirely in the
    withheld efficacy priors.
  beliefs:
  - B1
  - B2
  - B3
  decision_relevant: true
- id: Q2
  question: Is effective protection per susceptible reached (efficacy) high enough that 0.8 x efficacy pushes post-campaign
    Reff below 1 in the highest-s0 districts? If not, late (and even early) leaves a supercritical outbreak where
    s0 is high.
  beliefs:
  - B1
  - B2
  decision_relevant: true
- id: Q3
  question: In districts with Reff near 1 (low s0, low R0), the outbreak barely grows; does the extra infection
    count from waiting fall below the 0.07% break-even there, making late the better buy?
  beliefs:
  - B6
  decision_relevant: true
- id: Q4
  question: With the budget binding (early everywhere costs roughly twice US$4M), is the right plan early in high-burden
    districts and late or none elsewhere, or late everywhere? This turns on per-dollar averted infections, which
    the sweep's paired tests at the fixed lambda only partly answer.
  beliefs:
  - B6
  - B7
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: Early reduces infections relative to none by 60-97% in at least 70% of usable points
  p: 0.55
  test:
    kind: effect_band
    package: early
    band:
    - 0.6
    - 0.97
    min_share: 0.7
- id: H2
  belief: B2
  claim: Late reduces infections relative to none by 25-85% in at least 60% of usable points
  p: 0.45
  test:
    kind: effect_band
    package: late
    band:
    - 0.25
    - 0.85
    min_share: 0.6
- id: H3
  belief: B3
  claim: Late's relative reduction decreases as s0 rises
  p: 0.6
  weights:
    decreases: 0.6
    increases: 0.1
