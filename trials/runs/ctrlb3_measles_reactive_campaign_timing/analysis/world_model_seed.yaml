beliefs:
- id: B1
  mechanism: Early campaign (day 14, about one generation after detection) lands before most of the outbreak and
    drives Reff well below 1; it averts most infections that would occur without response, less the seed already
    infected and the tail from people infected before day 14
  about:
    package: early
  direction: reduces
  magnitude:
    band:
    - 0.6
    - 0.97
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Grais RF, Conlan AJK, Ferrari MJ, et al. Time is of the essence: exploring a measles outbreak response
      vaccination in Niamey, Niger. J R Soc Interface 2008'
    location: Results, impact of intervention timing figure (location of the specific figure uncertain)
  - citation: Ma J, Earn DJD. Generality of the final size formula for an epidemic of a newly invading infectious
      disease. Bull Math Biol 2006
    location: final size relation, Section 2
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B2
  mechanism: Late campaign (day 42, about three generations after detection) lands after a large share of the outbreak
    in fast-growing districts; its relative reduction is smaller than early and falls as Reff (s0) rises
  about:
    package: late
  direction: reduces
  magnitude:
    band:
    - 0.25
    - 0.85
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Grais RF, Conlan AJK, Ferrari MJ, et al. Time is of the essence: exploring a measles outbreak response
      vaccination in Niamey, Niger. J R Soc Interface 2008'
    location: Results, delay scenarios (exact figure uncertain)
  - citation: Minetti A, Kagoli M, Katsulukuta A, et al. Lessons and challenges for measles control from unexpected
      large outbreak, Malawi. Emerg Infect Dis 2013
    location: Discussion, late response
  confidence: low
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B3
  mechanism: Higher susceptible share means higher Reff and faster growth, so more of the outbreak has already happened
    by day 42; late's relative reduction falls with s0
