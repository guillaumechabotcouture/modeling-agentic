- id: H7
  belief: B6
  claim: Where gap_1_4 is high (0.22-0.2827), community beats school on net benefit in at least 60% of points.
  p: 0.42
  test:
    kind: paired_sign
    a: community
    b: school
    feature: gap_1_4
    range:
    - 0.22
    - 0.2827
    sign: positive
    min_share: 0.6
- id: H8
  belief: B6
  claim: The school/community transition along gap_1_4 lies within 0.12-0.26.
  p: 0.35
