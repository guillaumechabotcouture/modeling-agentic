beliefs:
- id: B1
  mechanism: Three annual rounds of community-wide door-to-door sputum Xpert screening reduce prevalent bacteriologically
    confirmed TB by removing prevalent cases (shortening infectious duration) and cutting onward transmission
  about:
    package: cacf
  direction: reduces
  magnitude:
    band:
    - 0.22
    - 0.6
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: Marks GB et al. Community-wide Screening for Tuberculosis in a High-Prevalence Setting. N Engl J Med
      2019;381:1347-1357 (ACT3)
    location: 'Abstract and main prevalence-survey results table: year-4 prevalence ratio about 0.56 (95% CI about
      0.40-0.78); table number not verified'
  - citation: 'Corbett EL et al. Comparison of two active case-finding strategies for community-based diagnosis
      of symptomatic smear-positive tuberculosis and control of infectious tuberculosis in Harare, Zimbabwe (DETECTB):
      a cluster-randomised trial. Lancet 2010;376:1244-1253'
    location: 'Abstract: culture-positive prevalence fell by about 40% across both arms (before-after, no arm difference)'
  - citation: 'Burke RM et al. Community-based active case-finding interventions for tuberculosis: a systematic
      review. Lancet Public Health 2021;6:e283-e299'
    location: Results on prevalence outcomes; location not verified
  confidence: medium
  decision_relevant: true
  citation_check:
    confidence_claimed: medium
    found: 3
    not_found: 0
    lookup_failed: 0
- id: B2
  mechanism: Enhanced household-contact investigation finds cases among the highest-risk contacts and, at population
    level, gives a modest reduction in prevalence; the only randomised population-level prevalence estimate has
    an interval crossing no effect
  about:
    package: hhc
  direction: reduces
  magnitude:
    band:
    - 0.0
    - 0.36
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Ayles H et al. Effect of household and community interventions on the burden of tuberculosis in southern
      Africa: the ZAMSTAR community-randomised trial. Lancet 2013;382:1183-1194'
    location: 'Abstract and prevalence results table: household intervention adjusted prevalence ratio about 0.82
      (95% CI about 0.64-1.04); table number not verified'
  - citation: Fox GJ et al. Household-Contact Investigation for Detection of Tuberculosis in Vietnam. N Engl J Med
      2018;378:221-229 (ACT2)
    location: 'Abstract: higher case detection with contact investigation; prevalence not the outcome'
  - citation: 'Fox GJ et al. Contact investigation for tuberculosis: a systematic review and meta-analysis. Eur
      Respir J 2013;41:140-156'
    location: 'Abstract: pooled yield about 3% of household contacts in low- and middle-income settings'
  confidence: low
  decision_relevant: true
  citation_check:
    confidence_claimed: low
    found: 3
    not_found: 0
    lookup_failed: 0
- id: B3
  mechanism: Per dollar, HHC buys more relative reduction than CACF (roughly 0.0-0.3 per $1.20 versus 0.2-0.6 per
    $12), so where prevalence is low HHC beats CACF at a binding budget's shadow price; CACF's larger absolute effect
    only pays where baseline prevalence is high enough. The HHC-versus-CACF choice flips along prevalence, roughly
    mid-range
  about:
    pair:
    - hhc
    - cacf
    feature: prev
  direction: flips
  conditions:
  - feature: prev
    range:
    - 0.003
    - 0.0075
  source_type: literature
  evidence:
  - citation: Marks GB et al. Community-wide Screening for Tuberculosis in a High-Prevalence Setting. N Engl J Med
      2019;381:1347-1357
    location: Abstract (effect size used in the per-dollar arithmetic)
  - citation: 'Ayles H et al. Effect of household and community interventions on the burden of tuberculosis in southern
      Africa: the ZAMSTAR community-randomised trial. Lancet 2013;382:1183-1194'
    location: Abstract (effect size used in the per-dollar arithmetic)
  confidence: low
  decision_relevant: true
  citation_check:
    confidence_claimed: low
    found: 2
    not_found: 0
    lookup_failed: 0
- id: B4
  mechanism: 'Adding HHC to CACF still gains: under independent action the HHC increment is RR_cacf x (1 - RR_hhc)
    of baseline for $1.20 more per resident, which beats the shadow price where prevalence is moderate to high'
  about:
    pair:
    - cacf+hhc
    - cacf
    feature: prev
  direction: increases
  conditions:
  - feature: prev
    range:
    - 0.004
    - 0.008283
  source_type: literature
  evidence:
  - citation: 'Ayles H et al. Effect of household and community interventions on the burden of tuberculosis in southern
      Africa: the ZAMSTAR community-randomised trial. Lancet 2013;382:1183-1194'
    location: 'Factorial design: household arm effect estimated with and without community case finding; no interaction
      test powered; location not verified'
  confidence: low
  decision_relevant: true
  citation_check:
    confidence_claimed: low
    found: 1
    not_found: 0
    lookup_failed: 0
- id: B5
  mechanism: 'HHC beats doing nothing in nearly every district: its cost per resident is small relative to the benefit
    at any plausible shadow price set by marginal CACF'
  about:
    pair:
    - hhc
    - none
    feature: prev
  direction: increases
  source_type: literature
  evidence:
