    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B7
  mechanism: 'Routine versus doing nothing: routine costs US$0.50 per resident (~0.0004 infections per resident
    at the shadow price). Wherever a major outbreak would occur (baseline Reff above ~1.1) it averts roughly s x
    attack rate, ~0.005-0.05 infections per resident, far more than its cost; it loses to none only where the district
    is already near or below threshold. Analogues held in chainb1 H8, chainb2 H7 and chainb3 H7.'
  about:
    pair:
    - routine
    - none
  direction: none
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: threshold theorem and final size (chapter location uncertain)
  confidence: medium
