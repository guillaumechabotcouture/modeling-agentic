    lookup_failed: 0
    confidence_claimed: medium
- id: B8
  mechanism: 'District population should not move the relative reduction of response: the model is per capita with
    homogeneous mixing, and one importation is a seed share of only 2e-6 to 1.2e-5, so the infections before day
    42 are a negligible share of the final size at any population in the range. Population matters for the plan
    only through the budget (cost scales with residents).'
  about:
    package: response
    feature: pop
  direction: negligible
  source_type: literature
  evidence:
  - citation: 'Grais RF, Conlan AJK, Ferrari MJ, Djibo A, Le Menach A, Bjornstad ON, Grenfell BT. Time is of the
      essence: exploring a measles outbreak response vaccination in Niamey, Niger. J R Soc Interface 2008'
    location: dependence of response benefit on delay relative to epidemic stage (location uncertain)
  confidence: low
