beliefs:
- id: B1
  mechanism: 'Final-size threshold for routine: removing about 0.6 x efficacy (~0.5) of the under-5 susceptibles
    before the importation lowers Reff proportionally to the share of the district susceptible pool they make up.
    Where the under-5 share (infants plus the 1-4 gap) dominates the pool, routine takes Reff below 1 and averts
    nearly all of the outbreak; where older children carry much of the gap it averts a large fraction but not all.
    Its relative reduction is large in most points.'
  about:
    package: routine
  direction: reduces
  magnitude:
    band:
    - 0.4
    - 1.0
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: final-size and herd-immunity-threshold relations (chapter location uncertain)
  - citation: 'Uzicanin A, Zimmerman L. Field effectiveness of live attenuated measles-containing vaccines: a review
      of published literature. J Infect Dis 2011'
    location: summary of effectiveness at >=9 months (about 85-95%); exact table uncertain
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B2
  mechanism: 'Routine reaches exactly the cohorts measured by gap_1_4: a larger 1-4 gap raises the baseline outbreak
    while routine removes about half of those added susceptibles, so routine''s relative reduction rises with gap_1_4
    (partly offset where its residual Reff stays above 1). Analogues held in chainb1 H3 and chainb2 H3 (campaign''s
    own target cohort, rho 0.35-0.54).'
  about:
    package: routine
    feature: gap_1_4
  direction: increases
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: final-size relation (chapter location uncertain)
  confidence: medium
  decision_relevant: false
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B3
  mechanism: 'Dilution by susceptibles routine cannot reach: a larger 5-9 gap adds susceptibles outside the under-5
    target and raises the baseline Reff, so routine''s relative reduction should fall as gap_5_9 rises. The same
    dilution claim was inconclusive twice before (chainb1 H2 rho 0.06, chainb2 H2 rho -0.07), likely because the
    reduction saturates near 100% where Reff ends below 1 and the 5-9 cohort is a modest share of the pool; I keep
    the direction but give ''no material effect'' the larger weight.'
  about:
    package: routine
    feature: gap_5_9
  direction: decreases
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: final-size relation (chapter location uncertain)
  confidence: low
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B4
  mechanism: 'Timing penalty of the response campaign: infections before day 42 (3-4 generations) cannot be prevented,
    and growth per generation rises with R0 (the calibration contact rate). A higher contact rate also leaves a
    higher residual Reff after the campaign. So, at fixed gaps, response''s relative reduction falls as contact_rate
    rises. With a single importation in populations of 86k-600k, the outbreak is still small at day 42 unless Reff
    is well above 1, so the penalty is modest; the residual-Reff channel probably dominates. Analogue: chainb1 H7
    and chainb3 H2 showed the late campaign losing more as early growth rose.'
  about:
    package: response
    feature: contact_rate (calibration scale)
  direction: decreases
  source_type: literature
  evidence:
  - citation: 'Grais RF, Conlan AJK, Ferrari MJ, Djibo A, Le Menach A, Bjornstad ON, Grenfell BT. Time is of the
      essence: exploring a measles outbreak response vaccination in Niamey, Niger. J R Soc Interface 2008'
    location: results on cases averted versus response delay (figure location uncertain)
  - citation: 'Guerra FM, Bolotin S, Lim G, Heffernan J, Deeks SL, Li Y, Crowcroft NS. The basic reproduction number
      (R0) of measles: a systematic review. Lancet Infect Dis 2017'
    location: range of R0 estimates (abstract)
  confidence: low
  decision_relevant: false
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B5
  mechanism: 'Routine versus response: response removes more susceptibles (85% of 1-9 versus 60% of under-5) but
    leaves infants, starts 42 days late and costs US$0.80 more per resident (~0.0007 infections per resident at
    the shadow price). Where routine already takes Reff below 1, response''s extra infections averted are near zero
    and routine wins on net benefit. Across the full gap_5_9 range most points are of that kind, so routine wins
    in most points. Prior run chainb1 found the broader, later, costlier campaign winning only at the extreme of
    its target gap (flip at gap_1_4 ~0.23-0.30).'
  about:
    pair:
    - routine
    - response
  direction: none
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: final-size relation (chapter location uncertain)
  - citation: 'Grais RF, Conlan AJK, Ferrari MJ, Djibo A, Le Menach A, Bjornstad ON, Grenfell BT. Time is of the
      essence: exploring a measles outbreak response vaccination in Niamey, Niger. J R Soc Interface 2008'
    location: response delay results (location uncertain)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B6
  mechanism: 'When the immunity gap is too large for prevention in the youngest alone: where the 5-9 gap is high,
    the susceptibles routine cannot reach keep its residual Reff above 1, and response''s extra infections averted
    (~0.005-0.03 per resident) may exceed its extra cost at the shadow price, so response may beat routine there.
    I am unsure this regime exists in the sweep: infants, whom response does not reach, may keep both residuals
    similar, and the 42-day delay works against response.'
  about:
    pair:
    - response
    - routine
  direction: flips
  conditions:
  - feature: gap_5_9
    range:
    - 0.13
    - 0.1896
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: final-size relation (chapter location uncertain)
  confidence: low
  decision_relevant: true
  citation_check:
