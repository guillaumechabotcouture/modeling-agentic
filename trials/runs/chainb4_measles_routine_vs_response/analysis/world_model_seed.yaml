open_questions:
- id: Q1
  question: Does routine's 'children under five' include the infant cohort (and at what efficacy below 9 months)?
    If infants are excluded, routine's residual Reff is higher, response's advantage in reach shrinks less, and
    the routine/response flip moves to lower gap_5_9.
  beliefs:
  - B1
  - B5
  - B6
  decision_relevant: true
- id: Q2
  question: What are the age shares of the district populations (n_groups, s0_groups in units.csv)? The infant share
    sets a floor on the residual susceptible pool after either option, and so how many districts are near threshold.
  beliefs:
  - B1
  - B6
  - B7
  decision_relevant: true
- id: Q3
  question: Is the reported outcome the deterministic final size or weighted by p_major? With a single importation
    and Reff near 1, p_major (~1 - 1/Reff) is small, which shrinks benefits near threshold and favours the cheaper
    routine.
  beliefs:
  - B5
  - B7
  decision_relevant: true
- id: Q4
  question: Does the US$5M budget bind? Routine everywhere costs about US$0.5 per resident (roughly US$3-4M if districts
    average ~250k); response everywhere would cost about 2.6 times that. If response wins in some districts, the
    budget's dual, not the DALY shadow price, governs the trade between response in a few districts and routine
    in more.
  beliefs:
  - B5
  - B6
  decision_relevant: true
- id: Q5
  question: Are routine and response efficacy priors equal? A lower response efficacy (campaign quality in an outbreak
    setting) would move any flip toward routine.
  beliefs:
  - B5
  - B6
  decision_relevant: true
