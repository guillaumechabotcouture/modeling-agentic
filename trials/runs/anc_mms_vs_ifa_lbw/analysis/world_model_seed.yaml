open_questions:
- id: Q1
  question: Does the engine apply MMS's LBW relative risk on top of IFA's (MMS vs none = RR_ifa x RR_mms_vs_ifa)
    or directly against no supplement? If directly, MMS is costlier and less effective than IFA, so it is dominated
    and the rule collapses to IFA vs none.
  beliefs:
  - B2
  - B5
  decision_relevant: true
- id: Q2
  question: How large is the true IFA vs none effect on LBW in this setting? The Cochrane CI includes no effect,
    and its trials are largely from settings unlike this one. A small IFA effect pushes the plan toward MMS in fewer,
    higher-burden districts.
  beliefs:
  - B1
  - B7
  decision_relevant: true
- id: Q3
  question: Is the effect larger where anaemia prevalence is high (iron deficiency)? The engine ignores anaemia.
    If the effect is truly modified, district ranking should weight anaemia as well as lbw.
  beliefs:
  - B3
  decision_relevant: true
- id: Q4
  question: What shadow price does the declared budget imply? It sets where IFA vs none and MMS vs IFA switch along
    lbw.
  beliefs:
  - B5
  - B6
  - B7
  decision_relevant: true
- id: Q5
  question: Do baseline LBW shares come from comparable measurements across districts (survey birthweight recall
    or card vs facility records, heaping, missing weights)? Differential ascertainment would misrank districts.
  beliefs:
  - B5
  - B7
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: IFA's relative reduction in LBW vs none lies in [0.0, 0.31] (the Cochrane 95% CI with the slightly harmful
    tail excluded) in at least 80% of usable points; refuted if 20% or fewer do
  test:
    kind: effect_band
    package: ifa
    band:
    - 0.0
    - 0.31
    min_share: 0.8
- id: H2
  belief: B2
  claim: MMS's relative reduction in LBW vs none lies in [0.12, 0.38] (IFA's effect stacked with the MMS-vs-IFA
    effect) in at least 80% of usable points; refuted if 20% or fewer do, for example if MMS is applied directly
    against none at about 0.12
  test:
    kind: effect_band
    package: mms
    band:
    - 0.12
    - 0.38
    min_share: 0.8
- id: H3
  belief: B3
  claim: 'MMS''s relative reduction does not vary with anaemia prevalence: |Spearman rho| bound within 0.2'
  test:
    kind: effect_direction
    package: mms
    feature: anaemia
    direction: negligible
    equivalence: 0.2
- id: H4
  belief: B4
  claim: 'IFA''s relative reduction does not vary with the baseline LBW share: |Spearman rho| bound within 0.2'
  test:
    kind: effect_direction
    package: ifa
    feature: lbw
    direction: negligible
    equivalence: 0.2
- id: H5
  belief: B5
  claim: The MMS/IFA net-benefit switch along lbw lies within [0.13, 0.2191], with MMS preferred above it
  test:
