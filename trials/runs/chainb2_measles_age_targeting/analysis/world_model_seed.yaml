open_questions:
- id: Q1
  question: Does the engine report the deterministic final size, or weight it by p_major (1 - 1/Reff for one importation)?
    Weighting by p_major shrinks benefits near threshold and moves the C/D flip upward.
  beliefs:
  - B1
  - B4
  - B5
  decision_relevant: true
- id: Q2
  question: What are the age shares (infants under 9 months, 9-59 months, 5-14 years) in districts.csv? A larger
    infant share raises the residual after either campaign and can leave Reff above 1 even after D.
  beliefs:
  - B1
  - B4
  decision_relevant: true
- id: Q3
  question: Does the US$2.9M budget bind if D is chosen wherever it beats C? If so, the optimiser trades D in high-gap
    districts against C in others, and district population (fixed cost share) matters.
  beliefs:
  - B4
  - B5
  decision_relevant: true
- id: Q4
  question: How much does the calibration contact_rate (R0 10-16) move the flip? Higher R0 lowers the flip along
    susc_5_14y; across the sweep it blurs a single threshold.
  beliefs:
  - B4
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: D_9mto14y reduces infections by 85-100% relative to none in at least 70% of usable points.
  p: 0.65
  test:
    kind: effect_band
    package: D_9mto14y
    band:
    - 0.85
    - 1.0
    min_share: 0.7
- id: H2
  belief: B2
  claim: C_9to59m's relative reduction decreases as susc_5_14y rises.
  p: 0.75
  weights:
    decreases: 0.75
    increases: 0.07
    no material effect: 0.18
  test:
    kind: effect_direction
    package: C_9to59m
    feature: susc_5_14y
    direction: decreases
- id: H3
  belief: B3
  claim: C_9to59m's relative reduction increases as susc_9_59m rises.
