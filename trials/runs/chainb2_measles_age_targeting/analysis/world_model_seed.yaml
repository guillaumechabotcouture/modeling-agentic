    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B7
  mechanism: 'Low older-child gap regime (below the B4 flip region): with few 5-14 year susceptibles, C alone takes
    residual Reff below 1, so D''s extra cost (~2.5-3x as many children) buys almost no extra infections averted
    and the cheaper C wins on net benefit at the shadow price.'
  about:
