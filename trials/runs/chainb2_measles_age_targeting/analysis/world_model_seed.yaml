beliefs:
- id: B1
  mechanism: 'Final-size threshold: removing ~77% of the susceptibles aged 9 months-14 years leaves only infants
    under 9 months and the unreached, so residual Reff falls below 1 in almost every district and D averts nearly
    all infections of the major outbreak wherever one would occur.'
  about:
    package: D_9mto14y
  direction: reduces
  magnitude:
    band:
    - 0.85
    - 1.0
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Chapter 3 (final size and threshold) and Chapter 5 (vaccination thresholds); page not checked
  - citation: 'Fine P, Eames K, Heymann DL. ''Herd immunity'': a rough guide. Clin Infect Dis 2011'
    location: Table 1 (herd immunity thresholds by R0)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B2
  mechanism: C leaves the 5-14 year susceptibles untouched; as susc_5_14y rises, the residual pool after C grows
    (and pushes residual Reff above 1), so C's relative reduction falls.
  about:
    package: C_9to59m
    feature: susc_5_14y
  direction: decreases
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Chapter 5; page not checked
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B3
  mechanism: 'A larger 9-59 month gap raises the baseline outbreak but C removes ~77% of exactly those susceptibles,
    so the residual after C changes little while the baseline grows: C''s relative reduction rises with susc_9_59m
    (partly offset where the residual Reff stays above 1).'
  about:
    package: C_9to59m
    feature: susc_9_59m
  direction: increases
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Chapter 5; page not checked
  confidence: low
  decision_relevant: false
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B4
  mechanism: 'Which age range to target turns on the older-child gap: where susc_5_14y is high, C leaves Reff above
    1 and D''s extra infections averted (~0.01-0.05 per resident) dwarf its extra cost at the shadow price (~0.0003
    per resident); where susc_5_14y is low, C already takes Reff below 1 and the cheaper C wins. The flip lies roughly
    at susc_5_14y 0.07-0.17, moving up with lower R0 and lower susc_9_59m.'
  about:
    pair:
    - D_9mto14y
    - C_9to59m
    feature: susc_5_14y
  direction: flips
  conditions:
  - feature: susc_5_14y
    range:
    - 0.07
    - 0.17
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Chapter 5; page not checked
  - citation: 'Guerra FM, Bolotin S, Lim G, et al. The basic reproduction number (R0) of measles: a systematic review.
      Lancet Infect Dis 2017'
    location: Results (range of R0 estimates); table not checked
  confidence: low
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B5
  mechanism: Versus doing nothing, D is worth its cost wherever baseline Reff exceeds 1 (most districts, given s
    ~0.06-0.15 and R0 10-16); it loses to none only where the district is already below threshold, where one importation
    produces a minor chain only.
  about:
    pair:
    - D_9mto14y
    - none
    feature: susc_5_14y
  direction: reduces
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Chapter 3; page not checked
  confidence: medium
  decision_relevant: true
  citation_check:
