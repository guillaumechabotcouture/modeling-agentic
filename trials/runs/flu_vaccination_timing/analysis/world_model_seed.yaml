beliefs:
- id: B1
  mechanism: 'Direct protection: inactivated seasonal influenza vaccine protects about 40-60% of vaccinated healthy
    adults against laboratory-confirmed influenza, with large variation by season and subtype. With about 40% reached,
    the direct effect alone removes roughly 15-25% of susceptibles. The engine applies this as all-or-nothing protection
    of the susceptibles reached.'
  about:
    package: on_time
  direction: reduces
  magnitude:
    band:
    - 0.4
    - 0.65
    scale: vaccine_efficacy_against_infection
  source_type: literature
  evidence:
  - citation: 'Osterholm MT, Kelley NS, Sommer A, Belongia EA. Efficacy and effectiveness of influenza vaccines:
      a systematic review and meta-analysis. Lancet Infect Dis 2012'
    location: Results / Figure 2 (pooled TIV efficacy about 59% in adults 18-65)
  - citation: 'Belongia EA, Simpson MD, King JP, et al. Variable influenza vaccine effectiveness by subtype: a systematic
      review and meta-analysis of test-negative design studies. Lancet Infect Dis 2016'
    location: Results (pooled VE by subtype; lowest for A(H3N2))
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 1
    confidence_claimed: medium
- id: B2
  mechanism: Herd amplification near the epidemic threshold. Final size follows z = 1 - exp(-Reff z), with Reff
    = R0 x s0 roughly between 0.65 and 1.7 across these units. Removing 15-25% of susceptibles before the season
    gives relative reductions in infections, and so in hospitalisations, larger than the direct share. The gain
    is largest where Reff is just above 1 and the vaccine pushes it below 1 (relative reduction near 0.8-1). It
    is smallest where Reff is about 1.6-1.7 (about 0.3-0.5). Below Reff 1 only minor outbreaks occur, the burden
    is small and the relative reduction is moderate.
  about:
    package: on_time
  direction: reduces
  magnitude:
    band:
    - 0.3
    - 0.95
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: Ma J, Earn DJD. Generality of the final size formula for an epidemic of a newly invading infectious
      disease. Bull Math Biol 2006
    location: final size relation, Section 2
  - citation: 'Biggerstaff M, Cauchemez S, Reed C, Gambhir M, Finelli L. Estimates of the reproduction number for
      seasonal, pandemic, and zoonotic influenza: a systematic review of the literature. BMC Infect Dis 2014'
    location: Results (median R for seasonal influenza about 1.3, IQR about 1.2-1.4)
  - citation: 'Fine P, Eames K, Heymann DL. ''Herd immunity'': a rough guide. Clin Infect Dis 2011'
    location: threshold discussion (1 - 1/R)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 3
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B3
  mechanism: 'Loss from delay. Protection that arrives d days into the season misses the infections that have already
    occurred, plus those in the chains already under way, which grow about exp(r d) with r = ln(Reff)/Tg and Tg
    about 3 days. With seed 1e-5 to 1e-3 and Reff 1.3-1.7, cumulative infections by day 21 stay at or below about
    1-3% of the population in most units. So day21 keeps most of the on_time effect. By day 42 they can reach 10-30%
    where the seed is high and Reff is high, so day42 loses a large share there and little where the seed is low
    or Reff is near 1. The relative reduction of day42 should therefore fall as seed_share rises. Caveat: the engine
    card describes interventions as applied before the epidemic. Delay may be represented only through the efficacy:day21/day42
    parameters, not mechanistically. In that case this dependence on seed would be weak or absent.'
  about:
    package: day42
    feature: seed_share
  direction: decreases
  magnitude:
    band:
    - 0.05
    - 0.6
    scale: share_of_on_time_effect_lost
  source_type: literature
  evidence:
  - citation: Cowling BJ, Fang VJ, Riley S, Malik Peiris JS, Leung GM. Estimation of the serial interval of influenza.
      Epidemiology 2009
    location: Results (mean serial interval about 3.6 days)
  - citation: Ferguson NM, Cummings DAT, Fraser C, Cajka JC, Cooley PC, Burke DS. Strategies for mitigating an influenza
      pandemic. Nature 2006
    location: vaccination timing results (benefit falls steeply with delay after the epidemic starts)
  confidence: low
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B4
  mechanism: The hospitalisation ratio is a per-infection multiplier, the same with and without vaccination. So
    the relative reduction in hospitalisations does not depend on ratio_hosp. It changes the burden (the ranking
    of units) and the absolute gap between options, not the relative effect.
  about:
    package: on_time
    feature: ratio_hosp
  direction: negligible
  source_type: literature
  evidence:
  - citation: Medlock J, Galvani AP. Optimizing influenza vaccine distribution. Science 2009
    location: model structure (outcomes as per-infection multipliers on infections)
  confidence: high
  decision_relevant: false
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: high
- id: B5
  mechanism: 'In units with an epidemic well above threshold (high s0), raising s0 raises Reff and lowers the relative
    reduction from a fixed 40% reach. Vaccinated immune people are wasted doses: dose efficiency scales with s0,
    but a high s0 also means a large epidemic that vaccine at this coverage cannot stop. Across the full s0 range
    the relationship is non-monotone and peaks where post-vaccination Reff crosses 1. Only the upper part, s0 0.75-0.94,
    is claimed to decrease.'
  about:
    package: on_time
    feature: s0
  direction: decreases
  conditions:
  - feature: s0
    range:
    - 0.75
    - 0.941
  magnitude:
    band:
    - 0.3
    - 0.8
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: Ma J, Earn DJD. Generality of the final size formula for an epidemic of a newly invading infectious
      disease. Bull Math Biol 2006
    location: final size relation, Section 2
  confidence: low
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B6
  mechanism: Paying for earlier vaccine. Under a binding budget the shadow price is the marginal hospitalisations
    averted per dollar in the marginal province. Moving a province from day21 to on_time costs 36% more per resident.
    It is worth it only where the extra effect, mostly the infections that occur in the first 3 weeks (B3), exceeds
    about 27% of its effect. That happens only with a high seed and a fast epidemic. So day21 should beat on_time
    at low seed_share. Between day42 and on_time (67% price premium) the preference should flip towards on_time
    only at the high end of seed_share. Where the flip lies is uncertain.
  about:
    pair:
    - day21
    - on_time
  direction: flips
  conditions:
  - feature: seed_share
    range:
    - 0.00015
    - 0.0009756
  source_type: literature
  evidence:
  - citation: Ferguson NM, Cummings DAT, Fraser C, Cajka JC, Cooley PC, Burke DS. Strategies for mitigating an influenza
      pandemic. Nature 2006
    location: vaccination timing results
  confidence: low
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
hypotheses:
- id: H1
  belief: B2
  claim: The on_time relative reduction in hospitalisations lies in 0.30-0.95 at 70% or more of usable points. Refuted
    if 30% or fewer of usable points lie in that band.
  test:
    kind: effect_band
    package: on_time
    band:
    - 0.3
    - 0.95
    min_share: 0.7
- id: H2
  belief: B3
  claim: The day42 relative reduction falls as seed_share rises (more of the epidemic has already happened by day
    42). Refuted if the rank correlation is significantly positive. If the engine represents delay only through
    the efficacy parameters, the expected result is inconclusive.
  test:
    kind: effect_direction
    package: day42
    feature: seed_share
    direction: decreases
- id: H3
  belief: B4
  claim: 'The on_time relative reduction does not depend on ratio_hosp: the 95% interval of |rho| stays within 0.1.
    Refuted if it lies outside 0.1.'
  test:
    kind: effect_direction
    package: on_time
    feature: ratio_hosp
    direction: negligible
    equivalence: 0.1
- id: H4
  belief: B5
  claim: For s0 of 0.75-0.94, the on_time relative reduction falls as s0 rises. Refuted if it rises.
  test:
    kind: effect_direction
    package: on_time
    feature: s0
    direction: decreases
- id: H5
  belief: B6
  claim: At low seed_share (1.02e-5 to 1.5e-4), day21 beats on_time on net benefit at the shadow price at 70% or
    more of usable points. Refuted if on_time wins at 70% or more.
  test:
    kind: paired_sign
    a: day21
    b: on_time
    feature: seed_share
    range:
    - 1.02e-05
    - 0.00015
    sign: positive
    min_share: 0.7
- id: H6
  belief: B6
  claim: The day21/on_time preference flips along seed_share inside 1.5e-4 to 9.756e-4, the upper part of the range.
    Refuted if the located transition lies entirely below 1.5e-4. One-sided (no flip) results are inconclusive.
  test:
    kind: flip_in
    a: day21
    b: on_time
    feature: seed_share
    range:
    - 0.00015
    - 0.0009756
open_questions:
- id: Q1
  question: Does the engine represent delayed vaccination mechanistically, with protection starting at day 21 or
    42 of a running epidemic? Or does it represent delay only as a lower effective efficacy (efficacy:day21/day42)
    applied before the epidemic? If the latter, the value of earlier vaccine follows the priors rather than each
    unit's seed and growth rate, and the per-province timing choice loses its mechanistic basis.
  beliefs:
  - B3
  - B6
  decision_relevant: true
- id: Q2
  question: 'What efficacy (effectiveness against hospitalisation) applies to this season''s strain match? Subtype
    matters: VE against H3N2 is often 30-40%, below the 0.40-0.65 band. Lower VE shrinks every option equally, but
    it shifts which provinces fall below the shadow price.'
  beliefs:
  - B1
  - B2
  decision_relevant: true
- id: Q3
  question: Is s0 (pre-season susceptible share) measured by serosurvey or modelled? Its error decides which provinces
    are near the threshold, where the effect is largest (B2), and which are subcritical and should get nothing.
  beliefs:
  - B2
  - B5
  decision_relevant: true
- id: Q4
  question: Is the 40% reach drawn at random with respect to immunity status, so that doses to immune people are
    wasted, or does it target susceptibles? This changes the direct-protection share by a factor of about 1/s0.
  beliefs:
  - B1
  - B5
  decision_relevant: false
