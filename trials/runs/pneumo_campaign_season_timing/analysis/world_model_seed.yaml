    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: high
- id: B7
  mechanism: Where the seed share is low the epidemic is still early at week 10, so LATE retains most of PRE's benefit;
    waiting costs little there
  about:
    package: late
  direction: reduces
  magnitude:
    band:
    - 0.4
    - 1.0
    scale: relative_reduction
  conditions:
  - feature: seed_share
    range:
