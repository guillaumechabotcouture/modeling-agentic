open_questions:
- id: Q1
  question: What is the generation interval of serotype-1 carriage acquisition (mean in weeks)? It sets how much
    of the season is over by week 10 and so the loss from waiting.
  beliefs:
  - B1
  - B7
  decision_relevant: true
- id: Q2
  question: Is the population-level effect of the campaign on R the same for PRE and LATE (same vaccine and coverage),
    or does LATE's case-triggered coverage differ?
  beliefs:
  - B3
  - B5
  decision_relevant: true
- id: Q3
  question: Is the declared shadow price (1e-5 outcome per USD) on the same scale as acquisitions per person? If
    lambda were orders of magnitude larger, LATE's lower price could win in low-seed districts.
  beliefs:
  - B5
  decision_relevant: true
- id: Q4
  question: How measured is the susceptible share (survey s0 vs calibration scale), and does it vary by district?
  beliefs:
  - B2
  - B4
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: LATE's relative reduction decreases as the starting seed share rises.
  test:
    kind: effect_direction
    package: late
    feature: seed_share
    direction: decreases
- id: H2
  belief: B2
  claim: LATE's relative reduction decreases as s0 rises.
  test:
    kind: effect_direction
    package: late
    feature: s0 (calibration scale)
    direction: decreases
- id: H3
  belief: B3
  claim: PRE averts 55-100% of the season's acquisitions in at least 70% of usable points.
  test:
    kind: effect_band
    package: pre
    band:
    - 0.55
    - 1.0
    min_share: 0.7
- id: H4
  belief: B4
  claim: PRE's relative reduction decreases as s0 rises.
  test:
    kind: effect_direction
    package: pre
    feature: s0 (calibration scale)
    direction: decreases
- id: H5
  belief: B5
  claim: Where the seed share is high (>= 3e-4), PRE beats LATE on net benefit at the shadow price in at least 90%
    of usable points.
  test:
    kind: paired_sign
    a: pre
    b: late
    feature: seed_share
    range:
    - 0.0003
    - 0.00086232
    sign: positive
    min_share: 0.9
- id: H6
  belief: B6
  claim: PRE's relative reduction does not depend on district population (|rho| bound within 0.2).
  test:
    kind: effect_direction
    package: pre
    feature: pop
    direction: negligible
    equivalence: 0.2
- id: H7
  belief: B7
  claim: Where the seed share is low (<= 1e-4), LATE still averts 40-100% of acquisitions in at least 70% of usable
    points.
  test:
    kind: effect_band
    package: late
    band:
    - 0.4
    - 1.0
    min_share: 0.7
    where:
      seed_share:
      - 1.177e-05
      - 0.0001
