beliefs:
- id: B1
  mechanism: A single long-acting monoclonal antibody (nirsevimab-class) dose at birth reduces RSV hospitalisation
    over the first ~5-6 months by roughly three quarters in randomised trials
  about:
    package: mab
  direction: reduces
  magnitude:
    band:
    - 0.6
    - 0.9
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: Drysdale SB et al. Nirsevimab for Prevention of Hospitalizations Due to RSV in Infants. N Engl J Med
      2023;389:2425-2435 (HARMONIE)
    location: Results, primary end point (RSV LRTI hospitalisation efficacy about 83%); table number not verified
  - citation: Hammitt LL et al. Nirsevimab for Prevention of RSV in Healthy Late-Preterm and Term Infants. N Engl
      J Med 2022;386:837-846 (MELODY)
    location: Table 2 (medically attended RSV LRTI about 75%; hospitalisation about 62%, interval wide); table number
      not verified
  - citation: 'Simoes EAF et al. Efficacy of nirsevimab against respiratory syncytial virus lower respiratory tract
      infections in preterm and term infants, and pharmacokinetic extrapolation to infants with congenital heart
      disease and chronic lung disease: a pooled analysis of randomised controlled trials. Lancet Child Adolesc
      Health 2023;7:180-189'
    location: Results, pooled hospitalisation efficacy about 77%; table number not verified
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 1
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B2
  mechanism: Maternal RSV prefusion F vaccination in late pregnancy reduces infant RSV hospitalisation, with efficacy
    waning from about two thirds at 90 days to about one half at 180 days
  about:
    package: maternal
  direction: reduces
  magnitude:
    band:
    - 0.4
    - 0.7
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: Kampmann B et al. Bivalent Prefusion F Vaccine in Pregnancy to Prevent RSV Illness in Infants. N Engl
      J Med 2023;388:1451-1464 (MATISSE)
    location: Table 2 and secondary end points (hospitalisation about 68% at 90 days, about 57% at 180 days, wide
      intervals); location not verified
  - citation: Madhi SA et al. Respiratory Syncytial Virus Vaccination during Pregnancy and Effects in Infants. N
      Engl J Med 2020;383:426-439
    location: Results, hospitalisation end point (different product, about 44%); location not verified
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 1
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B3
  mechanism: Maternal vaccination is delivered through antenatal care, so its realised population effect rises with
    ANC attendance; mab at birth does not depend on ANC (but on facility birth / postnatal contact, not in the data)
  about:
    package: maternal
    feature: anc_attendance
  direction: increases
  source_type: literature
  evidence:
  - citation: Kampmann B et al. Bivalent Prefusion F Vaccine in Pregnancy to Prevent RSV Illness in Infants. N Engl
      J Med 2023;388:1451-1464
    location: Methods (vaccination at 24-36 weeks gestation, i.e. an antenatal contact is required); reasoning,
      not a measured coverage relation
  confidence: low
  decision_relevant: true
  citation_check:
