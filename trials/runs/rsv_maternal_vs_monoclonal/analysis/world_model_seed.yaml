open_questions:
- id: Q1
  question: Does the engine/spec make maternal coverage depend on anc_attendance (and mab coverage on anything)?
    If maternal realised effect is about 0.57 x ANC, the efficacy gap widens and mab can win in high-inc, low-ANC
    districts.
  beliefs:
  - B3
  - B5
  decision_relevant: true
- id: Q2
  question: Which hospitalisation efficacy over 0-6 months does the spec's maternal prior use (90-day vs 180-day,
    product-specific), and how wide is it? The maternal/mab ranking turns on e_b/e_m against the 1.67 price ratio.
  beliefs:
  - B2
  - B5
  decision_relevant: true
- id: Q3
  question: The harness shadow price (DALY threshold) is far below the budget's own dual under a binding US$3M budget;
    paired tests at 0.00073 may favour none over products that the budget-constrained plan would fund. Which lambda
    is the decision's?
  beliefs:
  - B6
  - B7
  decision_relevant: true
- id: Q4
  question: Seasonality and birth timing relative to the RSV season change realised protection of both products
    (maternal protection wanes; mab given at birth outside season is partly wasted); not represented in the engine.
  beliefs:
  - B1
  - B2
  decision_relevant: false
hypotheses:
- id: H1
  belief: B1
  claim: Across usable points, mab's relative reduction in rsv_hosp lies in 0.6-0.9 at >= 70% of points; refuted
    if <= 30% lie in the band.
  test:
    kind: effect_band
    package: mab
    band:
    - 0.6
    - 0.9
    min_share: 0.7
- id: H2
  belief: B2
  claim: Maternal's relative reduction in rsv_hosp lies in 0.4-0.7 at >= 70% of points; refuted if <= 30% (e.g.
    ANC-scaled coverage pushes it below 0.4).
  test:
    kind: effect_band
    package: maternal
    band:
    - 0.4
    - 0.7
    min_share: 0.7
- id: H3
  belief: B3
  claim: Maternal's relative reduction increases with anc_attendance (Spearman interval excludes 0, positive); refuted
    if it is negligible or decreasing.
  test:
    kind: effect_direction
    package: maternal
    feature: anc_attendance
    direction: increases
- id: H4
  belief: B4
  claim: 'Mab''s relative reduction does not vary with inc: Spearman rho interval inside +/-0.2.'
  test:
    kind: effect_direction
    package: mab
    feature: inc
    direction: negligible
    equivalence: 0.2
- id: H5
  belief: B5
  claim: At the shadow price, maternal has higher net benefit than mab at >= 80% of usable points across inc 0.0105-0.046;
    refuted if mab wins at >= 80%.
  test:
    kind: paired_sign
    a: maternal
    b: mab
    feature: inc
    range:
    - 0.0105
    - 0.046
    sign: positive
    min_share: 0.8
- id: H6
  belief: B6
  claim: For inc 0.0105-0.025, none has higher net benefit than mab at >= 80% of usable points at the shadow price.
  test:
    kind: paired_sign
    a: none
    b: mab
    feature: inc
    range:
    - 0.0105
    - 0.025
    sign: positive
    min_share: 0.8
- id: H7
  belief: B7
  claim: The maternal/none transition along inc lies within inc 0.028-0.046; refuted if it is located wholly outside
    that range.
  test:
    kind: flip_in
    a: maternal
    b: none
    feature: inc
    range:
    - 0.028
    - 0.046
