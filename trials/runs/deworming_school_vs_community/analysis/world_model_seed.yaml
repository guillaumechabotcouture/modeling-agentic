    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B7
  mechanism: District population size does not change the relative reduction of either package; it only scales total
    cost and total benefit, and so matters to the plan only through budget packing.
  about:
    package: school
    feature: pop
  direction: negligible
  source_type: literature
  evidence:
