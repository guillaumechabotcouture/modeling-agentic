open_questions:
- id: OQ1
  question: Is the shadow price 3.6e-6 outcome per USD correct? US$1000/DALY x 0.0036 DALY per infection-year implies
    a willingness to pay of ~US$3.6 per infection-year (lambda ~0.28 infection-years per USD). At the harness value
    every paired test is decided by benefit alone; at ~0.28 the cost difference dominates in low-prevalence districts
    and school vs none, and community vs school, could flip along prevalence.
  beliefs:
  - B3
  - B4
  decision_relevant: true
- id: OQ2
  question: What are the trial priors for the school and community relative effects, and do they refer to the same
    outcome (all-age infection prevalence/infection-years), population and window as the survey baseline? A child-only
    prevalence effect applied to an all-age baseline would overstate school's effect.
  beliefs:
  - B1
  - B2
  decision_relevant: true
- id: OQ3
  question: Does the engine scale school's effect by school enrolment? If not, low-enrolment districts are misranked
    between school and community.
  beliefs:
  - B6
  decision_relevant: true
- id: OQ4
  question: Is the ratio RRR_school/0.25 vs (RRR_community - RRR_school)/0.45 reliably on one side across the effect
    uncertainty? That ratio decides whether the budget goes first to school coverage everywhere or to community
    in the top-prevalence districts, and how many districts get community.
  beliefs:
  - B1
  - B2
  - B3
  decision_relevant: true
- id: OQ5
  question: Is the baseline survey prevalence the right estimand (all-age, species-combined, any-intensity infection),
    and what is the survey's sampling frame (school-based surveys under-represent adults)?
  beliefs:
  - B1
  - B2
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: Community's relative reduction in infection-years vs none lies in [0.3, 0.7] in at least 75% of usable
    points.
  test:
    kind: effect_band
    package: community
    band:
    - 0.3
    - 0.7
    min_share: 0.75
- id: H2
  belief: B2
  claim: School's relative reduction in infection-years vs none lies in [0.1, 0.4] in at least 75% of usable points.
  test:
    kind: effect_band
    package: school
    band:
    - 0.1
    - 0.4
    min_share: 0.75
- id: H3
  belief: B3
  claim: Community beats school on per-person net benefit at the harness shadow price in at least 85% of usable
    points across the prevalence range; refuted if school wins in 85%.
  test:
    kind: paired_sign
    a: community
    b: school
    feature: inc
    range:
    - 0.1186
    - 0.4759
    sign: positive
    min_share: 0.85
- id: H4
  belief: B4
  claim: School beats none on per-person net benefit at the harness shadow price in at least 95% of usable points
    across the prevalence range.
  test:
    kind: paired_sign
    a: school
    b: none
    feature: inc
    range:
    - 0.1186
    - 0.4759
    sign: positive
    min_share: 0.95
- id: H5
  belief: B5
  claim: 'Community''s relative reduction does not vary with baseline prevalence: |Spearman rho| bound within 0.15.'
  test:
    kind: effect_direction
    package: community
    feature: inc
    direction: negligible
    equivalence: 0.15
- id: H6
  belief: B6
  claim: School's relative reduction increases with school enrolment (rho interval above 0); refuted if negligible
    or decreasing, which would mean the engine ignores enrolment.
  test:
    kind: effect_direction
    package: school
    feature: school_enrol
    direction: increases
- id: H7
  belief: B7
  claim: 'School''s relative reduction does not vary with district population: |Spearman rho| bound within 0.15.'
  test:
    kind: effect_direction
    package: school
    feature: pop
    direction: negligible
    equivalence: 0.15
