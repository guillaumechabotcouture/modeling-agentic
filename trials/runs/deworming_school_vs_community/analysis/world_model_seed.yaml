beliefs:
- id: B1
  mechanism: Community-wide biannual treatment of all ages reduces all-age STH infection-years in the treatment
    year substantially, because it treats the adult reservoir (notably hookworm) as well as children and cuts reinfection
    pressure; within one year the reduction is large but well short of interruption.
  about:
    package: community
  direction: reduces
  magnitude:
    band:
    - 0.3
    - 0.7
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Pullan RL, Halliday KE, Oswald WE, et al. Effects, equity, and cost of school-based and community-wide
      treatment strategies for soil-transmitted helminths in Kenya: a cluster-randomised controlled trial. Lancet
      2019;393:2039-2050'
    location: Results, primary outcome table (hookworm prevalence by arm at 24 months); exact table number not recalled
  - citation: 'Clarke NE, Clements ACA, Doi SA, et al. Differential effect of mass and targeted anthelmintic drug
      administration on soil-transmitted helminth infections: a systematic review and meta-analysis. Lancet 2017;389:287-297'
    location: Results, meta-regression of prevalence reduction by treatment strategy; table number not recalled
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B2
  mechanism: 'School-based biannual treatment reaches only enrolled school-age children (roughly a quarter to a
    third of residents, times enrolment), so its all-age relative reduction is smaller: direct effect in children
    plus a modest indirect effect on untreated groups, weakest for hookworm where adults carry much of the burden.'
  about:
    package: school
  direction: reduces
  magnitude:
    band:
    - 0.1
    - 0.4
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: Anderson RM, Truscott JE, Pullan RL, Brooker SJ, Hollingsworth TD. How effective is school-based deworming
      for the community-wide control of soil-transmitted helminths? PLoS Negl Trop Dis 2013;7:e2027
    location: Results and figures on community-wide prevalence under school-based treatment by species; figure numbers
      not recalled
  - citation: 'Clarke NE, Clements ACA, Doi SA, et al. Differential effect of mass and targeted anthelmintic drug
      administration on soil-transmitted helminth infections: a systematic review and meta-analysis. Lancet 2017;389:287-297'
    location: Results; child-targeted arm
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B3
  mechanism: 'Per resident, community averts more infection-years than school in every district: its relative reduction
    exceeds school''s (TUMIKIA, Clarke 2017), and at the harness shadow price the extra US$0.45 per resident is
    negligible in the net-benefit comparison, so community beats school across the whole prevalence range on the
    paired per-person net benefit. Under the budget, though, community is only funded where prevalence is highest.'
  about:
    pair:
    - community
    - school
  direction: increases
  conditions:
  - feature: inc
    range:
    - 0.1186
    - 0.4759
  source_type: literature
  evidence:
  - citation: 'Pullan RL, Halliday KE, Oswald WE, et al. Effects, equity, and cost of school-based and community-wide
      treatment strategies for soil-transmitted helminths in Kenya: a cluster-randomised controlled trial. Lancet
      2019;393:2039-2050'
    location: Results, comparison of community-wide arms with school-based arm
  - citation: 'Clarke NE, Clements ACA, Doi SA, et al. Differential effect of mass and targeted anthelmintic drug
      administration on soil-transmitted helminth infections: a systematic review and meta-analysis. Lancet 2017;389:287-297'
    location: 'Abstract/Findings: community-wide vs child-targeted difference in prevalence reduction'
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B4
  mechanism: School beats no treatment on per-person net benefit in every district at the harness shadow price (benefit
    ~ prevalence x RRR_school >> lambda x US$0.25). This would not hold at a shadow price near 0.28 infection-years
    per USD (see OQ1), where low-prevalence districts could fall to none.
  about:
    pair:
    - school
    - none
  direction: increases
  conditions:
  - feature: inc
    range:
    - 0.1186
    - 0.4759
  source_type: literature
  evidence:
  - citation: Pullan RL, Smith JL, Jasrasaria R, Brooker SJ. Global numbers of infection and disease burden of soil
      transmitted helminth infections in 2010. Parasit Vectors 2014;7:37
    location: Results, DALYs and infection totals (basis of the harness shadow price)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B5
  mechanism: In a multiplicative rate model the relative reduction of a package does not depend on baseline prevalence;
    prevalence scales the absolute benefit only. (In the real system, transmission models predict larger relative
    gains from community-wide treatment where transmission is lower and bounce-back slower, and smaller ones at
    high transmission; over a one-year horizon this is second order.)
  about:
    package: community
    feature: inc
  direction: negligible
  source_type: literature
  evidence:
  - citation: Truscott JE, Hollingsworth TD, Brooker SJ, Anderson RM. Can chemotherapy alone eliminate the transmission
      of soil transmitted helminths? Parasit Vectors 2014;7:266
    location: Results on dependence of treatment impact on baseline transmission (R0); figure numbers not recalled
  confidence: medium
  decision_relevant: false
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B6
  mechanism: School-based treatment reaches only enrolled children, so its population relative reduction should
    rise with school enrolment; where enrolment is low, community gains relative to school. The engine card lists
    only baseline_rate as a unit attribute, so the engine may not carry this; if it does not, that is a structural
    gap bearing on low-enrolment districts.
  about:
    package: school
    feature: school_enrol
  direction: increases
  conditions:
  - feature: school_enrol
    range:
    - 0.54
    - 0.933
  source_type: literature
  evidence:
  - citation: Anderson RM, Truscott JE, Pullan RL, Brooker SJ, Hollingsworth TD. How effective is school-based deworming
      for the community-wide control of soil-transmitted helminths? PLoS Negl Trop Dis 2013;7:e2027
    location: Discussion of coverage of school-age children and non-enrolled children; page not recalled
  confidence: low
  decision_relevant: true
  citation_check:
