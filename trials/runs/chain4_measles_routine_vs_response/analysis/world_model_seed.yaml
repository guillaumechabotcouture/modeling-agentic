beliefs:
- id: B1
  mechanism: 'Threshold nonlinearity: RESPONSE removes ~77% of the 1-9 susceptibles and leaves infants and 10-14
    year olds; residual Reff falls below 1 in most districts, so wherever the baseline is supercritical its relative
    reduction in infections is near complete. The 42-day delay (~3.5 generations from one importation) commits few
    infections.'
  about:
    package: response
  direction: reduces
  magnitude:
    band:
    - 0.8
    - 1.0
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Ch. 2 and Ch. 5 (threshold and herd-immunity results); page not checked
  - citation: 'Vink MA, Bootsma MCJ, Wallinga J. Serial intervals of respiratory infectious diseases: a systematic
      review and analysis. Am J Epidemiol 2014'
    location: measles serial interval ~11-12 days (results table; table number not checked)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B2
  mechanism: ROUTINE protects only 1-4 year olds (infants stay susceptible) and leaves the whole 5-9 and 10-14 gaps;
    its residual Reff sits near 1 and is pushed above 1 as the 5-9 gap grows, so its relative reduction falls with
    gap_5_9. (In the subcritical tail the ratio can rise slightly, but the threshold crossing dominates.)
  about:
    package: routine
    feature: gap_5_9
  direction: decreases
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Ch. 5 (critical vaccination fraction); page not checked
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B3
  mechanism: Higher transmission (contact_rate calibration scale, i.e. R0 12-18) pushes ROUTINE's residual Reff
    above 1 more often while the baseline final size saturates, so ROUTINE's relative reduction decreases with contact_rate.
    Carried from chain2 B3 (undecided there).
  about:
    package: routine
    feature: contact_rate (calibration scale)
  direction: decreases
  source_type: literature
  evidence:
  - citation: Ma J, Earn DJD. Generality of the final size formula for an epidemic of a newly invading infectious
      disease. Bull Math Biol 2006
    location: final size relation; page not checked
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B4
  mechanism: 'The 10-14 gap is reached by neither option; it raises RESPONSE''s residual Reff toward 1 at high R0,
    so RESPONSE''s relative reduction decreases with gap_10_14 (weakly: the 10-14 gap is the smallest of the three).'
  about:
    package: response
    feature: gap_10_14
  direction: decreases
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Ch. 5; page not checked
  confidence: low
  decision_relevant: false
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B5
  mechanism: Where the 5-9 gap is large, ROUTINE alone leaves Reff above 1 and a major outbreak follows, while RESPONSE
    (which reaches 5-9) keeps it near or below 1; thousands more infections averted outweigh RESPONSE's extra US$0.80/resident
    (~0.0007 infections/resident at the shadow price), so RESPONSE wins on net benefit.
  about:
    pair:
    - response
    - routine
  direction: flips
  conditions:
  - feature: gap_5_9
    range:
    - 0.06
    - 0.16
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Ch. 5; page not checked
  - citation: 'Grais RF, Conlan AJK, Ferrari MJ, Djibo A, Le Menach A, Bjornstad ON, Grenfell BT. Time is of the
      essence: exploring a measles outbreak response vaccination in Niamey, Niger. J R Soc Interface 2008'
    location: response timing results; figure not checked
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B6
  mechanism: Where the 5-9 and 10-14 gaps are both small, ROUTINE alone brings Reff below 1; the residual is a stuttering
    chain of tens of infections from one importation, so RESPONSE's extra averted infections are worth far less
    than its extra cost and ROUTINE wins on net benefit. This is the rule's 'prevention in the youngest suffices'
    side.
  about:
    pair:
    - routine
    - response
  direction: none
  source_type: literature
  evidence:
  - citation: Blumberg S, Lloyd-Smith JO. Inference of R0 and transmission heterogeneity from the size distribution
      of stuttering chains. PLoS Comput Biol 2013
    location: mean chain size 1/(1-R) for subcritical chains; page not checked
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B7
  mechanism: Vaccine efficacy per child reached (all-or-nothing) scales the susceptibles removed; field effectiveness
    of one dose at 9+ months is ~85-95%. ROUTINE's relative reduction increases with efficacy:routine, most where
    its residual Reff is near 1 (which is where I expect it to be).
  about:
    package: routine
    feature: efficacy:routine
  direction: increases
  source_type: literature
  evidence:
  - citation: 'Uzicanin A, Zimmerman L. Field effectiveness of live attenuated measles-containing vaccines: a review
      of published literature. J Infect Dis 2011'
    location: pooled one-dose effectiveness; table not checked
  confidence: medium
  decision_relevant: false
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
open_questions:
- id: Q1
  question: What age structure does the engine use (share of residents aged <1, 1-4, 5-9, 10-14)? It sets the infant
    floor on Reff and where ROUTINE's residual Reff crosses 1, and so the location of the ROUTINE/RESPONSE flip.
  beliefs:
  - B2
  - B5
  - B6
  decision_relevant: true
- id: Q2
  question: Does ROUTINE's 'children under five' include infants as vaccinable, or are infants always susceptible?
    If infants are protected, ROUTINE's residual Reff falls by ~0.2-0.3 and it wins in many more districts.
  beliefs:
  - B2
  - B6
  decision_relevant: true
- id: Q3
  question: How large is the seed, and does the engine weight the final size by p_major? A larger seed or an expected-value
    outcome changes how much the 42-day delay costs RESPONSE and how small subcritical outcomes are.
  beliefs:
  - B1
  decision_relevant: true
- id: Q4
  question: 'Under the binding US$5M budget (RESPONSE everywhere would cost ~US$9M at ~7M residents), which districts
    get RESPONSE first? Not testable here: no optimised plan exists.'
  beliefs:
  - B5
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: RESPONSE's relative reduction in infections lies in [0.8, 1.0] at >= 70% of usable points.
  p: 0.6
  test:
    kind: effect_band
    package: response
    band:
    - 0.8
    - 1.0
    min_share: 0.7
- id: H2
  belief: B2
  claim: ROUTINE's relative reduction decreases as gap_5_9 rises (Spearman interval below 0).
  p: 0.62
  test:
    kind: effect_direction
    package: routine
    feature: gap_5_9
    direction: decreases
- id: H3
  belief: B3
  claim: ROUTINE's relative reduction decreases as the contact-rate calibration scale rises.
  p: 0.6
  test:
    kind: effect_direction
    package: routine
    feature: contact_rate (calibration scale)
    direction: decreases
- id: H4
  belief: B4
  claim: RESPONSE's relative reduction decreases as gap_10_14 rises.
  p: 0.45
  test:
    kind: effect_direction
    package: response
    feature: gap_10_14
    direction: decreases
- id: H5
  belief: B5
  claim: Where gap_5_9 is in [0.12, 0.1927], RESPONSE beats ROUTINE on net benefit at the shadow price at >= 60%
    of usable points.
  p: 0.55
  test:
    kind: paired_sign
    a: response
    b: routine
    feature: gap_5_9
    range:
    - 0.12
    - 0.1927
    sign: positive
    min_share: 0.6
- id: H6
  belief: B6
  claim: Where gap_5_9 is in [0.0202, 0.06] and gap_10_14 below 0.06, ROUTINE beats RESPONSE on net benefit at >=
    60% of usable points.
  p: 0.5
  test:
    kind: paired_sign
    a: routine
    b: response
    feature: gap_5_9
    range:
    - 0.0202
    - 0.06
    sign: positive
    min_share: 0.6
    where:
      gap_10_14:
      - 0.0114
      - 0.06
- id: H7
  belief: B5
  claim: The ROUTINE/RESPONSE transition along gap_5_9 lies within [0.06, 0.16].
  p: 0.4
  test:
    kind: flip_in
    a: response
    b: routine
    feature: gap_5_9
    range:
    - 0.06
    - 0.16
- id: H8
  belief: B7
  claim: ROUTINE's relative reduction increases with efficacy:routine.
  p: 0.6
