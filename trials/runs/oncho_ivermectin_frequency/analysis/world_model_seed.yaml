open_questions:
- id: Q1
  question: What is the ratio r_b / r_a of biannual to annual relative reduction in mf person-years over a 2-year
    window at about 75% coverage? Above about 1.83, upgrading high-prevalence units beats spreading annual treatment
    to more units; below it, spreading wins. No factorial or head-to-head trial reports this outcome directly.
  beliefs:
  - B1
  - B2
  - B4
  decision_relevant: true
- id: Q2
  question: Does the US$3M budget bind? That depends on the total population of the 24 units. If annual treatment
    for everyone fits with money left over, the leftover goes to biannual by descending inc.
  beliefs:
  - B4
  decision_relevant: true
- id: Q3
  question: Does the exogenous shadow price (6.5e-5 outcome per USD, derived from DALYs per mf person-year and a
    1x GDP threshold) match the budget's real opportunity cost? If not, the paired tests that favour biannual say
    nothing about the constrained allocation.
  beliefs:
  - B3
  decision_relevant: true
- id: Q4
  question: Does the 'inc' column measure skin-snip mf prevalence on the same estimand as the outcome (all-age mf-positive
    person-time)? Is there any baseline (pre-2026) treatment coverage that the engine's M(baseline coverage) divides
    out?
  beliefs:
  - B1
  - B4
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: Annual CDTI's relative reduction in mf person-years lies in 0.15-0.50 at most usable points.
  test:
    kind: effect_band
    package: annual
    band:
    - 0.15
    - 0.5
    min_share: 0.7
- id: H2
  belief: B2
  claim: Biannual CDTI's relative reduction in mf person-years lies in 0.30-0.70 at most usable points.
  test:
    kind: effect_band
    package: biannual
    band:
    - 0.3
    - 0.7
    min_share: 0.7
- id: H3
  belief: B3
  claim: At the shadow price, biannual's net benefit exceeds annual's across the whole inc range.
  test:
    kind: paired_sign
    a: biannual
    b: annual
    feature: inc
    range:
    - 0.1472
    - 0.5999
    sign: positive
    min_share: 0.9
- id: H4
  belief: B4
  claim: Annual's relative reduction does not vary with baseline prevalence (|rho| < 0.1).
  test:
    kind: effect_direction
    package: annual
    feature: inc
    direction: negligible
    equivalence: 0.1
- id: H5
  belief: B5
  claim: Biannual's relative reduction does not vary with vector density (|rho| < 0.1).
  test:
    kind: effect_direction
    package: biannual
    feature: vector_density
    direction: negligible
    equivalence: 0.1
- id: H6
  belief: B6
  claim: At the shadow price, annual's net benefit exceeds no treatment's at essentially every point.
  test:
    kind: paired_sign
    a: annual
    b: none
    feature: inc
    range:
    - 0.1472
    - 0.5999
    sign: positive
    min_share: 0.95
