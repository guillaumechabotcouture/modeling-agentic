- id: B6
  mechanism: 'Scale invariance: in a deterministic closed-population renewal model with seeding given as a share
    of the population, every outcome expressed per person (growth rate, peak week, attack rate, relative reduction)
    is independent of town population.'
  about:
    package: hygiene
    feature: pop
  direction: negligible
  source_type: literature
  evidence:
  - citation: Cori A, Ferguson NM, Fraser C, Cauchemez S. A new framework and software to estimate time-varying
      reproduction numbers during epidemics. Am J Epidemiol 2013
    location: renewal equation formulation (Methods); no population-size term
  confidence: high
  decision_relevant: false
  citation_check:
    confidence_claimed: high
    found: 1
