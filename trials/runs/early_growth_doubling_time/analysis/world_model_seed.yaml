open_questions:
- id: Q1
  question: What is R0 (withheld)? It sets R0*s0, hence whether low-s0 towns have any epidemic and how elastic the
    final size is to hygiene; the B2/B5 bands are wide mainly because of it.
  beliefs:
  - B1
  - B2
  - B4
  - B5
  - B8
  decision_relevant: true
- id: Q2
  question: How large is the hygiene multiplier's effect on R_t, and does the campaign run to the end of 2026 or
    stop? A temporary campaign mainly delays rather than averts infections.
  beliefs:
  - B2
  - B3
  - B7
  decision_relevant: true
- id: Q3
  question: Do the slowest epidemics (low s0) peak after 2026, so the in-year attack rate and averted infections
    depend on seed size more than the final-size argument suggests?
  beliefs:
  - B7
  - B8
  decision_relevant: true
- id: Q4
  question: Is a mild hygiene campaign's community effect on transmission comparable to the household/school trial
    effects on illness that anchor B2 (different outcome, setting and adherence)?
  beliefs:
  - B2
  decision_relevant: true
hypotheses:
- id: H1
  belief: B2
  claim: Across the sweep, hygiene averts 3-35% of 2026 infections relative to none in at least 70% of usable points;
    refuted if 30% or fewer fall in that band.
  test:
    kind: effect_band
    package: hygiene
    band:
    - 0.03
    - 0.35
    min_share: 0.7
- id: H2
  belief: B3
  claim: The relative reduction from hygiene increases with the hygiene effect parameter (Spearman 95% interval
    above 0); refuted if it is below 0.
  test:
    kind: effect_direction
    package: hygiene
    feature: effect:hygiene
    direction: increases
- id: H3
  belief: B4
  claim: The relative reduction from hygiene decreases as susceptibility s0 rises (final-size saturation); refuted
    if the rank correlation is significantly positive.
  test:
    kind: effect_direction
    package: hygiene
    feature: s0 (calibration scale)
    direction: decreases
    adjust_for:
    - effect:hygiene
- id: H4
  belief: B5
  claim: Where s0 is at least 0.85, hygiene averts 2-20% of infections in at least 70% of usable points; refuted
    if 30% or fewer fall in that band.
  test:
    kind: effect_band
    package: hygiene
    band:
    - 0.02
    - 0.2
    min_share: 0.7
    where:
      s0 (calibration scale):
      - 0.85
      - 0.9972519157454371
- id: H5
  belief: B6
  claim: Town population has no association with the hygiene relative reduction (|rho| 95% bound inside 0.15); refuted
    if the interval lies outside +/-0.15.
  test:
    kind: effect_direction
    package: hygiene
    feature: pop
    direction: negligible
    equivalence: 0.15
- id: H6
  belief: B7
  claim: The hygiene relative reduction decreases with seed share (earlier epidemics, more completed before and
    within the campaign window); refuted if significantly positive.
  test:
    kind: effect_direction
    package: hygiene
    feature: seed_share
    direction: decreases
