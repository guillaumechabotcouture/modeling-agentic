version: 0
beliefs:
- id: B1
  mechanism: Early growth rate r solves the Euler-Lotka relation 1 = R0*s0 * sum_k w_k exp(-r k) on the weekly generation
    grid (0.5, 0.4, 0.1; mean ~1.6 weeks); doubling time is ln2 / r. r rises with s0 and is independent of population
    size and of seed size. For R0*s0 around 1.5-2.5 this gives r of roughly 0.25-0.6 per week (doubling roughly
    1.2-3 weeks); it tends to zero (doubling time unbounded) as R0*s0 approaches 1.
  about:
    feature: s0 (calibration scale)
  direction: increases
  conditions:
  - feature: s0 (calibration scale)
    range:
    - 0.5044078105129302
    - 0.9972519157454371
  source_type: literature
  evidence:
  - citation: Wallinga J, Lipsitch M. How generation intervals shape the relationship between growth rates and reproductive
      numbers. Proc R Soc B 2007
    location: Eq. 2.7 and Section 2 (moment-generating-function relation); exact page not checked
  - citation: Fraser C. Estimating individual and household reproduction numbers in an emerging epidemic. PLoS ONE
      2007
    location: Methods, renewal equation; location not verified
  confidence: high
  decision_relevant: false
  citation_check:
    confidence_claimed: high
    found: 2
    not_found: 0
    lookup_failed: 0
- id: B2
  mechanism: Mild hygiene (hand hygiene / respiratory etiquette promotion) reduces respiratory infection transmission
    by a modest fraction; community trials and meta-analyses report roughly 15-20% fewer respiratory illnesses with
    intensive hand-hygiene programmes, so a 'mild' campaign plausibly cuts R_t by about 5-15%. Translated through
    the final-size relation for R0*s0 of roughly 1.3-2.5, the 2026 infections averted are roughly 3-35% of the no-campaign
    infections.
  about:
    package: hygiene
  direction: reduces
  magnitude:
    band:
    - 0.03
    - 0.35
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Aiello AE, Coulborn RM, Perez V, Larson EL. Effect of hand hygiene on infectious disease risk in
      the community setting: a meta-analysis. Am J Public Health 2008'
    location: 'Abstract / Results: ~21% reduction in respiratory illness with hand-hygiene interventions'
  - citation: Jefferson T, Dooley L, Ferroni E, et al. Physical interventions to interrupt or reduce the spread
      of respiratory viruses. Cochrane Database Syst Rev 2023
    location: Summary of findings, hand hygiene vs control (ARI RR about 0.84); value from memory, not re-checked
  confidence: low
  decision_relevant: true
  citation_check:
    confidence_claimed: low
    found: 2
    not_found: 0
    lookup_failed: 0
- id: B3
  mechanism: 'The relative reduction in infections increases monotonically with the hygiene multiplier''s effect:
    a larger cut in R_t lowers the final size more (and steeply so when it brings R_t close to 1).'
  about:
    package: hygiene
    feature: effect:hygiene
  direction: increases
  source_type: literature
  evidence:
  - citation: Ma J, Earn DJD. Generality of the final size formula for an infectious disease. Bull Math Biol 2006
    location: final size relation z = 1 - exp(-R0 z); general form, page not checked
  confidence: high
  decision_relevant: true
  citation_check:
    confidence_claimed: high
    found: 1
    not_found: 0
    lookup_failed: 0
- id: B4
  mechanism: 'Final-size elasticity: the same proportional cut in R_t averts a larger share of infections when the
    effective reproduction number R0*s0 is close to 1 (low susceptibility) and a smaller share when it is high (s0
    near 1), because the final size saturates at high R. So the hygiene relative reduction decreases as s0 rises.
    Where R0*s0 falls below 1 there is no epidemic and the point has no baseline burden (excluded).'
  about:
    package: hygiene
    feature: s0 (calibration scale)
  direction: decreases
  source_type: literature
  evidence:
  - citation: Ma J, Earn DJD. Generality of the final size formula for an infectious disease. Bull Math Biol 2006
    location: final size relation; page not checked
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press
      1991'
    location: Chapter 6 (final size); chapter location from memory
  confidence: medium
  decision_relevant: true
  citation_check:
    confidence_claimed: medium
    found: 2
    not_found: 0
    lookup_failed: 0
- id: B5
  mechanism: At high susceptibility (s0 above about 0.85) the epidemic is fast and the final size is saturated,
    so a mild campaign averts only a small share of infections, roughly 2-20%.
  about:
