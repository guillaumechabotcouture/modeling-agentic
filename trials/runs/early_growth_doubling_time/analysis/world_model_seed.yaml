    lookup_failed: 0
- id: B7
  mechanism: 'Timing: a larger seed share brings the epidemic forward (peak earlier by about ln(seed ratio)/r weeks,
    up to several weeks across the 50-fold seed range), so more of it happens before week 6 and, if the epidemic
    is slow, more of it completes within 2026. Both shrink the share a week-6 campaign averts; when the epidemic
    is still growing at year end, a campaign that delays it averts a larger in-year share. Expected effect: the
    relative reduction decreases weakly with seed share; small, because pre-week-6 infections are a tiny share for
    any plausible r.'
  about:
    package: hygiene
    feature: seed_share
  direction: decreases
  source_type: literature
  evidence:
  - citation: Handel A, Longini IM, Antia R. What is the best control strategy for multiple infectious disease outbreaks?
      Proc R Soc B 2007
    location: timing of control relative to epidemic peak; section not checked
  confidence: low
  decision_relevant: true
  citation_check:
    confidence_claimed: low
    found: 1
    not_found: 0
    lookup_failed: 0
- id: B8
  mechanism: 'Peak week and 2026 attack rate: attack rate follows the final-size relation in s0 (rises with s0,
    near zero as R0*s0 approaches 1, at most s0); peak week comes earlier with higher s0 and higher seed share.
    Slow epidemics (R0*s0 near 1) may not peak within 2026, so the in-year attack rate is below the final size there.'
  about:
    feature: s0 (calibration scale)
  direction: increases
  source_type: literature
  evidence:
  - citation: Kermack WO, McKendrick AG. A contribution to the mathematical theory of epidemics. Proc R Soc A 1927
    location: final size result; page not checked
  confidence: medium
  decision_relevant: false
  citation_check:
    confidence_claimed: medium
