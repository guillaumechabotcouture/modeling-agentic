    confidence_claimed: medium
open_questions:
- id: Q1
  question: How does the engine deliver COMMUNITY 70 days after seeding, when its card says interventions act before
    the epidemic? If it is applied at day 0, its timing penalty vanishes and COMMUNITY wins more often than B3/B4
    expect
  beliefs:
  - B2
  - B3
  - B4
  decision_relevant: true
- id: Q2
  question: What are the age-band population shares and infant share per district (s0_groups)? They set the susceptible
    counts each option can reach and so locate the flip
  beliefs:
  - B3
  - B4
  decision_relevant: true
- id: Q3
  question: Where does Reff without intervention sit relative to 1 across districts? Districts below threshold have
    no major epidemic, and there the cheaper SCHOOL or no action wins on cost alone
  beliefs:
  - B1
  - B3
  decision_relevant: true
- id: Q4
  question: Do the efficacy priors differ between the two delivery modes (seroconversion of a second dose at ages
    1-9 versus 5-14)? A sizeable difference would move the flip
  beliefs:
  - B3
  - B4
  decision_relevant: true
- id: Q5
  question: Does the US$5M budget bind? SCHOOL everywhere costs ~0.8 x total population; if that exceeds the budget,
    districts must be ranked by infections averted per dollar (relative burden times reduction)
  beliefs:
  - B1
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: SCHOOL averts 50-100% of infections relative to no action in at least 70% of usable points
  test:
    kind: effect_band
    package: school
    band:
    - 0.5
    - 1.0
    min_share: 0.7
- id: H2
  belief: B2
  claim: COMMUNITY's relative reduction decreases as seed_share rises; refuted if it increases or shows no reliable
    trend
  test:
    kind: effect_direction
    package: community
    feature: seed_share
    direction: decreases
- id: H3
  belief: B3
  claim: Where the under-five gap is small (gap_1_4 0.051-0.12), SCHOOL beats COMMUNITY on net benefit in at least
    75% of usable points
  test:
    kind: paired_sign
    a: school
    b: community
    feature: gap_1_4
    range:
    - 0.051
    - 0.12
    sign: positive
    min_share: 0.75
- id: H4
  belief: B4
  claim: The COMMUNITY/SCHOOL transition along gap_1_4 lies within 0.13-0.26
  test:
    kind: flip_in
    a: community
    b: school
    feature: gap_1_4
    range:
    - 0.13
    - 0.26
- id: H5
  belief: B5
  claim: SCHOOL's relative reduction increases with gap_10_14
  test:
    kind: effect_direction
    package: school
    feature: gap_10_14
    direction: increases
- id: H6
  belief: B6
  claim: SCHOOL's relative reduction is unrelated to district population (|rho| bound within 0.2)
  test:
    kind: effect_direction
    package: school
    feature: pop
    direction: negligible
    equivalence: 0.2
- id: H7
  belief: B7
  claim: COMMUNITY's relative reduction increases with gap_1_4
  test:
    kind: effect_direction
    package: community
    feature: gap_1_4
    direction: increases
