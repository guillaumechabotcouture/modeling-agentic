beliefs:
- id: B1
  mechanism: Removing ~90% of school-age susceptibles before seeding pushes Reff near or below 1 in most districts;
    near threshold the final size falls much faster than the susceptible share, so SCHOOL averts most infections
  about:
    package: school
  direction: reduces
  magnitude:
    band:
    - 0.5
    - 1.0
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Chapter 4 (final size relation); Chapter 5 (critical vaccination proportion)
  - citation: Ma J, Earn DJD. Generality of the final size formula for an epidemic of a newly invading infectious
      disease. Bulletin of Mathematical Biology, 2006
    location: final size equation, section 2
  - citation: 'Uzicanin A, Zimmerman L. Field effectiveness of live attenuated measles-containing vaccines: a review
      of published literature. Journal of Infectious Diseases, 2011'
    location: Results (median effectiveness by age of vaccination); location from memory, unsure
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 3
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B2
  mechanism: COMMUNITY acts 70 days after seeding; infections before then are not averted, so its relative reduction
    falls as the seeded share rises (more early infections, earlier peak)
  about:
    package: community
    feature: seed_share
  direction: decreases
  source_type: literature
  evidence:
  - citation: 'Vink MA, Bootsma MCJ, Wallinga J. Serial intervals of respiratory infectious diseases: a systematic
      review and analysis. American Journal of Epidemiology, 2014'
    location: Table 2 (measles serial interval about 11-12 days)
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Chapter 6 (epidemic growth and timing)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B3
  mechanism: Under homogeneous mixing the option removing more susceptibles earlier wins; SCHOOL wins where the
    under-five gap is small because COMMUNITY then removes fewer susceptibles and also acts late; COMMUNITY can
    win only where the gap is concentrated in ages 1-4
  about:
    pair:
    - school
    - community
    feature: gap_1_4
  direction: flips
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: 'Chapter 5 (homogeneous mixing: herd immunity depends on the susceptible fraction, not its age)'
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B4
  mechanism: The SCHOOL-to-COMMUNITY switch along gap_1_4 lies in the upper-middle of the sampled range (roughly
    0.13-0.26), shifted upward from the pure susceptible-count tie (~0.15) by COMMUNITY's 70-day delay; its location
    also depends on gap_5_9, gap_10_14 and seed_share, so it is blurred
  about:
    pair:
    - community
    - school
    feature: gap_1_4
  direction: flips
  conditions:
  - feature: gap_1_4
    range:
    - 0.13
    - 0.26
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Chapter 5; tie point is my own arithmetic, not from the text
  confidence: low
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B5
  mechanism: 'SCHOOL''s relative reduction rises with the school-age gap (gap_10_14): the larger the share of all
    susceptibles that sits in ages 10-14, the larger the share SCHOOL removes and the further it pushes Reff below
    threshold'
  about:
    package: school
    feature: gap_10_14
  direction: increases
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Chapter 4 (final size relation)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B6
  mechanism: District population size does not change per-capita relative reductions in a deterministic closed-population
    model with per-capita seeding
  about:
    package: school
    feature: pop
  direction: negligible
  source_type: literature
  evidence:
  - citation: Ma J, Earn DJD. Generality of the final size formula for an epidemic of a newly invading infectious
      disease. Bulletin of Mathematical Biology, 2006
    location: final size depends on R0 and initial susceptible fraction, not population size
  confidence: high
  decision_relevant: false
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: high
- id: B7
  mechanism: COMMUNITY's relative reduction rises with the under-five gap (gap_1_4), the age band only it reaches
  about:
    package: community
    feature: gap_1_4
  direction: increases
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press,
      1991'
    location: Chapter 4 (final size relation)
  confidence: medium
  decision_relevant: true
