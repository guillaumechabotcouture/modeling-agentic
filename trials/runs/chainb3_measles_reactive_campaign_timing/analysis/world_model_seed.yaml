    lookup_failed: 0
    confidence_claimed: low
open_questions:
- id: Q1
  question: How does the engine represent a campaign completed 14 or 42 days into a running epidemic, when its card
    says interventions act before the epidemic? If timing enters only through efficacy:late / reach:late, the seed_share
    dependence of B2 may be weak or absent.
  beliefs:
  - B2
  - B4
  - B7
  decision_relevant: true
- id: Q2
  question: What share of districts are subcritical or near threshold (R0 x s0 <= 1.2)? Only there can LATE or none
    beat EARLY.
  beliefs:
  - B4
  - B5
  - B6
  decision_relevant: true
- id: Q3
  question: With the budget binding (EARLY in all districts costs roughly twice US$4M), is it better to run LATE
    in more districts than EARLY in fewer? The budget's dual, not the DALY shadow price, governs that trade.
  beliefs:
  - B4
  decision_relevant: true
- id: Q4
  question: Are the seeded (already infected) individuals counted in the outcome? If so, they cap the relative reduction
    of both options in low-Reff districts.
  beliefs:
  - B1
  - B7
  decision_relevant: false
