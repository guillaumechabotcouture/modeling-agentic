    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B8
  mechanism: 'ENTRY beats doing nothing on net benefit almost everywhere at the declared shadow price: it averts
    a few percent of the population''s infections for US$0.90 per resident.'
  about:
    pair:
    - entry
    - none
    feature: s_5_9
  direction: increases
  source_type: literature
  evidence:
