open_questions:
- id: Q1
  question: What are the age shares of the population (under 5, 5-9, 10-14, adults) and the adult susceptible floor
    in each district? They set the size of each option's removable pool relative to the untargeted pool and hence
    whether any district can be pushed below Reff = 1.
  beliefs:
  - B1
  - B2
  - B3
  - B6
  decision_relevant: true
- id: Q2
  question: The homogeneous-mixing assumption ignores school-age assortative mixing (Mossong et al. PLoS Med 2008).
    With assortative mixing, school-age vaccination would have a larger indirect effect than estimated here; how
    much would that move SCHOOL vs ENTRY?
  beliefs:
  - B2
  - B6
  decision_relevant: true
- id: Q3
  question: With a binding US$4M budget (likely less than ENTRY in every district), does the budget's own shadow
    price favour ENTRY widely over SCHOOL in fewer districts? The declared lambda (3e-6) does not answer this, and
    no optimised plan will exist in this sweep.
  beliefs:
  - B6
  - B8
  decision_relevant: true
- id: Q4
  question: What one-dose efficacy does the engine use against infection (not disease)? Breakthrough mild varicella
    is common after one dose; protection against any infection may be lower than the ~81% against all varicella.
  beliefs:
  - B1
  - B2
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: 'ENTRY reduces season infections by 10-65% at most points: partial, because the under-5 pool keeps Reff
    above 1.'
  test:
    kind: effect_band
    package: entry
    band:
    - 0.1
    - 0.65
    min_share: 0.75
- id: H2
  belief: B2
  claim: SCHOOL reduces season infections by 20-90% at most points, more than ENTRY.
  test:
    kind: effect_band
    package: school
    band:
    - 0.2
    - 0.9
    min_share: 0.75
- id: H3
  belief: B3
  claim: SCHOOL's relative reduction falls as the unvaccinated under-5 susceptible share rises.
  test:
    kind: effect_direction
    package: school
    feature: s_u5
    direction: decreases
- id: H4
  belief: B4
  claim: ENTRY's relative reduction falls as the contact rate (R0) rises.
  test:
    kind: effect_direction
    package: entry
    feature: contact_rate (calibration scale)
    direction: decreases
- id: H5
  belief: B5
  claim: ENTRY's relative reduction rises with the 5-9 susceptible share.
  test:
    kind: effect_direction
    package: entry
    feature: s_5_9
    direction: increases
- id: H6
  belief: B6
  claim: At the declared shadow price SCHOOL beats ENTRY on net benefit at 80% or more of points across the s_10_14
    range.
  test:
    kind: paired_sign
    a: school
    b: entry
    feature: s_10_14
    range:
    - 0.082
    - 0.3457
    sign: positive
    min_share: 0.8
- id: H7
  belief: B7
  claim: The seed share has a negligible effect on SCHOOL's relative reduction (|rho| bound within 0.2).
  test:
    kind: effect_direction
    package: school
    feature: seed_share
    direction: negligible
    equivalence: 0.2
- id: H8
  belief: B8
  claim: ENTRY beats no vaccination on net benefit at 90% or more of points across the s_5_9 range.
  test:
    kind: paired_sign
    a: entry
    b: none
    feature: s_5_9
    range:
    - 0.1655
    - 0.5826
    sign: positive
    min_share: 0.9
