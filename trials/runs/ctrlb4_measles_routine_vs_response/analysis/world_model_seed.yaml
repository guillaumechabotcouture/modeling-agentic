- id: B7
  mechanism: Where the 5-9 immunity gap is large, ROUTINE (under-fives only) leaves Reff above 1 and averts a modest
    share, while RESPONSE reaches the 5-9 cohort before most transmission; its extra infections averted per resident
    outweigh its extra US$0.80 per resident at the declared shadow price, so RESPONSE has the higher net benefit
  about:
