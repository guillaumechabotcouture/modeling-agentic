beliefs:
- id: B1
  mechanism: Baseline burden (no intervention) is set by Reff = R0 x susceptible share; the per-capita final size
    is near zero below Reff 1 and rises steeply above it, so districts with larger immunity gaps carry most of the
    infections
  about:
    package: none
    feature: gap_5_9
  direction: increases
  conditions:
  - feature: gap_5_9
    range:
    - 0.0206
    - 0.1896
  source_type: literature
  evidence:
  - citation: Ma J, Earn DJD. Generality of the final size formula for an epidemic of a newly invading infectious
      disease. Bull Math Biol 2006
    location: final size relation, Section 2
  - citation: 'Guerra FM, Bolotin S, Lim G, et al. The basic reproduction number (R0) of measles: a systematic review.
      Lancet Infect Dis 2017'
    location: Results; R0 range reported, location uncertain
  confidence: high
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: high
- id: B2
  mechanism: ROUTINE removes about 60% x efficacy of susceptibles under five (infants included) but leaves every
    5-14 susceptible; where older-child gaps are small this pushes Reff below 1 and averts almost all infections,
    where they are large Reff stays above 1 and the relative reduction falls sharply
  about:
    package: routine
    feature: gap_5_9
  direction: decreases
  magnitude:
    band:
    - 0.2
    - 1.0
    scale: relative_reduction
  conditions:
  - feature: gap_5_9
    range:
    - 0.0206
    - 0.1896
  source_type: literature
  evidence:
  - citation: 'Uzicanin A, Zimmerman L. Field effectiveness of live attenuated measles-containing vaccines: a review
      of published literature. J Infect Dis 2011'
    location: 'Results: median VE by age at vaccination (about 84% before 12 months, about 92% at 12 months or later);
      exact table not recalled'
  - citation: Ma J, Earn DJD. Generality of the final size formula for an epidemic of a newly invading infectious
      disease. Bull Math Biol 2006
    location: final size relation, Section 2
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B3
  mechanism: 'RESPONSE at day 42 is early relative to the epidemic: with a ~12-day generation interval and Reff
    mostly 1-2, a single importation produces few cases in 3-4 generations, so the campaign acts almost like prevention
    over 85% of the 1-9 susceptibles; it misses infants and 10-14 year olds, so its relative reduction is high but
    falls where the 10-14 gap is large or Reff is high enough that the outbreak is well under way by day 42'
  about:
    package: response
    feature: gap_10_14
  direction: decreases
  magnitude:
    band:
    - 0.6
    - 0.98
    scale: relative_reduction
  conditions:
  - feature: gap_10_14
    range:
    - 0.0108
    - 0.1039
  source_type: literature
  evidence:
  - citation: 'Vink MA, Bootsma MCJ, Wallinga J. Serial intervals of respiratory infectious diseases: a systematic
      review and analysis. Am J Epidemiol 2014'
    location: Table of serial intervals; measles about 11-12 days
  - citation: 'Grais RF, Conlan AJK, Ferrari MJ, et al. Time is of the essence: exploring a measles outbreak response
      vaccination in Niamey, Niger. J R Soc Interface 2008'
    location: 'Results: cases averted fall with delay of the response; figure not recalled'
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B4
  mechanism: At the declared shadow price (0.00086 infections per US$) the extra US$0.80 per resident of RESPONSE
    costs only ~0.0007 infections per resident, far below the extra infections it averts wherever the 5-9 gap is
    material; ROUTINE wins only where both options avert nearly everything or the baseline outbreak is tiny
  about:
    pair:
    - response
    - routine
  direction: flips
  conditions:
  - feature: gap_5_9
    range:
    - 0.0206
    - 0.08
  source_type: literature
  evidence:
  - citation: 'Grais RF, Conlan AJK, Ferrari MJ, et al. Time is of the essence: exploring a measles outbreak response
      vaccination in Niamey, Niger. J R Soc Interface 2008'
    location: Discussion; reactive campaigns avert a substantial share when early
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B5
  mechanism: Relative reduction of each option rises with its vaccine efficacy, but saturates where the option already
    drives Reff well below 1
  about:
