open_questions:
- id: Q1
  question: What share of residents are infants and children 1-4, 5-9, 10-14 in each district? It sets s and how
    close each district sits to Reff 1, which decides where ROUTINE suffices.
  beliefs:
  - B1
  - B2
  decision_relevant: true
- id: Q2
  question: How fast does the outbreak grow before day 42 at the high end of R0 and gaps? If many infections occur
    before the campaign, RESPONSE loses its advantage in exactly the high-gap districts.
  beliefs:
  - B3
  - B4
  decision_relevant: true
- id: Q3
  question: Does ROUTINE's 60% reach count infants with lower efficacy (maternal antibody), and does RESPONSE waste
    doses on immune children (no targets_susceptible)?
  beliefs:
  - B2
  - B3
  decision_relevant: true
- id: Q4
  question: Does the US$5M budget bind? All-RESPONSE likely exceeds it, so the plan mixes options; the binding dual
    would be far above the declared shadow price and could favour ROUTINE in low-gap districts.
  beliefs:
  - B4
  decision_relevant: true
hypotheses:
- id: H1
  belief: B2
  claim: 'ROUTINE''s relative reduction in infections falls as the 5-9 immunity gap rises (adjusted design: gap_5_9
    sampled independently)'
  p: 0.72
  test:
    kind: effect_direction
    package: routine
    feature: gap_5_9
    direction: decreases
  weights:
    decreases: 0.72
    increases: 0.06
    no material effect: 0.22
- id: H2
  belief: B3
  claim: RESPONSE's relative reduction falls as the 10-14 gap rises, since that cohort is outside its age band
  p: 0.55
  test:
    kind: effect_direction
    package: response
    feature: gap_10_14
    direction: decreases
  weights:
    decreases: 0.55
    increases: 0.1
    no material effect: 0.35
- id: H3
  belief: B3
  claim: RESPONSE averts 60-98% of infections at at least 70% of usable points
  p: 0.5
  test:
    kind: effect_band
    package: response
    band:
    - 0.6
    - 0.98
    min_share: 0.7
- id: H4
  belief: B7
  claim: Where the 5-9 gap exceeds 0.10, RESPONSE beats ROUTINE on net benefit at the declared shadow price at >=
    75% of usable points
  p: 0.65
  test:
    kind: paired_sign
    a: response
    b: routine
    feature: gap_5_9
    range:
    - 0.1
    - 0.1896
    sign: positive
    min_share: 0.75
- id: H5
  belief: B4
  claim: The ROUTINE-to-RESPONSE transition along the 5-9 gap lies at low gaps, within 0.02-0.08
  p: 0.3
  test:
    kind: flip_in
    a: routine
    b: response
    feature: gap_5_9
    range:
    - 0.0206
    - 0.08
- id: H6
  belief: B5
  claim: RESPONSE's relative reduction rises with its efficacy draw, after adjusting for the district gaps and population
  p: 0.7
  test:
    kind: effect_direction
    package: response
    feature: efficacy:response
    direction: increases
    adjust_for:
    - gap_1_4
    - gap_5_9
    - gap_10_14
    - pop
  weights:
    increases: 0.7
    decreases: 0.03
    no material effect: 0.27
- id: H7
  belief: B6
  claim: ROUTINE's relative reduction does not depend on district population (|rho| bound within 0.2)
  p: 0.6
  test:
    kind: effect_direction
    package: routine
    feature: pop
    direction: negligible
    equivalence: 0.2
