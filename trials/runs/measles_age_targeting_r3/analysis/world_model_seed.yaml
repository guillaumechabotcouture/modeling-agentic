- id: B5
  mechanism: 'Choice between C and D at the shadow price: D costs roughly 2.5-3x C per district. It wins only where
    C leaves a major outbreak (high older-child gap, high R0). Where C already pushes Reff below 1, D''s extra infections
    averted are near zero, so C wins. The choice flips along susc_5_14y near the value where post-C Reff crosses
    1, shifted upward by the extra cost of D. That value is about 0.10-0.16 at mid R0 under my assumed age shares.'
  about:
    pair:
    - D_9mto14y
    - C_9to59m
  direction: flips
  conditions:
  - feature: susc_5_14y
    range:
    - 0.07
    - 0.17
  source_type: literature
  evidence:
  - citation: 'Verguet S, Johri M, Morris SK, et al. (2015). Controlling measles using supplemental immunization
      activities: a mathematical model to inform optimal policy. Vaccine'
    location: Results (location approximate)
  - citation: Funk S, Knapp JK, Lebo E, et al. (2019). Combining serological and contact data to derive target immunity
