open_questions:
- id: Q1
  question: 'Actual age-cohort population shares per district (pop_9_59m, pop_9m_14y vs pop): they set both the
    cost ratio D/C and the susceptibility weight of each gap, and so where the C/D flip falls.'
  beliefs:
  - B5
  - B2
  decision_relevant: true
- id: Q2
  question: What is the shadow price of the US$2.9M budget, and how many districts can afford D? A lower lambda
    moves the flip toward lower susc_5_14y.
  beliefs:
  - B5
  - B7
  - B8
  decision_relevant: true
- id: Q3
  question: Range of the sampled campaign efficacy (reach x protection); if it is well below 0.77, D may no longer
    bring Reff below 1 at high R0.
  beliefs:
  - B1
  decision_relevant: true
- id: Q4
  question: In districts already below the threshold before any campaign (Reff < 1), the baseline burden is only
    the seeded chain. Is any campaign worth its fixed cost there, compared with 'none'?
  beliefs:
  - B1
  - B5
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: Where the 9-59m gap is substantial, D_9mto14y brings Reff below 1 and averts 85-100% of infections in at
    least 70% of points.
  test:
    kind: effect_band
    package: D_9mto14y
    band:
    - 0.85
    - 1.0
    min_share: 0.7
- id: H2
  belief: B2
  claim: C_9to59m's relative reduction falls as susc_5_14y rises (Spearman interval below 0).
  test:
    kind: effect_direction
    package: C_9to59m
    feature: susc_5_14y
    direction: decreases
- id: H3
  belief: B3
  claim: C_9to59m's relative reduction falls as the contact-rate (R0) scale rises.
  test:
    kind: effect_direction
    package: C_9to59m
    feature: contact_rate (calibration scale)
    direction: decreases
- id: H4
  belief: B4
  claim: C_9to59m's relative reduction rises with susc_9_59m.
  test:
    kind: effect_direction
    package: C_9to59m
    feature: susc_9_59m
    direction: increases
- id: H5
  belief: B7
  claim: Where the older-child gap is below the flip zone (susc_5_14y <= 0.07), C_9to59m beats D_9mto14y on net
    benefit at the shadow price in at least 75% of points.
  test:
    kind: paired_sign
    a: C_9to59m
    b: D_9mto14y
    feature: susc_5_14y
    range:
    - 0.0135
    - 0.07
    sign: positive
    min_share: 0.75
- id: H6
  belief: B8
  claim: Where the older-child gap is large (susc_5_14y >= 0.16), D_9mto14y beats C_9to59m on net benefit at the
    shadow price in at least 70% of points.
  test:
    kind: paired_sign
    a: D_9mto14y
    b: C_9to59m
    feature: susc_5_14y
    range:
    - 0.16
    - 0.1953
    sign: positive
    min_share: 0.7
- id: H7
  belief: B5
  claim: The C/D choice flips along susc_5_14y between 0.07 and 0.17.
  test:
    kind: flip_in
    a: D_9mto14y
    b: C_9to59m
    feature: susc_5_14y
    range:
