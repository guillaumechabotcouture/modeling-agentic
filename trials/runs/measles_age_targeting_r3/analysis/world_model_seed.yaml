beliefs:
- id: B1
  mechanism: 'Final-size threshold: in a homogeneously mixing closed population seeded once, a major outbreak occurs
    only when R0 x susceptible share > 1, and its size rises steeply above 1. A campaign that pushes Reff below
    1 averts nearly all infections; one that leaves Reff above 1 averts a smaller share, but still more than its
    share of susceptibles removed (less overshoot).'
  about:
    package: D_9mto14y
  direction: reduces
  magnitude:
    band:
    - 0.85
    - 1.0
    scale: relative_reduction
  conditions:
  - feature: susc_9_59m
    range:
    - 0.25
    - 0.5394
  source_type: literature
  evidence:
  - citation: Ma J, Earn DJD (2006). Generality of the final size formula for an epidemic of a newly invading infectious
      disease. Bulletin of Mathematical Biology
    location: final size relation, Section 2 (location approximate)
  - citation: 'Anderson RM, May RM (1991). Infectious Diseases of Humans: Dynamics and Control. Oxford University
      Press'
    location: chapter on herd immunity and vaccination (location approximate)
  confidence: medium
  decision_relevant: true
  citation_check:
    confidence_claimed: medium
    found: 2
    not_found: 0
    lookup_failed: 0
- id: B2
  mechanism: C_9to59m leaves the 5-14y immunity gap in place. Where that gap is large, residual Reff after C stays
    above 1 and C's relative reduction falls well short of D's. Where the gap is small, C alone brings Reff below
    1. C's relative reduction therefore falls as susc_5_14y rises.
  about:
    package: C_9to59m
    feature: susc_5_14y
  direction: decreases
  magnitude:
    band:
    - 0.3
    - 1.0
    scale: relative_reduction
  conditions:
  - feature: susc_9_59m
    range:
    - 0.25
    - 0.5394
  source_type: literature
  evidence:
  - citation: Funk S, Knapp JK, Lebo E, et al. (2019). Combining serological and contact data to derive target immunity
      levels for achieving and maintaining measles elimination. BMC Medicine
    location: Results, age-specific immunity targets (location approximate)
  - citation: 'Verguet S, Johri M, Morris SK, et al. (2015). Controlling measles using supplemental immunization
      activities: a mathematical model to inform optimal policy. Vaccine'
    location: Results (location approximate)
  confidence: medium
  decision_relevant: true
  citation_check:
    confidence_claimed: medium
    found: 2
    not_found: 0
    lookup_failed: 0
- id: B3
  mechanism: A higher R0 (contact_rate scale) lowers the threshold susceptible share 1/R0 (0.10 at R0 10, 0.0625
    at R0 16), so C is less often enough on its own and its relative reduction falls as contact_rate rises.
  about:
    package: C_9to59m
    feature: contact_rate (calibration scale)
  direction: decreases
  conditions:
  - feature: susc_9_59m
    range:
    - 0.25
    - 0.5394
  source_type: literature
  evidence:
  - citation: 'Guerra FM, Bolotin S, Lim G, et al. (2017). The basic reproduction number (R0) of measles: a systematic
      review. The Lancet Infectious Diseases'
    location: Results, distribution of R0 estimates
  confidence: medium
  decision_relevant: false
  citation_check:
    confidence_claimed: medium
    found: 1
    not_found: 0
    lookup_failed: 0
- id: B4
  mechanism: A larger 9-59m gap means C removes a larger share of all susceptibles, so C's relative reduction rises
    with susc_9_59m (and the baseline epidemic is larger).
  about:
    package: C_9to59m
    feature: susc_9_59m
  direction: increases
  source_type: literature
  evidence:
