- id: B6
  mechanism: Infants under 9 months cannot be protected by either option and stay fully susceptible. They set a
    floor on post-campaign susceptibility (~0.02-0.03 of the population), which matters only at the top of the R0
    range.
  about:
    component: D_9mto14y
  direction: negligible
  source_type: literature
  evidence:
