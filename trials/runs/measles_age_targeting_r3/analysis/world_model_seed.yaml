- id: B7
  mechanism: 'Low older-child gap regime (below the B5 flip zone): with susc_5_14y small, C alone pushes post-campaign
    Reff below 1 at most R0 values, so D''s extra infections averted over C are near zero while D costs roughly
    2.5-3x C. At any positive shadow price C beats D on net benefit.'
  about:
