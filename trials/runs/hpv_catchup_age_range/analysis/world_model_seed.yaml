beliefs:
- id: B1
  mechanism: Vaccinating 80% of 9-14 year-olds removes roughly a third of the susceptible pool (most 9-14s are still
    uninfected); with indirect (herd) effects the final size of the epidemic falls by more than the direct share,
    by less at high transmission
  about:
    package: to14
  direction: reduces
  magnitude:
    band:
    - 0.35
    - 0.95
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Brisson M, et al. Population-level impact, herd immunity, and elimination after human papillomavirus
      vaccination: a systematic review and meta-analysis of predictions from transmission-dynamic models. Lancet
      Public Health 2016'
    location: Results, girls-only vaccination scenarios (figure on predicted reductions by coverage); exact figure
      number not recalled
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press
      1991'
    location: final-size relation z = 1 - exp(-R z); chapter on simple epidemics (page not recalled)
  confidence: low
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B2
  mechanism: TO26 removes roughly half or more of the susceptible pool; Reff falls near or below 1 in most settings,
    so the reduction is large and close to complete except at the highest transmission
  about:
    package: to26
  direction: reduces
  magnitude:
    band:
    - 0.65
    - 1.0
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press
      1991'
    location: final-size relation and critical vaccination fraction 1 - 1/R0 (page not recalled)
  confidence: low
  decision_relevant: false
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B3
  mechanism: 'Higher contact rate (higher R0) raises baseline burden but lowers the relative reduction of a fixed
    campaign: the remaining susceptibles are still infected at high Reff, and the herd effect that amplifies the
    direct protection weakens'
  about:
    package: to14
    feature: contact_rate (calibration scale)
  direction: decreases
  source_type: literature
  evidence:
  - citation: 'Brisson M, et al. Population-level impact, herd immunity, and elimination after human papillomavirus
      vaccination: a systematic review and meta-analysis of predictions from transmission-dynamic models. Lancet
      Public Health 2016'
    location: herd effects and elimination predicted at high coverage; the dependence on transmission is from model
      structure, page not recalled
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B4
  mechanism: 'Extending to 15-19 pays only where to14 alone leaves the epidemic above threshold: at low contact
    rate to14 already drives Reff below 1 and the extra US$0.70 per resident averts little, so to14 beats to19;
    above a threshold contact rate to19 wins. The flip is located in the lower part of the contact-rate range (rough,
    low confidence)'
  about:
    pair:
    - to19
    - to14
    feature: contact_rate (calibration scale)
  direction: flips
  conditions:
  - feature: contact_rate (calibration scale)
    range:
    - 6.129090587608516
    - 9.5
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press
      1991'
    location: threshold behaviour of the final size near R = 1 (page not recalled)
  confidence: low
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B5
  mechanism: 'At high transmission the full catch-up (to26) beats to14 at the shadow price: per US$ the incremental
    15-26 doses still avert far more than 0.00046 persistent infections, because the epidemic is not stopped by
    to14 and each susceptible removed averts most of an infection'
  about:
    pair:
    - to26
    - to14
    feature: contact_rate (calibration scale)
  direction: increases
  conditions:
  - feature: contact_rate (calibration scale)
    range:
    - 10.5
    - 14.895772559568286
  source_type: literature
  evidence:
  - citation: 'Drolet M, et al. Population-level impact and herd effects following the introduction of human papillomavirus
      vaccination programmes: updated systematic review and meta-analysis. Lancet 2019'
    location: results by catch-up age (multi-cohort vs single cohort) for HPV16/18 prevalence; table number not
      recalled
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B6
  mechanism: 'The value of the 20-26 increment scales with the share of 20-26 year-olds still uninfected (s0_20_26):
    doses to those already infected are wasted, so where s0_20_26 is high to26 beats to19 at the shadow price'
  about:
    pair:
    - to26
    - to19
    feature: s0_20_26
  direction: increases
  conditions:
  - feature: s0_20_26
    range:
    - 0.55
    - 0.7432
  source_type: literature
  evidence:
  - citation: 'Paavonen J, et al. Efficacy of human papillomavirus (HPV)-16/18 AS04-adjuvanted vaccine against cervical
      infection and precancer caused by oncogenic HPV types (PATRICIA): final analysis of a double-blind, randomised
      study in young women. Lancet 2009'
    location: efficacy high in HPV-naive women and much lower in the total vaccinated cohort including prior exposure
      (results; table not recalled)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B7
  mechanism: 'The 15-19 increment pays where 15-19 year-olds are still mostly uninfected (s0_15_19 high): to19 beats
    to14 at the shadow price there'
  about:
    pair:
    - to19
    - to14
    feature: s0_15_19
  direction: increases
  conditions:
  - feature: s0_15_19
    range:
    - 0.65
    - 0.8993
  source_type: literature
  evidence:
  - citation: FUTURE II Study Group. Quadrivalent vaccine against human papillomavirus to prevent high-grade cervical
      lesions. N Engl J Med 2007
    location: per-protocol (HPV-naive) vs intention-to-treat efficacy (results; table not recalled)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 0
    not_found: 1
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B8
  mechanism: 'Relative reduction rises with vaccine efficacy against infection among the susceptible reached (trials:
    near-complete protection against HPV16/18 persistent infection in naive women)'
  about:
    package: to14
    feature: efficacy:to14
  direction: increases
  source_type: literature
  evidence:
