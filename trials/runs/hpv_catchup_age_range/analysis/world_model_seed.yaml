open_questions:
- id: Q1
  question: What share of residents are aged 9-14, 15-19 and 20-26, and does the engine model only these cohorts
    or the whole population? This sets the direct share removed and so every band.
  beliefs:
  - B1
  - B2
  decision_relevant: true
- id: Q2
  question: Is the R0 range 1.2-3.0 defined in a fully susceptible population or already net of prior infection?
    If net, many provinces sit near threshold and to14 suffices.
  beliefs:
  - B3
  - B4
  - B5
  decision_relevant: true
- id: Q3
  question: Does the budget bind hard enough that the true dual is far above the declared shadow price (0.00046
    per US$)? At the declared price nearly every campaign pays; a binding US$20M budget favours to14 spread across
    provinces over to26 in a few.
  beliefs:
  - B5
  - B6
  - B7
  decision_relevant: true
- id: Q4
  question: Are doses targeted to susceptibles (targets_susceptible) or wasted on the already infected? This decides
    how strongly s0_15_19 and s0_20_26 drive the extension.
  beliefs:
  - B6
  - B7
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: TO14 reduces persistent infections by 35-95% relative to none in most usable points
  test:
    kind: effect_band
    package: to14
    band:
    - 0.35
    - 0.95
    min_share: 0.7
- id: H2
  belief: B2
  claim: TO26 reduces persistent infections by 65-100% relative to none in most usable points
  test:
    kind: effect_band
    package: to26
    band:
    - 0.65
    - 1.0
    min_share: 0.7
- id: H3
  belief: B3
  claim: TO14's relative reduction decreases as the contact rate rises
  test:
    kind: effect_direction
    package: to14
    feature: contact_rate (calibration scale)
    direction: decreases
- id: H4
  belief: B4
  claim: The to19-vs-to14 choice flips in the lower part of the contact-rate range (to14 wins below, to19 above)
  test:
    kind: flip_in
    a: to19
    b: to14
    feature: contact_rate (calibration scale)
    range:
    - 6.129090587608516
    - 9.5
- id: H5
  belief: B5
  claim: At high contact rates to26 beats to14 in net benefit at the shadow price in at least 80% of usable points
  test:
    kind: paired_sign
    a: to26
    b: to14
    feature: contact_rate (calibration scale)
    range:
    - 10.5
    - 14.895772559568286
    sign: positive
    min_share: 0.8
- id: H6
  belief: B6
  claim: Where s0_20_26 is high, to26 beats to19 in net benefit in at least 70% of usable points
  test:
    kind: paired_sign
    a: to26
    b: to19
    feature: s0_20_26
    range:
    - 0.55
    - 0.7432
    sign: positive
    min_share: 0.7
- id: H7
  belief: B7
  claim: Where s0_15_19 is high, to19 beats to14 in net benefit in at least 70% of usable points
  test:
    kind: paired_sign
    a: to19
    b: to14
    feature: s0_15_19
    range:
    - 0.65
    - 0.8993
    sign: positive
    min_share: 0.7
- id: H8
  belief: B8
  claim: TO14's relative reduction increases with its efficacy
  test:
    kind: effect_direction
    package: to14
    feature: efficacy:to14
    direction: increases
