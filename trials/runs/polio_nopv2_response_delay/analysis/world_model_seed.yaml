beliefs:
- id: B1
  mechanism: 'A FAST campaign (two nOPV2 rounds from week 4) brings R_t below 1 in most settings and therefore averts
    most 2026 type 2 infections: very few infections occur in the first 4 weeks when the seed is 1e-6 to 1e-4 of
    the population. The share averted is lower where R0 x s0 is so high that (1 - effect) x R0 x s0 stays above
    1, or where the engine''s intervention period ends well before the end of 2026 and transmission resumes.'
  about:
    package: fast
  direction: reduces
  magnitude:
    band:
    - 0.6
    - 1.0
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: "S\xE1ez-Llorens X et al. Safety and immunogenicity of two novel type 2 oral poliovirus vaccine candidates\
      \ compared with a monovalent type 2 oral poliovirus vaccine in children and infants: two clinical trials.\
      \ Lancet 2021"
    location: Results (type 2 seroconversion after one and two doses); exact table not verified
  - citation: 'Cooper LV et al. Risk factors for the spread of vaccine-derived type 2 polioviruses after global
      withdrawal of trivalent oral poliovirus vaccine and the effects of outbreak responses with monovalent vaccine:
      a retrospective analysis of surveillance data for 51 countries in Africa. Lancet Infect Dis 2022'
    location: Results, effect of mOPV2 response campaigns on subsequent detection; table not verified
  confidence: low
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 1
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B2
  mechanism: 'The relative reduction from a STANDARD (week-12) campaign falls as seed_share rises: a larger seed
    means the outbreak is further along by week 12, so more of the year''s infections occur before the campaign
    can act. The effect is strongest where R0 x s0 is high (fast growth).'
  about:
    package: standard
    feature: seed_share
  direction: decreases
  source_type: literature
  evidence:
  - citation: 'Fine PE, Carneiro IA. Transmissibility and persistence of oral polio vaccine viruses: implications
      for the global poliomyelitis eradication initiative. Am J Epidemiol 1999'
    location: estimates of R0 and serial interval for poliovirus; table not verified
  - citation: Cori A, Ferguson NM, Fraser C, Cauchemez S. A new framework and software to estimate time-varying
      reproduction numbers during epidemics. Am J Epidemiol 2013
    location: renewal equation, Methods
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B3
  mechanism: With a per-capita seed and frequency-dependent transmission in a closed deterministic population, the
    attack rate and the relative reduction from either campaign do not depend on district population; pop scales
    burden and cost proportionally and only matters for how the budget is packed.
  about:
    package: fast
    feature: pop
  direction: negligible
  source_type: literature
  evidence:
  - citation: Kermack WO, McKendrick AG. A contribution to the mathematical theory of epidemics. Proc R Soc Lond
      A 1927
    location: final-size relation (depends on R0 and initial susceptible share, not on N)
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press
      1991'
    location: Chapter 2 (frequency-dependent transmission); chapter location approximate
  confidence: high
  decision_relevant: false
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: high
- id: B4
  mechanism: 'FAST beats STANDARD on net benefit at the declared shadow price where the seed is large: the infections
    occurring between week 4 and week 12 (plus the extra depletion they cause) exceed the US$0.50 per resident price
    difference valued at the shadow price (about 5e-6 infections per person), which holds whenever an outbreak grows
    appreciably before week 12.'
  about:
    pair:
    - fast
    - standard
  direction: increases
  conditions:
  - feature: seed_share
    range:
    - 3.0e-05
    - 9.577e-05
  source_type: literature
  evidence:
  - citation: 'Cooper LV et al. Risk factors for the spread of vaccine-derived type 2 polioviruses after global
      withdrawal of trivalent oral poliovirus vaccine and the effects of outbreak responses with monovalent vaccine:
      a retrospective analysis of surveillance data for 51 countries in Africa. Lancet Infect Dis 2022'
    location: Results on timeliness/effect of outbreak response; table not verified
  - citation: Blake IM et al. Type 2 poliovirus detection after global withdrawal of trivalent oral vaccine. N Engl
      J Med 2018
    location: Results, risk of further detections by response timing; location not verified
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B5
  mechanism: 'The relative reduction from a STANDARD campaign falls as the susceptible share s0 rises: higher R0
    x s0 means faster growth, so more of the outbreak occurs before week 12, and a fixed (1 - effect) multiplier
    is less likely to bring R_t below 1. Below the epidemic threshold (R0 x s0 < 1) burden is tiny and the relative
    reduction is set by how much of a short, decaying chain remains at week 12.'
  about:
    package: standard
    feature: s0 (calibration scale)
  direction: decreases
  source_type: literature
  evidence:
  - citation: 'Anderson RM, May RM. Infectious Diseases of Humans: Dynamics and Control. Oxford University Press
      1991'
    location: threshold and growth-rate relations; chapter location approximate
  - citation: 'Fine PE, Carneiro IA. Transmissibility and persistence of oral polio vaccine viruses: implications
      for the global poliomyelitis eradication initiative. Am J Epidemiol 1999'
    location: R0 estimates; table not verified
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B6
  mechanism: 'The FAST vs STANDARD choice flips along s0: where s0 is low enough that the outbreak barely grows
    (R0 x s0 near or below 1), both options avert almost the same, tiny number of infections and the cheaper STANDARD
    wins on net benefit; above the threshold FAST wins. The threshold location depends on the engine''s R0, which
    is withheld; for an R0 of about 2 to 2.5 it lies in the lower part of the sampled s0 range. Location very uncertain.'
  about:
    pair:
    - fast
    - standard
  direction: flips
  conditions:
  - feature: s0 (calibration scale)
    range:
    - 0.4037627246230841
    - 0.6
  source_type: literature
  evidence:
  - citation: 'Fine PE, Carneiro IA. Transmissibility and persistence of oral polio vaccine viruses: implications
      for the global poliomyelitis eradication initiative. Am J Epidemiol 1999'
    location: R0 estimates; table not verified
  confidence: low
  decision_relevant: true
  citation_check:
