    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
open_questions:
- id: Q1
  question: Does the engine's campaign effect last to the end of 2026 or only over a declared period after which
    R_t returns to R0 x S_t? A multiplier on R_t removes no susceptibles, so a short period would only delay the
    outbreak and relative reductions (and the value of FAST) would be much smaller than B1 assumes.
  beliefs:
  - B1
  - B2
  - B4
  decision_relevant: true
- id: Q2
  question: What is the engine's R0 and generation interval for cVDPV2? Together with s0 they set the growth per
    week and hence how much of the outbreak the 8-week delay forfeits, and where the epidemic threshold lies in
    s0.
  beliefs:
  - B2
  - B5
  - B6
  decision_relevant: true
- id: Q3
  question: Do the effect priors differ between FAST and STANDARD (same vaccine, two rounds each), or only the start
    week? If effect:standard is drawn independently of effect:fast, some draws may make STANDARD stronger for reasons
    unrelated to timing.
  beliefs:
  - B1
  - B4
  decision_relevant: true
- id: Q4
  question: The declared shadow price (1e-5 outcome per USD, i.e. about US$100,000 per infection averted) is far
    below the value implied by the basis text's own arithmetic (0.01 DALY x US$1,000 per DALY, about US$10 per infection).
    Under a binding US$15M budget the real dual could be much larger, which would favour STANDARD (more districts
    covered per dollar) where the delay costs little. Which value does the optimiser's budget dual take?
  beliefs:
  - B4
  - B6
  decision_relevant: true
- id: Q5
  question: How uncertain is the type 2 susceptible share by district (s0), and is it correlated with seed_share
    in the data? High-s0, high-seed districts are where FAST pays; if they coincide the delay cost is concentrated
    there.
  beliefs:
  - B2
  - B5
  decision_relevant: true
hypotheses:
- id: H1
  belief: B1
  claim: FAST averts at least 60% of 2026 type 2 infections relative to no campaign in at least 60% of usable points.
    Refuted if 40% or more of points fall outside [0.6, 1.0] (for example because the effect period ends early).
  test:
    kind: effect_band
    package: fast
    band:
    - 0.6
    - 1.0
    min_share: 0.6
- id: H2
  belief: B2
  claim: STANDARD's relative reduction decreases with seed_share (Spearman interval below 0). Refuted if it increases;
    inconclusive if the interval crosses 0.
  test:
    kind: effect_direction
    package: standard
    feature: seed_share
    direction: decreases
- id: H3
  belief: B3
  claim: 'FAST''s relative reduction does not depend on district population: the rank correlation''s 95% interval
    lies within +/-0.1. Refuted if it lies outside.'
  test:
    kind: effect_direction
    package: fast
    feature: pop
    direction: negligible
    equivalence: 0.1
- id: H4
  belief: B4
  claim: In districts with seed_share of 3e-5 or more, FAST beats STANDARD on net benefit at the shadow price in
    at least 80% of usable points. Refuted if STANDARD wins in at least 80%.
  test:
    kind: paired_sign
    a: fast
    b: standard
    feature: seed_share
    range:
    - 3.0e-05
    - 9.577e-05
    sign: positive
    min_share: 0.8
- id: H5
  belief: B5
  claim: STANDARD's relative reduction decreases with s0, adjusted for the two campaign-effect draws. Refuted if
    it increases.
  test:
    kind: effect_direction
    package: standard
    feature: s0 (calibration scale)
    direction: decreases
    adjust_for:
    - effect:standard
    - effect:fast
- id: H6
  belief: B6
  claim: The FAST/STANDARD transition along s0 lies in the lower part of the sampled range, s0 0.40 to 0.60 (STANDARD
    below it, FAST above). Refuted if the located transition lies entirely above 0.60; inconclusive if FAST wins
    everywhere (one-sided).
  test:
    kind: flip_in
    a: fast
    b: standard
    feature: s0 (calibration scale)
    range:
    - 0.4037627246230841
    - 0.6
    scope: marginal
