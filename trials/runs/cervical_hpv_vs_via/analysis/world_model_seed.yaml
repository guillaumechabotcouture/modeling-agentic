open_questions:
- id: Q1
  question: What advanced-cancer RR does the engine's VIA prior encode (Tamil Nadu-type ~0.75 or Osmanabad-type
    near 1)? Its size decides whether VIA is ever chosen over HPV or none.
  beliefs:
  - B2
  - B5
  - B6
  decision_relevant: true
- id: Q2
  question: Where does the shadow price sit, i.e. how many women the US$4M covers; this locates both the none/VIA
    and VIA/HPV cut-offs on adv_rate.
  beliefs:
  - B5
  - B6
  - B7
  decision_relevant: true
- id: Q3
  question: Are the costs per woman screened or per woman in the target group (coverage, treatment and follow-up
    of positives, HPV positivity higher where HIV is high)? HIV-related positivity would raise HPV's real cost per
    woman in high-HIV districts.
  beliefs:
  - B4
  - B5
  decision_relevant: true
- id: Q4
  question: Does the adv_rate baseline already include any existing opportunistic screening? If so the trial RRs
    (vs no screening) would double count.
  beliefs:
  - B1
  - B2
  decision_relevant: true
- id: Q5
  question: Is an 8-year window enough for the single round's effect to be at its trial size (trial follow-up was
    ~8 years), or is part of the benefit after 2033?
  beliefs:
  - B1
  - B2
  decision_relevant: false
hypotheses:
- id: H1
  belief: B1
  claim: HPV's relative reduction in advanced cancer lies within the Osmanabad trial's 95% interval at most design
    points
  test:
    kind: effect_band
    package: hpv
    band:
    - 0.31
    - 0.68
    min_share: 0.8
- id: H2
  belief: B2
  claim: VIA's relative reduction in advanced cancer lies between 5% and 40% at most design points
  test:
    kind: effect_band
    package: via
    band:
    - 0.05
    - 0.4
    min_share: 0.75
- id: H3
  belief: B3
  claim: HPV's relative reduction does not vary with the district baseline rate (multiplicative RR)
  test:
    kind: effect_direction
    package: hpv
    feature: adv_rate
    direction: negligible
    equivalence: 0.15
- id: H4
  belief: B4
  claim: VIA's relative reduction does not vary with HIV prevalence in the sweep (engine does not read hiv)
  test:
    kind: effect_direction
    package: via
    feature: hiv
    direction: negligible
    equivalence: 0.15
- id: H5
  belief: B5
  claim: In the highest-burden districts HPV has higher net benefit than VIA at the shadow price
  test:
    kind: paired_sign
    a: hpv
    b: via
    feature: adv_rate
    range:
    - 0.0004
    - 0.000593
    sign: positive
    min_share: 0.6
- id: H6
  belief: B6
  claim: The VIA/HPV switch along adv_rate lies between 0.0002 and 0.00045 per woman-year
  test:
    kind: flip_in
    a: via
    b: hpv
    feature: adv_rate
    range:
    - 0.0002
    - 0.00045
- id: H7
  belief: B7
  claim: In high-burden districts VIA has higher net benefit than no screening at the shadow price
  test:
    kind: paired_sign
    a: via
    b: none
    feature: adv_rate
    range:
    - 0.00035
    - 0.000593
    sign: positive
    min_share: 0.8
