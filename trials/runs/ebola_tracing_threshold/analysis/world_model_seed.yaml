beliefs:
- id: B1
  mechanism: TRACE80 pushes R_t = R0 * s0 * (1 - effect) below 1 across almost all of the s0 range, so in 2026 it
    averts nearly all infections that would occur after week 2 relative to passive isolation; what remains is the
    in-flight infections of the first two weeks and the subcritical tail of each chain.
  about:
    package: trace80
  direction: reduces
  magnitude:
    band:
    - 0.75
    - 0.99
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: Fraser C, Riley S, Anderson RM, Ferguson NM. Factors that make an infectious disease outbreak controllable.
      PNAS 2004
    location: Figure 1 and the isolation/tracing control condition in the main text (location approximate)
  - citation: Klinkenberg D, Fraser C, Heesterbeek H. The effectiveness of contact tracing in emerging epidemics.
      PLoS ONE 2006
    location: Results, effective reproduction number under tracing (location approximate)
  - citation: WHO Ebola Response Team. Ebola virus disease in West Africa - the first 9 months of the epidemic and
      forward projections. N Engl J Med 2014
    location: Table 2 (R0 estimates ~1.7-2.0, serial interval ~15 days)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 3
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B2
  mechanism: 'TRACE50''s relative reduction falls as the susceptible share rises: below s0 ~ 0.75 it makes R_t subcritical
    and averts most infections; above it R_t stays above 1 and the outbreak continues, slower, so it averts only
    the part of the attack rate that the slower growth defers past the end of 2026 plus the final-size reduction.'
  about:
    package: trace50
    feature: s0 (calibration scale)
  direction: decreases
  magnitude:
    band:
    - 0.3
    - 0.9
    scale: relative_reduction
  source_type: literature
  evidence:
  - citation: Ma J, Earn DJD. Generality of the final size formula for an epidemic of a newly invading infectious
      disease. Bull Math Biol 2006
    location: final size relation, main result (location approximate)
  - citation: Fraser C, Riley S, Anderson RM, Ferguson NM. Factors that make an infectious disease outbreak controllable.
      PNAS 2004
    location: Figure 1 (location approximate)
  confidence: medium
  decision_relevant: true
  citation_check:
    found: 2
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B3
  mechanism: 'The TRACE50/TRACE80 choice flips along s0: where TRACE50 already controls (low s0) the extra cost
    of TRACE80 buys only a small subcritical tail and TRACE50 wins at any plausible shadow price; where TRACE50
    leaves R_t > 1 (high s0) TRACE80 averts tenths of an infection per resident for US$2.50 and wins. The flip sits
    near the s0 at which TRACE50''s R_t crosses 1, shifted by the shadow price and by the seed share.'
  about:
    pair:
    - trace50
    - trace80
    feature: s0 (calibration scale)
  direction: flips
  conditions:
  - feature: s0 (calibration scale)
    range:
    - 0.68
    - 0.92
  source_type: literature
  evidence:
  - citation: Fraser C, Riley S, Anderson RM, Ferguson NM. Factors that make an infectious disease outbreak controllable.
      PNAS 2004
    location: Figure 1 (location approximate)
  - citation: Hellewell J, Abbott S, Gimma A, et al. Feasibility of controlling COVID-19 outbreaks by isolation
      of cases and contacts. Lancet Glob Health 2020
    location: Figure 3, controllability by share of contacts traced and R0 (location approximate)
  confidence: low
  decision_relevant: true
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 1
    confidence_claimed: low
- id: B4
  mechanism: A larger initial infected share brings a supercritical epidemic closer to completion within 2026, so
    the deferral part of TRACE50's benefit shrinks and its relative reduction falls; under subcritical control the
    outcome scales with the seed, so the relative reduction changes less.
  about:
    package: trace50
    feature: seed_share
  direction: decreases
  source_type: literature
  evidence:
  - citation: Wallinga J, Lipsitch M. How generation intervals shape the relationship between growth rates and reproductive
      numbers. Proc R Soc B 2007
    location: growth rate - R relation, main text (location approximate)
  confidence: low
  decision_relevant: false
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: low
- id: B5
  mechanism: District population does not change per-resident outcomes or per-resident costs in a homogeneous closed-population
    renewal model; it only scales totals (and so the share of the budget a district takes).
  about:
    package: trace80
    feature: pop
  direction: negligible
  source_type: literature
  evidence:
  - citation: Fraser C. Estimating individual and household reproduction numbers in an emerging epidemic. PLoS ONE
      2007
    location: renewal equation formulation (location approximate)
  confidence: medium
  decision_relevant: false
  citation_check:
    found: 1
    not_found: 0
    not_a_citation: 0
    lookup_failed: 0
    confidence_claimed: medium
- id: B6
  mechanism: 'TRACE50 beats passive isolation almost everywhere at US$1.50 per resident: even where it does not
    control, it slows growth and defers a large part of the attack rate. Only at low s0 with a very small seed,
    where the uncontrolled outbreak itself grows slowly and stays small in 2026, could the infections averted per
    dollar fall below the shadow price.'
  about:
    pair:
    - trace50
    - none
  direction: reduces
  source_type: literature
  evidence:
  - citation: Kucharski AJ, Camacho A, Checchi F, et al. Measuring the impact of Ebola control measures in Sierra
      Leone. PNAS 2015
    location: Figure 3, infections averted by added control capacity (location approximate)
  confidence: low
  decision_relevant: true
  citation_check:
    found: 0
    not_found: 0
    not_a_citation: 0
    lookup_failed: 1
    confidence_claimed: low
open_questions:
- id: Q1
  question: What share of transmission does each tracing intensity remove (effect:trace50, effect:trace80)? No randomised
    trial exists; values come from modelling and outbreak reconstructions. Whether TRACE50 alone gets R_t below
    1 at s0 ~ 0.8-1.0 decides where TRACE80 is worth its cost.
  beliefs:
  - B2
  - B3
  decision_relevant: true
- id: Q2
  question: What is the true susceptible share per district (survey s0_survey versus the 0.6-1.0 calibration scale)?
    It ranks districts for TRACE80; a survey that undercounts prior infection would move districts across the flip.
  beliefs:
  - B2
  - B3
  decision_relevant: true
- id: Q3
  question: Does the budget bind (does TRACE50 everywhere plus TRACE80 in high-s0 districts exceed US$25M)? If it
    binds, the shadow price sets the flip; if not, TRACE80 wins wherever it averts any infections.
  beliefs:
  - B3
  - B6
  decision_relevant: true
- id: Q4
  question: Does tracing start at week 2 in all districts equally, and how many generations are already in flight?
    High seed shares make the pre-intervention infections a larger part of the 2026 total.
  beliefs:
  - B1
  - B4
  decision_relevant: false
hypotheses:
- id: H1
  belief: B1
  claim: TRACE80's relative reduction in 2026 infections versus passive isolation lies in 0.75-0.99 at >= 70% of
    points.
  test:
    kind: effect_band
    package: trace80
    band:
    - 0.75
    - 0.99
    min_share: 0.7
- id: H2
  belief: B2
  claim: TRACE50's relative reduction decreases as the susceptible share rises, adjusted for seed share and TRACE50's
    effect.
  test:
    kind: effect_direction
    package: trace50
    feature: s0 (calibration scale)
    direction: decreases
    adjust_for:
    - seed_share
    - effect:trace50
- id: H3
  belief: B2
  claim: Where s0 >= 0.9 TRACE50 leaves R_t above 1 and its relative reduction lies in 0.3-0.9 at >= 70% of points.
  test:
    kind: effect_band
    package: trace50
    band:
    - 0.3
    - 0.9
    min_share: 0.7
    where:
      s0 (calibration scale):
      - 0.9
      - 0.998
- id: H4
  belief: B3
  claim: The TRACE50/TRACE80 choice flips along s0 within 0.68-0.92.
  test:
    kind: flip_in
    a: trace80
    b: trace50
    feature: s0 (calibration scale)
    range:
    - 0.68
    - 0.92
- id: H5
  belief: B3
  claim: At s0 0.9-1.0 TRACE80 has the higher net benefit than TRACE50 at >= 70% of points.
  test:
    kind: paired_sign
    a: trace80
    b: trace50
    feature: s0 (calibration scale)
    range:
    - 0.9
    - 0.998
    sign: positive
    min_share: 0.7
- id: H6
  belief: B3
  claim: At s0 0.6-0.7 TRACE50 has the higher net benefit than TRACE80 at >= 70% of points.
  test:
    kind: paired_sign
    a: trace80
    b: trace50
    feature: s0 (calibration scale)
    range:
    - 0.6
    - 0.7
    sign: negative
    min_share: 0.7
- id: H7
  belief: B4
  claim: TRACE50's relative reduction decreases with the initial infected share (independently sampled).
  test:
    kind: effect_direction
    package: trace50
    feature: seed_share
    direction: decreases
- id: H8
  belief: B5
  claim: TRACE80's relative reduction does not vary with district population (|rho| bound within 0.3).
  test:
    kind: effect_direction
    package: trace80
    feature: pop
    direction: negligible
    equivalence: 0.3
